<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--APPV:2026-08-12.7:APPV-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEEVOGUE — نظام المشغل</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="فيفوق">
<meta name="theme-color" content="#FFFFFF">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@400;600;700;800&family=Italiana&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    /* محايدات نظام الواجهات */
    --bg:#F5F5F4; --paper:#FFFFFF; --line:#E7E7E4; --div:#F0F0EE;
    --ink:#18181B; --gray:#57534E; --faint:#8A8A85; --soft:#F4F4F2;
    /* أخضر فيفوق */
    --green:#4F6B4C; --green-dk:#3D5439; --green-lt:#EBF0EA;
    /* نبيتي فيفوق */
    --wine:#8E3B4C; --wine-dk:#6B2C39; --wine-lt:#F5EAEC;
    /* توافق خلفي */
    --ok:#4F6B4C; --bad:#8E3B4C; --warn:#8E3B4C; --cream:#F5F5F4; --sage:#9FB39A;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Almarai','Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;}
  button,.pill,.tabs button,.stat,.chip{touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  [dir="ltr"], [dir="ltr"] *{font-family:'Inter','Almarai',sans-serif;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;touch-action:manipulation;}
  header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .lgbox{width:36px;height:36px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand .lgbox img{width:100%;height:100%;object-fit:cover;transform:scale(2.1);}
  .brand .bname{font-family:'Inter';font-weight:700;letter-spacing:4px;font-size:15px;}
  header .right{display:flex;gap:8px;align-items:center;}
  header .who{font-size:13px;color:var(--gray);}
  .hbtn{background:var(--soft);color:var(--ink);border:0;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;}
  .hbtn.dark{background:var(--ink);color:#fff;}
  main{max-width:900px;margin:0 auto;padding:14px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;}
  .btn-ink{background:var(--ink);color:#fff;}
  .btn-wine{background:var(--green);color:#fff;}
  .btn-line{background:var(--paper);color:var(--ink);border:1px solid var(--ink);}
  .btn-ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);}
  .btn-ok{background:var(--green);color:#fff;}
  .btn-warn{background:var(--paper);color:var(--gray);border:1px solid var(--line);}
  .btn-bad{background:var(--wine);color:#fff;}
  .btn-big{width:100%;padding:15px;font-size:17px;border-radius:12px;margin-top:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tabs button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--gray);}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:12px;padding:3px 10px;background:var(--soft);color:#3a3a3a;}
  .chip svg{width:13px;height:13px;}
  .chip.working{background:var(--green);color:#fff;}
  .chip.wine{background:var(--wine-lt);color:var(--wine-dk);}
  .chip.sage{background:var(--green-lt);color:var(--green-dk);}
  .late{color:var(--bad);font-weight:900;}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:#4a4a4a;}
  input,select,textarea{width:100%;border:1px solid #D6D0C6;border-radius:9px;padding:10px;font-size:16px;background:var(--paper);color:var(--ink);}
  textarea{min-height:70px;}
  .muted{color:var(--gray);font-size:13px;}
  .title{font-weight:900;font-size:16px;margin-bottom:6px;}
  .lineitem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap;}
  .login-card{max-width:420px;margin:36px auto;text-align:center;}
  .login-card .btn{width:100%;margin-top:10px;}
  .thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;background:var(--soft);border:1px solid var(--line);}
  .thumb-lg{width:100%;max-height:220px;border-radius:12px;object-fit:cover;background:var(--soft);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;}
  [dir="ltr"] th,[dir="ltr"] td{text-align:left;}
  th{color:#55514b;font-size:12px;letter-spacing:.4px;}
  .empty{text-align:center;color:#9b968e;padding:34px 10px;font-size:15px;}
  .ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .sechead{display:flex;align-items:center;gap:10px;margin:20px 4px 12px;font-family:'Inter';font-weight:800;letter-spacing:2px;font-size:14px;}
  [dir="rtl"] .sechead{font-family:'Aref Ruqaa',serif;letter-spacing:0;font-size:20px;}
  .note-box{border:1px solid var(--line);}
  .lineitem{border-top:1px solid var(--div);}
  .sechead .ico{width:26px;height:26px;}
  .bignum{font-family:'Inter';font-weight:800;font-size:30px;line-height:1;}
  .biglabel{font-size:10px;letter-spacing:1px;color:var(--gray);font-weight:700;}
  .statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;}
  .stat .ico{margin:0 auto 6px;display:block;color:#4a4a4a;width:26px;height:26px;}
  .stat .nums{display:flex;justify-content:center;align-items:baseline;gap:10px;font-family:'Inter';font-weight:800;}
  .stat .n-all{font-size:28px;color:var(--ink);}
  .stat .n-go{font-size:20px;color:var(--green);}
  .stat .n-wait{font-size:20px;color:var(--wine);}
  .stat .cap{font-size:11px;letter-spacing:.5px;color:var(--faint);font-weight:700;margin-top:6px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:-6px 0 16px;font-size:12px;color:var(--gray);font-weight:700;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .d-all{background:var(--ink);} .d-go{background:var(--green);} .d-wait{background:var(--wine);}
  .wperf{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:18px;margin-bottom:12px;}
  .wperf h4{font-size:16px;margin-bottom:8px;}
  .best{background:var(--green-lt);color:var(--green-dk);font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;}
  .badge{background:var(--wine);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:800;margin-inline-start:4px;font-family:'Inter';}
  .tabs button.on .badge{background:#fff;color:var(--ink);}
  hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0;}
  /* مود بورد */
  /* مود بورد موزاييك — توزيع جميل مع أزرار حذف داخل كل صورة */
  .moodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:104px;gap:10px;margin-top:8px;
    background:var(--soft);padding:12px;border-radius:16px;border:1px solid var(--line);}
  .moodgrid .imgwrap{display:block;overflow:hidden;border-radius:12px;}
  .moodgrid .imgwrap:nth-child(5n+1){grid-row:span 2;grid-column:span 2;}
  .moodgrid .imgwrap:nth-child(5n+4){grid-row:span 2;}
  .moodimg{width:100%;height:100%;object-fit:cover;display:block;}
  /* شريط عنوان الكولكشن */
  .colhead{display:flex;align-items:center;gap:10px;background:var(--wine);color:#fff;
    border-radius:14px;padding:12px 14px;margin-bottom:16px;}
  .colhead-mid{flex:1;text-align:center;min-width:0;}
  .colhead-name{font-weight:800;font-size:19px;line-height:1.25;}
  [dir="rtl"] .colhead-name{font-family:'Aref Ruqaa',serif;font-size:23px;}
  .colhead-sub{font-size:12px;opacity:.85;margin-top:2px;}
  .colback{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .colback:hover{background:rgba(255,255,255,.3);}
  [dir="rtl"] .colback svg{transform:scaleX(-1);}
  .colhead .rowbtn{color:#fff;}
  .colhead .rowbtn:hover{background:rgba(255,255,255,.2);color:#fff;}
  .colcard{display:flex;gap:12px;align-items:center;cursor:pointer;}
  .colbar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px;}
  .colbar i{display:block;height:100%;background:var(--green);}
  .rowbtn{background:transparent;border:0;font-size:20px;line-height:1;color:var(--gray);cursor:pointer;padding:4px 10px;border-radius:8px;}
  .rowbtn:hover{background:var(--soft);color:var(--ink);}
  .swipe{position:relative;overflow:hidden;}
  .swipefront{position:relative;z-index:2;background:var(--paper);display:flex;justify-content:space-between;
    align-items:center;gap:8px;flex-wrap:wrap;width:100%;}
  .swipeback{position:absolute;inset:0;background:var(--wine-lt);display:flex;align-items:center;
    justify-content:flex-end;padding:0 18px;z-index:1;color:var(--wine);}
  [dir="rtl"] .swipeback{justify-content:flex-start;}
  .swipeback svg{width:26px;height:26px;}
  .overlay{position:fixed;inset:0;background:rgba(24,24,27,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;}
  .sheet{background:var(--paper);border-radius:16px;max-width:640px;width:100%;padding:18px;margin:10px 0 40px;}
  .imgrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .imgwrap{position:relative;display:inline-block;line-height:0;}
  .rm{position:absolute;top:6px;inset-inline-end:6px;background:var(--wine);color:#fff;border:2px solid #fff;
    border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:0;}
  .rm:hover{background:var(--wine-dk);transform:scale(1.08);}
  .timer{font-family:'Inter';font-size:13px;font-weight:700;}
  .t-ok{color:var(--green);} .t-late{color:var(--wine);}
  .wcard{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:14px;margin-bottom:10px;}
  .wtop{display:flex;gap:12px;align-items:flex-start;}
  .wmeta{display:flex;gap:14px;margin:10px 0 2px;flex-wrap:wrap;}
  .wmeta>div{text-align:center;}
  .note-box{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .pill{border:1.5px solid var(--ink);border-radius:16px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--paper);}
  .pill.on{background:var(--ink);color:#fff;}
  .checkrow{display:flex;gap:10px;align-items:center;padding:6px 0;}
  .checkrow input{width:auto;}
  .banner{background:var(--wine-lt);color:var(--wine-dk);border:1px solid #E8D4D8;border-radius:12px;padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;}
  .banner .btn{background:var(--wine);color:#fff;}
  .breakbar{background:var(--green-lt);color:var(--green-dk);border:1px solid #DCE5DA;border-radius:12px;padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;}
  .breakbar.over{background:var(--wine-lt);color:var(--wine-dk);border-color:#E8D4D8;}
  .keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:280px;margin:8px auto;}
  .keypad button{font-size:22px;padding:16px;}
  @media(max-width:520px){.grid3{grid-template-columns:1fr 1fr;}}
  .netchip{display:none;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:20px;padding:5px 11px;letter-spacing:.2px;}
  .netchip.off{background:#F3E3E6;color:#8C2F3E;border:1px solid #E8D4D8;}
  .netchip.pend{background:#FBF0DC;color:#8A6420;border:1px solid #F0E0BE;}
  .netchip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:vvpulse 1.4s ease-in-out infinite;}
  @keyframes vvpulse{0%,100%{opacity:1}50%{opacity:.25}}
  .offbar{background:#F3E3E6;color:#8C2F3E;border:1px solid #E8D4D8;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700;font-size:14px;}
  .partcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--paper);}
  .partcard-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .partcard-h svg{width:18px;height:18px;}
  .partcard label{margin-top:8px;}
  .embcard{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--soft);}

  /* ===== جدول القياسات للنشر — هوية فيفوق، مربع 1080×1080 ===== */
  #scWrap{position:fixed;inset-inline-start:-9999px;top:0;}
  .sc{--sccols:4;width:540px;height:540px;background:#f7f4ee;color:#201c18;
      display:flex;flex-direction:column;padding:34px 38px 26px;overflow:hidden;
      font-family:'Tajawal',sans-serif;box-sizing:border-box;}
  .sc *{box-sizing:border-box;}
  .sc-head{position:relative;height:168px;flex:0 0 auto;display:flex;justify-content:space-between;gap:18px;}
  .sc-txt{flex:1 1 auto;min-width:0;}
  .sc-eyebrow{font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:3px;color:#6e6558;}
  .sc-title{font-family:'Italiana',serif;font-size:34px;font-weight:400;line-height:1.08;margin:8px 0 0;unicode-bidi:plaintext;}
  .sc-sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;margin:4px 0 12px;color:#6e6558;unicode-bidi:plaintext;}
  .sc-rule{width:38px;height:2px;background:#201c18;margin-bottom:10px;}
  .sc-badge{font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:2px;color:#6e6558;text-transform:uppercase;unicode-bidi:plaintext;}
  .sc-photo{flex:0 0 130px;width:130px;height:168px;border-radius:6px;overflow:hidden;background:#eee8dc;border:1px solid #d8d0bf;position:relative;}
  .sc-photo div{position:absolute;inset:0;background-size:cover;background-position:center;}
  .sc-table{flex:1;display:flex;flex-direction:column;margin-top:18px;min-height:0;}
  .sc-hrow,.sc-drow{display:grid;grid-template-columns:repeat(var(--sccols),1fr);align-items:center;}
  .sc-hrow{border-bottom:1.5px solid #201c18;flex:0 0 auto;}
  .sc-hcell{padding:10px 5px 8px;font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;
            text-align:center;text-transform:uppercase;letter-spacing:1.2px;unicode-bidi:plaintext;}
  .sc-hcell:first-child{text-align:start;}
  .sc-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .sc-drow{flex:1;border-bottom:1px solid #e8e2d4;min-height:20px;}
  .sc-drow:last-child{border-bottom:none;}
  .sc-dcell{padding:2px 5px;font-family:'Outfit',sans-serif;font-size:13px;text-align:center;color:#3a342c;unicode-bidi:plaintext;}
  .sc-dcell:first-child{text-align:start;font-weight:600;color:#201c18;}
  .sc-frule{width:56px;height:1px;background:#201c18;margin:16px auto 8px;flex:0 0 auto;}
  .sc-brand{text-align:center;font-family:'Outfit',sans-serif;font-weight:700;letter-spacing:6px;font-size:12px;flex:0 0 auto;}
  .sc-prev{border:1px solid var(--line);border-radius:10px;overflow:hidden;width:270px;height:270px;margin:10px auto;}
  .sc-prev > .sc{transform:scale(.5);transform-origin:top left;}
  .extbar{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;background:var(--paper);}
  .extbar.on{background:var(--wine-lt);border-color:#E8D4D8;color:var(--wine-dk);}
  .sw input{display:none;}
  .sw .track{display:block;width:46px;height:26px;border-radius:14px;background:#D8D3CA;position:relative;transition:background .18s;cursor:pointer;}
  .sw .knob{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .18s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .sw input:checked + .track{background:var(--wine);}
  .sw input:checked + .track .knob{inset-inline-start:23px;}

/* ---- صفحة التصميم: ستيبر أربع مراحل + أقسام كروت ---- */
.dstepper{display:flex;justify-content:space-between;position:relative;margin:2px 0 16px}
.dstepper::before{content:"";position:absolute;top:16px;inset-inline:18px;height:2px;background:var(--line);z-index:0}
.dstep{position:relative;z-index:1;flex:1;text-align:center;padding:0 2px}
.dstep .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:2px solid var(--line);color:var(--faint);font-weight:800;font-size:13px;transition:.2s}
.dstep.done .dot{background:var(--sage);border-color:var(--sage);color:#fff}
.dstep.active .dot{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 0 0 4px rgba(24,24,27,.07)}
.dstep .lbl{font-size:11px;color:var(--faint);line-height:1.25}
.dstep.active .lbl{color:var(--ink);font-weight:700}
.dstep.done .lbl{color:var(--green)}
.dsec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.dsec>.sechead{margin-top:0}
.dsec input[type=file]{margin-top:8px}

/* ---- عرض الكولكشن: شريط المراحل + كروت تصاميم مرتبة ---- */
.dpipe{display:flex;gap:8px;margin:6px 0 8px;flex-wrap:wrap}
.dpipe .pill{flex:1;min-width:70px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 6px}
.dpipe .pill b{display:block;font-size:19px;line-height:1.1;color:var(--ink)}
.dpipe .pill span{font-size:11px;color:var(--faint)}
.stagehdr{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-weight:800;font-size:14px;letter-spacing:1px;color:var(--ink)}
.stagehdr::after{content:"";flex:1;height:1px;background:var(--line)}
.stagehdr .n{background:var(--soft);color:var(--gray);border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700}
.dcard{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:background .15s}
.dcard:active{background:var(--soft)}
.dcard .dthumb{width:52px;height:52px;border-radius:10px;flex:0 0 auto;object-fit:cover;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#c8c2b8}
.dcard-body{flex:1;min-width:0}
.dcard-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function skuNext(prefix, arr, field){
  let max=0; const re=new RegExp("^"+prefix+"-(\\d+)$");
  (arr||[]).forEach(x=>{ const m=String((x&&x[field||"sku"])||"").match(re); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
  return prefix+"-"+String(max+1).padStart(4,"0");
}

function parseRest(url){
  try{
    const u=new URL(url);
    const m=u.pathname.match(/\/rest\/v1\/([a-z_]+)$/);
    if(!m) return null;
    const filters=[];
    u.searchParams.forEach((v,k)=>{
      if(k==="select"||k==="order"||k==="limit"||k==="offset") return;
      const mm=String(v).match(/^(eq|neq)\.(.*)$/);
      if(mm) filters.push({col:k,op:mm[1],val:mm[2]});
    });
    return {table:m[1], filters};
  }catch(e){ return null; }
}
function rowHit(r,fs){
  return fs.every(f=>{
    const v=r[f.col], s=(v===null||v===undefined)?"":String(v);
    return f.op==="eq" ? s===f.val : s!==f.val;
  });
}
/* يطبّق العملية محلياً حتى يشوف الموظف نتيجة ضغطته فوراً بدون إنترنت */
function applyLocal(url, method, bodyText){
  const info=parseRest(url); if(!info) return;
  const key=TBL2DB[info.table]; if(!key) return;
  const arr=DB[key]; if(!Array.isArray(arr)) return;
  let body=null; try{ body = bodyText? JSON.parse(bodyText) : null; }catch(e){}
  if(method==="POST" && body){ (Array.isArray(body)?body:[body]).forEach(r=>arr.unshift({...r})); }
  else if(method==="PATCH" && body){ arr.forEach((r,i)=>{ if(rowHit(r,info.filters)) arr[i]={...r,...body}; }); }
  else if(method==="DELETE"){ for(let i=arr.length-1;i>=0;i--) if(rowHit(arr[i],info.filters)) arr.splice(i,1); }
}
function wantsBody(opts){
  try{ const p=new Headers(opts.headers||{}).get("prefer")||""; return /return=representation/i.test(p); }
  catch(e){ return false; }
}
async function vvFetch(url, opts){
  opts = opts || {};
  const method = (opts.method||"GET").toUpperCase();
  const isWrite = method!=="GET" && method!=="HEAD";
  try{
    const r = await fetch(url, opts);
    if(!NETOK){ NETOK=true; paintNet(); flushQueue(); }
    return r;
  }catch(err){
    NETOK=false;
    if(isWrite && !wantsBody(opts) && String(url).includes("/rest/v1/")){
      let bodyText = (typeof opts.body==="string") ? opts.body : null;
      if(method==="POST" && bodyText){
        try{
          let b=JSON.parse(bodyText);
          const stamp=r=>{ if(r && typeof r==="object" && r.id===undefined) r.id=newId(); return r; };
          b = Array.isArray(b)? b.map(stamp) : stamp(b);
          bodyText = JSON.stringify(b);
        }catch(e){}
      }
      const h={}; try{ new Headers(opts.headers||{}).forEach((v,k)=>h[k]=v); }catch(e){}
      const q=qGet(); q.push({url:String(url), method, headers:h, body:bodyText, at:Date.now()}); qSet(q);
      applyLocal(String(url), method, bodyText);
      cacheDB(); paintNet();
      return new Response(null,{status:204,statusText:"queued offline"});
    }
    paintNet();
    throw err;
  }
}
async function flushQueue(){

      catch(e){ NETOK=false; paintNet(); return; }
      if(r.status>=500){ paintNet(); return; }   /* خلل مؤقت في السيرفر — نعيد لاحقاً */
      q.shift(); qSet(q);                         /* 4xx: نسقطها حتى لا تعلق الطابور للأبد */
    }
    NETOK=true; paintNet();
    if(!document.getElementById("ov")) await refresh();
  } finally { flushing=false; }
}
function paintNet(){
  const c=document.getElementById("netchip"); if(!c) return;
  const n=qGet().length;
  if(NETOK && !n){ c.style.display="none"; return; }
  c.style.display="inline-flex";
  if(!NETOK){ c.className="netchip off"; c.innerHTML=`<span class="dot"></span>${isAr()?"بدون إنترنت":"OFFLINE"}${n?" · "+n:""}`; }
  else { c.className="netchip pend"; c.innerHTML=`<span class="dot"></span>${isAr()?"يُرسل… "+n:"SYNCING "+n}`; }
}

const APP_VERSION="2026-08-12.7";
async function checkVersion(){
  try{
    const url=location.pathname.split("?")[0];
    const r=await fetch(url+"?cb="+Date.now(), {cache:"no-store", headers:{Range:"bytes=0-2047"}});
    if(!r.ok && r.status!==206) return;
    const head=await r.text();
    const m=head.match(/APPV:(.*?):APPV/);
    if(!m) return;
    const remote=(m[1]||"").trim();
    if(!remote || remote===APP_VERSION) return;
    const u=new URL(location.href);
    if(u.searchParams.get("v")===remote) return;   /* حاجز ضد التكرار */
    u.searchParams.set("v", remote);
    location.replace(u.toString());
  }catch(e){}
}

function toAsciiDigits(str){
  if(str==null) return str;
  return String(str)
    .replace(/[\u0660-\u0669]/g, d=>String(d.charCodeAt(0)-0x0660))
    .replace(/[\u06F0-\u06F9]/g, d=>String(d.charCodeAt(0)-0x06F0))
    .replace(/\u066B/g, ".").replace(/\u066C/g, "");
}
document.addEventListener("input", function(e){
  const t=e.target; if(!t||(t.tagName!=="INPUT"&&t.tagName!=="TEXTAREA")) return;
  const im=(t.getAttribute("inputmode")||"").toLowerCase();
  if(t.type==="number"||im==="numeric"||im==="decimal"){
    const c=toAsciiDigits(t.value);
    if(c!==t.value){ const pos=t.selectionStart; t.value=c; try{t.setSelectionRange(pos,pos);}catch(_){} }
  }
}, true);

/* ضغط الصور قبل الرفع — يوفر ~90% من المساحة */
async function compressImage(file, maxDim=1600, quality=0.82){
  if(!file.type.startsWith("image/") || file.type==="image/gif") return file;
  try{
    const bmp = await createImageBitmap(file);
    let {width:w, height:h} = bmp;
    if(Math.max(w,h) > maxDim){ const r=maxDim/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(bmp,0,0,w,h);
    const blob = await new Promise(res=>c.toBlob(res,"image/jpeg",quality));
    if(!blob || blob.size>=file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}
async function uploadFile(file, folder){
  const f = await compressImage(file);
  const ext=(f.name.split(".").pop()||"bin");
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from("files").upload(path,f);
  if(error){alert("فشل الرفع: "+error.message);return null;}
  return sb.storage.from("files").getPublicUrl(path).data.publicUrl;
}

const SIGN_TTL = 6*24*3600;
let SIGNED = {}; try{ SIGNED = JSON.parse(localStorage.getItem("vv_signed")||"{}"); }catch(e){}
function filePath(u){ const m=String(u).match(/\/object\/(?:public|sign)\/files\/([^?]+)/); return m? decodeURIComponent(m[1]) : null; }
async function signedUrl(u){
  const path=filePath(u); if(!path) return u;
  const c=SIGNED[path];
  if(c && c.exp > Date.now()/1000 + 3600) return c.url;
  try{
    const {data,error}=await sb.storage.from("files").createSignedUrl(path, SIGN_TTL);
    if(error||!data) return u;
    SIGNED[path]={url:data.signedUrl, exp:Math.floor(Date.now()/1000)+SIGN_TTL};
    try{ localStorage.setItem("vv_signed", JSON.stringify(SIGNED)); }catch(e){}
    return data.signedUrl;
  }catch(e){ return u; }
}

async function signHtml(html){
  const urls=[...new Set(html.match(/https:\/\/[^"'\s)]+\/object\/public\/files\/[^"'\s)]+/g)||[])];
  for(const u of urls){ html = html.split(u).join(await signedUrl(u)); }

function toCSV(rows){
  if(!rows.length) return "";
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const esc2=v=>{ if(v===null||v===undefined) return ""; const s=typeof v==="object"?JSON.stringify(v):String(v);
    return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return keys.join(",")+"\n"+rows.map(r=>keys.map(k=>esc2(r[k])).join(",")).join("\n");
}

async function autoBackup(force){
  if(!NETOK) return null;
  if(!force && localStorage.getItem("vv_lastbk")===today()) return null;
  if(!(DB.workers||[]).length && !(DB.orders||[]).length) return null;   /* لا نحفظ قاعدة فاضية فوق نسخة سليمة */
  try{
    const blob=new Blob([JSON.stringify(bkPayload())],{type:"application/json"});
    const tag=Math.random().toString(36).slice(2,8);
    const up=await sb.storage.from("backups").upload(`backups/daily-${today()}-${tag}.json`, blob, {upsert:true});
    if(up.error) return null;
    if(new Date().getDay()===6) await sb.storage.from("backups").upload(`backups/weekly-${today()}-${tag}.json`, blob, {upsert:true});
    localStorage.setItem("vv_lastbk", today());
    await rotateBackups();
    return true;
  }catch(e){ return null; }
}
async function rotateBackups(){
  try{
    const {data}=await sb.storage.from("backups").list("backups",{limit:300});
    if(!data) return;
    const stale=(pre,keep)=>data.filter(f=>f.name.startsWith(pre))
      .sort((a,b)=> a.name<b.name?1:-1).slice(keep).map(f=>"backups/"+f.name);
    const del=[...stale("daily-",7), ...stale("weekly-",4)];
    if(del.length) await sb.storage.from("backups").remove(del);
  }catch(e){}
}
async function listBackups(){
  try{
    const {data}=await sb.storage.from("backups").list("backups",{limit:300});
    return (data||[]).sort((a,b)=> a.name<b.name?1:-1);
  }catch(e){ return []; }
}

  const box=el("bkBox"); if(!box) return;

    const wk=f.name.startsWith("weekly-");

/* التطريز صار لكل قطعة تصميم: after_cut يوقف مرحلة القص، after_sew يوقف مرحلة الخياطة */
const WHEN2STAGE={after_cut:"cut", after_sew:"sew"};
/* قد يكون على القطعة أكثر من تطريز/طباعة — نرجّعها دايماً كقائمة */
function embOf(p, partAr){
  let v=(p.emb_parts||{})[partAr];
  if(!v) return [];
  if(!Array.isArray(v)) v=[v];
  return v.filter(x=>x&&x.kind);
}
function lineNeedsEmb(p){ return Object.keys(p.emb_parts||{}).some(k=>embOf(p,k).length); }
function nextStage(stage, p){
  if(stage==="cut") return "sew";
  if(stage==="sew") return "qc";
  if(stage==="pack") return "shipped";
  if(stage==="ext") return "qc";
  return stage;
}

function stageBlocked(lineId, stage, doneId, justAddedEmb){
  if(justAddedEmb) return true;
  const l=DB.lines.find(x=>x.id===lineId); if(!l) return true;
  const p=product(l.product_id);
  const own=DB.parts.filter(x=>x.line_id===lineId && (x.stage||"sew")===stage && x.id!==doneId && x.status!=="done");
  if(own.length) return true;
  const emb=DB.parts.filter(x=>x.line_id===lineId && x.stage==="emb" && x.id!==doneId && x.status!=="done"
    && WHEN2STAGE[x.emb_when||"after_sew"]===stage);
  return emb.length>0;
}

/* ===== التقدير = متوسط أداء كل العمال، لا تقدير المدير ===== */
const EST_MIN_SAMPLE = 3;    /* أقل عدد قراءات سليمة قبل ما نعتمد المتوسط كتقدير */
const RATE_MIN_SAMPLE = 5;   /* أقل عدد قراءات قبل ما نعرض تقييماً لعامل */
function shiftMinutes(){
  const [a,b]=(DB.settings.work_start||"09:00").split(":").map(Number);
  const [c,d]=(DB.settings.work_end||"18:00").split(":").map(Number);
  const m=(c*60+d)-(a*60+b);
  return (m>0&&m<24*60)? m : 540;
}
/* قراءة شاذة = صفر أو أطول من يوم دوام كامل (نسيان الضغط على «انتهيت») */
function oddReading(minutes){ return !(minutes>0) || minutes>shiftMinutes(); }
function perPieceMins(evs){
  const out=[];
  evs.forEach(e=>{
    const raw=workedMins(e.started_at,e.finished_at);
    if(oddReading(raw)) return;
    const l=DB.lines.find(x=>x.id===e.line_id);
    out.push(raw/(((l&&l.qty)||1)));
  });
  return out;
}
/* يقصّ الأطراف البعيدة عن الوسيط حتى لا تفسد قراءة واحدة المتوسط */
function trimOutliers(v){
  if(v.length<3) return v;
  const s=[...v].sort((a,b)=>a-b), med=s[Math.floor(s.length/2)];
  return v.filter(x=> x<=med*3 && x>=med/3);
}
function eventsFor(productId, stage, partAr){
  return DB.events.filter(e=>e.stage===stage&&e.started_at&&e.finished_at&&e.worker_id&&
    DB.lines.some(l=>l.id===e.line_id&&l.product_id===productId)&&
    (!partAr || (e.part_id && (DB.parts.find(x=>x.id===e.part_id)||{}).part_ar===partAr)));
}
function learnedEst(productId, stage, partAr){
  const vals=trimOutliers(perPieceMins(eventsFor(productId,stage,partAr)));
  if(vals.length < EST_MIN_SAMPLE) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function estSample(productId, stage, partAr){
  return trimOutliers(perPieceMins(eventsFor(productId,stage,partAr))).length;
}
/* التقدير اليدوي صار لكل قطعة: وقت قص ووقت خياطة مستقلين */
function manualEst(p, stage, partAr){
  if(stage==="cut"){
    if(partAr && (p.est_cut_parts||{})[partAr]) return (p.est_cut_parts||{})[partAr];
    if(!partAr){ const v=Object.values(p.est_cut_parts||{}).filter(Boolean);
      if(v.length) return v.reduce((a,b)=>a+b,0); }
    return p.est_cut_min || null;                     /* منتجات قديمة */
  }
  if(stage==="sew"){
    if(partAr && (p.est_parts||{})[partAr]) return (p.est_parts||{})[partAr];
    if(!partAr){ const v=Object.values(p.est_parts||{}).filter(Boolean);
      if(v.length) return v.reduce((a,b)=>a+b,0); }
    return p.est_sew_min || null;
  }
  return null;
}
function estFor(p, stage, partAr, qty){
  const learned = learnedEst(p.id, stage, partAr);
  const base = learned || manualEst(p, stage, partAr);   /* المتوسط الفعلي أولاً — واليدوي مؤقت */
  return base? base*(qty||1) : null;
}

/* ================= وحدة الصين — عدة السوق ================= */
const YARD=0.9144;
/* ===== قنوات الشراء ===== */
const CHAN_DEFAULT={china:{label:"الصين (استيراد)",shortage:4,spare:5,ship_mode:"perpiece",ship_val:0,commission:5,currency:"CNY"},
  local:{label:"السوق المحلي",shortage:2,spare:5,ship_mode:"none",ship_val:0,commission:0,currency:"KWD"}};
function channelsCfg(){ const c=(DB.settings&&DB.settings.channels); return (c&&Object.keys(c).length)? c : CHAN_DEFAULT; }
function chan(key){ const c=channelsCfg(); return c[key]||c.local||CHAN_DEFAULT.local; }
function chanKeys(){ return Object.keys(channelsCfg()); }
function chanLabel(key){ const c=chan(key); if(!isAr()){ if(key==="china") return "China (import)"; if(key==="local") return "Local market"; if(c.label_en) return c.label_en; } return c.label||key; }
let chChannel = localStorage.getItem("vv_chan")||"china";
/* الاحتياج بالياردات حسب هوامش القناة */
function needYards(mpp, qty, channelKey){
  const c=chan(channelKey), base=(mpp||0)*(qty||0);
  const meters=base*(1+(c.shortage||0)/100)+base*(c.spare||0)/100;
  return {base, meters, yards: meters/YARD};
}
/* التكلفة النهائية على القطعة حسب القناة */
function landedCost(o){
  const c=chan(o.channel), cur=o.currency||c.currency||"KWD";
  const _q=(o.buy_qty!=null?o.buy_qty:(o.qty_yd||0));
  const raw=_q*(o.unit_price||0);
  const rawKWD = cur==="KWD"? raw : toKWD(raw,cur);
  if(rawKWD==null) return null;
  const commission=rawKWD*((c.commission||0)/100);
  let shipping=0;
  if(c.ship_mode==="flat") shipping=(c.ship_val||0);
  else if(c.ship_mode==="perpiece") shipping=(c.ship_val||0)*(o.plan_qty||0);
  const total=rawKWD+commission+shipping;
  return {rawKWD, commission, shipping, total, per:o.plan_qty? total/(o.plan_qty):null};
}

let _pendSet=null, _pendUrls={}, _pupBusy=false;

function fxGet(){ try{ return JSON.parse(localStorage.getItem("vv_fx")||"{}"); }catch(e){ return {}; } }
function fxSet(o){

  const tr=activeTrip(); if(tr && NETOK){ try{ sb.from("trips").update({fx:o}).eq("id",tr.id).then(()=>{}); }catch(e){} }
}
async function fxAuto(force){
  const f=fxGet();
  if(!force && f.at && (Date.now()-f.at)<12*3600*1000 && f.cny) return f;
  if(!NETOK) return f;
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/KWD");
    const j=await r.json();
    if(j && j.rates && j.rates.CNY && j.rates.USD){
      const o={cny:1/j.rates.CNY, usd:1/j.rates.USD, at:Date.now(), src:"auto"};
      fxSet(o); return o;
    }
  }catch(e){}
  return f;
}
function fmtKD(x){ return x==null? "—" : (Math.round(x*1000)/1000).toFixed(3); }
function toKWD(amount, cur){
  const f=fxGet();
  if(cur==="KWD") return amount;
  const r=cur==="CNY"? f.cny : f.usd;
  return (r && amount!=null)? amount*r : null;
}
function activeTrip(ch){ ch=ch||chChannel; const list=(DB.trips||[]).filter(t=>(t.channel||"china")===ch); return list.find(t=>t.status==="active")||list[0]||null; }
function fxAge(){ const f=fxGet(); if(!f.at) return isAr()?"ما في سعر محفوظ":"no rate saved";
  const h=Math.round((Date.now()-f.at)/3600000);
  return (f.src==="manual"?(isAr()?"يدوي":"manual"):(isAr()?"تلقائي":"auto"))+" · "+(h<1?(isAr()?"قبل شوي":"now"):(isAr()?("قبل "+h+" ساعة"):(h+"h ago")));
}

/* -- تخزين صور العينات محلياً (بدون إنترنت) -- */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open("vv_photos",1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore("p"); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbDo(mode, fn){ return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction("p",mode), st=tx.objectStore("p"); const rq=fn(st);
  tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); })); }
const idbPut=(k,v)=>idbDo("readwrite",st=>st.put(v,k));
const idbGet=(k)=>idbDo("readonly",st=>st.get(k));
const idbDel=(k)=>idbDo("readwrite",st=>st.delete(k));
const idbKeys=()=>idbDo("readonly",st=>st.getAllKeys());
async function pendInit(){
  if(_pendSet) return _pendSet;
  try{ _pendSet=new Set(await idbKeys()||[]); }catch(e){ _pendSet=new Set(); }
  return _pendSet;
}
async function displayUrl(u){
  const path=filePath(u);
  if(path){
    await pendInit();
    if(_pendSet.has(path)){
      if(!_pendUrls[path]){ try{ const b=await idbGet(path); if(b) _pendUrls[path]=URL.createObjectURL(b); }catch(e){} }
      if(_pendUrls[path]) return _pendUrls[path];
    }
  }
  return signedUrl(u);
}
async function uploadPendingPhotos(){
  if(_pupBusy || !NETOK || !AUTHED || !sb) return;
  _pupBusy=true;
  try{
    await pendInit();
    for(const path of [..._pendSet]){
      const blob=await idbGet(path);
      if(!blob){ _pendSet.delete(path); continue; }
      const {error}=await sb.storage.from("files").upload(path, blob, {upsert:true, contentType:"image/jpeg"});
      if(error && !/exists|duplicate/i.test(error.message||"")) continue;
      await idbDel(path); _pendSet.delete(path);
      if(_pendUrls[path]){ try{URL.revokeObjectURL(_pendUrls[path]);}catch(e){} delete _pendUrls[path]; }
    }
  }catch(e){} finally{ _pupBusy=false; }
}
async function captureSamplePhoto(file){
  const f=await compressImage(file, 1400, 0.8);
  const path=`samples/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  let stored=false;
  try{ await idbPut(path, f); await pendInit(); _pendSet.add(path); stored=true; }catch(e){}
  if(!stored){
    const {error}=await sb.storage.from("files").upload(path, f, {contentType:"image/jpeg"});
    if(error){ alert(isAr()?"فشل حفظ الصورة":"Photo save failed"); return null; }
  }
  uploadPendingPhotos();
  return sb.storage.from("files").getPublicUrl(path).data.publicUrl;
}

  /* تنظيم الدفتر بالكولكشنات: نجمّع التصاميم حسب الكولكشن (زي قسم التصميم) */

/* يعطي كل بند تشيك ليست معرّف ثابت حتى نربط العينات به */
function ensureChkIds(d){
  if(!d||!Array.isArray(d.checklist)) return d;
  let ch=false;
  d.checklist.forEach(it=>{ if(it && !it.id){ it.id="ci-"+Math.random().toString(36).slice(2,9); ch=true; } });
  if(ch){ try{ sb.from("design_projects").update({checklist:d.checklist}).eq("id",d.id); }catch(e){} }
  return d;
}
/* يبني أمر شراء من عينة واحدة: يسجّل المورد + يدخل الخام + يطلع الكمية من بند التشيك ليست (19ب) */
async function poFromSample(x){
  const tr=activeTrip(chChannel);
  const d= x.design_id? (design_(x.design_id)||{}) : {};
  const chk=(d.checklist||[]);
  let supId=x.supplier_id;
  if(!supId && x.supplier_name){
    const ex=(DB.suppliers||[]).find(sp=>(sp.name||"")===x.supplier_name && (sp.shop_no||"")===(x.shop_no||""));
    if(ex) supId=ex.id;
    else { const sup={id:newId(), kind:"fabric", name:x.supplier_name, shop_no:x.shop_no||null};
      await sb.from("suppliers").insert(sup); DB.suppliers.unshift(sup); supId=sup.id; }
  }
  const isAcc=x.kind==="accessory";
  const fabName=x.fabric_type||(isAcc?(isAr()?"إكسسوار":"accessory"):(isAr()?"خام":"fabric"));
  let mat=(DB.materials||[]).find(m=>(m.name||"")===fabName && (m.supplier||"")===(x.supplier_name||""));
  if(!mat){ mat={id:newId(), sku:genSKU("material"), name:fabName, unit:isAcc?"حبة":"متر",
      supplier:x.supplier_name||null, price:x.price||null, active:true};
    await sb.from("materials").insert(mat); DB.materials.unshift(mat); }
  const ci = x.checklist_item_id? chk.find(c=>c.id===x.checklist_item_id)
           : (chk.find(c=>String(c.name||"").trim()===String(fabName).trim()) || chk.find(c=>(c.kind==="accessory")===isAcc));
  let qty_yd=null, plan_qty=null, buy_unit=null, buy_qty=null, plan_meters=null;
  if(isAcc){ buy_unit="count"; if(ci&&ci.qty){ plan_qty=parseInt(ci.qty)||null; buy_qty=plan_qty; } }
  else {
    const target=(chChannel==="china")?"yard":"meter";
    const ciUnit=ci?(ci.unit||"متر"):"متر";
    let qMeters=null,qYards=null;
    if(ci&&ci.qty){ if(ciUnit==="يارد"||ciUnit==="yard"){ qYards=parseFloat(ci.qty); qMeters=qYards*YARD; } else { qMeters=parseFloat(ci.qty); qYards=qMeters/YARD; } }
    if(target==="yard"){ buy_unit="yard";
      if(qMeters!=null && (ciUnit==="متر"||ciUnit==="m")){ buy_qty=Math.ceil(qMeters/YARD); plan_meters=Math.round(qMeters*100)/100; }
      else if(qYards!=null){ buy_qty=qYards; }
    } else { buy_unit="meter"; if(qMeters!=null) buy_qty=Math.round(qMeters*100)/100; }
    qty_yd=(buy_unit==="yard")?buy_qty:(qYards!=null?qYards:null);
  }
  const po={id:newId(), trip_id:tr?tr.id:null, channel:chChannel, design_id:x.design_id||null,
    supplier_id:supId||null, supplier_name:x.supplier_name||null, material_id:mat.id, sample_id:x.id,
    fabric_name:fabName, kind:isAcc?"accessory":"fabric", unit:buy_unit,
    buy_unit:buy_unit, buy_qty:buy_qty, plan_meters:plan_meters,
    qty_yd:qty_yd, plan_qty:plan_qty, unit_price:x.price||null, currency:x.currency||chan(chChannel).currency,
    deliver_status:"ordered", pay_log:[], status:"planned"};
  const {error}=await sb.from("purchases").insert(po);
  if(!error || /queued/i.test(error.message||"")){ if(!(DB.purchases||[]).some(z=>z.id===po.id)) DB.purchases.unshift(po); return true; }
  alert(error.message||"error"); return false;
}
/* ★ اعتماد عينة → يولّد أمر شراء مباشرة (19ب) */
async function sampleStar(id){
  const x=(DB.samples||[]).find(s=>s.id===id); if(!x) return;
  if(x.status==="shortlist") return;
  if(!(DB.purchases||[]).some(pp=>pp.sample_id===id)){ const ok=await poFromSample(x); if(!ok) return; }
  await sb.from("trip_samples").update({status:"shortlist"}).eq("id",id); x.status="shortlist";
  cacheDB(); render();
}
/* تراجع عن الاعتماد: يشيل أمر الشراء المخطط ويرجّع العينة مرشّحة */
async function sampleUnstar(id){
  const x=(DB.samples||[]).find(s=>s.id===id); if(!x) return;
  const po=(DB.purchases||[]).find(pp=>pp.sample_id===id && pp.status==="planned");
  if(po){ await sb.from("purchases").delete().eq("id",po.id); DB.purchases=DB.purchases.filter(pp=>pp.id!==po.id); }
  await sb.from("trip_samples").update({status:"candidate"}).eq("id",id); x.status="candidate";
  cacheDB(); render();
}
/* ✕ رفض العينة — تبقى للرجوع */
async function sampleDelete(id){
  const x=(DB.samples||[]).find(s=>s.id===id);
  if(!confirm(isAr()?`حذف هذه العينة${x&&x.fabric_type?` («${x.fabric_type}»)`:""}؟`:"Delete this sample?")) return;
  const po=(DB.purchases||[]).find(pp=>pp.sample_id===id && pp.status==="planned");
  if(po){ await sb.from("purchases").delete().eq("id",po.id); DB.purchases=(DB.purchases||[]).filter(pp=>pp.id!==po.id); }
  await sb.from("trip_samples").delete().eq("id",id);
  DB.samples=(DB.samples||[]).filter(s=>s.id!==id);
  cacheDB(); render();
}
async function sampleReject(id){
  await sb.from("trip_samples").update({status:"rejected"}).eq("id",id);
  const x=(DB.samples||[]).find(s=>s.id===id); if(x) x.status="rejected"; render();
}
async function sampleRestore(id){
  await sb.from("trip_samples").update({status:"candidate"}).eq("id",id);
  const x=(DB.samples||[]).find(s=>s.id===id); if(x) x.status="candidate"; render();
}
/* اعتماد جماعي (اختياري): يعتمد كل عينات التصميم غير المرفوضة */
async function approveDesignPurchase(designId){
  const chosen=(DB.samples||[]).filter(x=>x.design_id===designId && (x.status||"candidate")==="candidate");
  if(!chosen.length) return alert(isAr()?"ما في عينات جاهزة للاعتماد":"Nothing to approve");
  let made=0;
  for(const x of chosen){
    if((DB.purchases||[]).some(pp=>pp.sample_id===x.id)) continue;
    const ok=await poFromSample(x);
    if(ok){ await sb.from("trip_samples").update({status:"shortlist"}).eq("id",x.id); x.status="shortlist"; made++; }
  }
  cacheDB();
  alert(isAr()?`تم توليد ${made} أمر شراء — تلقاهم في «أوامر الشراء»`:`${made} POs generated`);
  chTab="purch"; render();
}

  render();
}

function fmtN(v){ return (Math.round((v||0)*100)/100).toLocaleString("en-US"); }
function fromKWD(kwd,cur){ if((cur||"KWD")==="KWD") return kwd; const per=toKWD(1,cur); return (per&&per>0)? kwd/per : null; }
function toCur(amt,from,to){ from=from||"KWD"; to=to||"KWD"; if(from===to) return parseFloat(amt)||0; const k=toKWDsafe(amt,from); const r=fromKWD(k,to); return r==null?(parseFloat(amt)||0):r; }
function poDealTotals(po){
  const cur=po.currency||"KWD";
  const q=(po.buy_qty!=null?po.buy_qty:(po.qty_yd||0));
  const total=q*(po.unit_price||0);
  let paid;
  if(po.paid) paid=total;
  else { const log=Array.isArray(po.pay_log)?po.pay_log:[]; paid = log.length? log.reduce((a,pp)=>a+toCur(pp.amount,pp.currency,cur),0) : (po.deposit?toCur(po.deposit,po.currency,cur):0); }
  return {cur, total, paid:Math.min(paid,total), remaining:Math.max(0,total-paid)};
}

function supGroup(gidEnc){
  const gid=decodeURIComponent(gidEnc); let rows,sup=null,name;
  if(gid.indexOf("name:")===0){ name=gid.slice(5); rows=(DB.purchases||[]).filter(x=>(x.channel||"local")===chChannel && !x.supplier_id && (x.supplier_name||"—")===name); }
  else { sup=(DB.suppliers||[]).find(s=>s.id===gid)||null; name=sup?sup.name:""; rows=(DB.purchases||[]).filter(x=>(x.channel||"local")===chChannel && x.supplier_id===gid); }
  return {gid, rows, sup, name};
}
function supDueInfo(rows){
  const curs=[...new Set(rows.map(po=>po.currency||"KWD"))]; const cur=curs.length===1?curs[0]:"KWD";
  let total=0; rows.forEach(po=>{ const d=poDealTotals(po); total += (curs.length===1? d.total : toCur(d.total,po.currency,"KWD")); });
  return {cur, total};
}
function supPaid(key, cur){
  const list=(DB.supplier_payments||[]).filter(pp=>pp.supplier_key===key && (pp.channel||"")===chChannel);
  const paid=list.reduce((a,pp)=>a+toCur(pp.amount,pp.currency,cur),0);
  return {list, paid};
}

    ${spd.list.length?`<div class="sechead" style="font-size:11px">${isAr()?"الدفعات":"PAYMENTS"}</div>${spd.list.map(pp=>`<div class="lineitem"><div style="min-width:0"><b>${pp.kind==="deposit"?(isAr()?"عربون":"deposit"):(isAr()?"دفعة نهائية":"final")}: ${pp.amount} ${esc(pp.currency||cur)}</b> <span class="muted" style="font-size:12px">${esc(pp.paid_on||"")}</span>${pp.note?`<div class="muted" style="font-size:12px">${esc(pp.note)}</div>`:""}${pp.discrepancy_note?`<div style="font-size:12px;color:var(--wine)">⚠ ${esc(pp.discrepancy_note)}</div>`:""}${pp.receipt?`<div><img class="thumb" src="${esc(pp.receipt)}" style="width:44px;height:44px" onclick="viewImg('${esc(pp.receipt)}')"></div>`:""}</div><button class="btn btn-ghost" style="padding:2px 8px;font-size:11px;color:var(--wine)" onclick="poPaySupDel('${pp.id}','${gidEnc}')">✕</button></div>`).join("")}`:""}

async function poPaySupAdd(gidEnc){
  const amt=parseFloat(el("ps_amt").value)||0; if(!amt) return alert(isAr()?"ادخل المبلغ":"Amount?");
  const kind=el("ps_kind").value, cur0=el("ps_cur").value;
  const G=supGroup(gidEnc); const dinfo=supDueInfo(G.rows); const gid=decodeURIComponent(gidEnc);
  const paid=supPaid(gid,dinfo.cur).paid;
  let discrepancy_note=null;
  const amtInCur=toCur(amt,cur0,dinfo.cur);
  const diff=(paid+amtInCur)-dinfo.total;
  if(kind==="final" && Math.abs(diff)>0.01){
    const more=diff>0;
    const reason=prompt(isAr()
      ? `الدفعة تخالف المستحق بمقدار ${fmtN(Math.abs(diff))} ${dinfo.cur} (${more?"زيادة":"نقص"}).
اكتب السبب (مثل: زيادة إنتاج الخام) أو اضغط إلغاء للمراجعة مع المورد:`
      : `Payment differs from due by ${fmtN(Math.abs(diff))} ${dinfo.cur} (${more?"over":"under"}). Reason, or Cancel to review:`, "");
    if(reason===null) return;
    discrepancy_note=`${more?(isAr()?"زيادة":"over"):(isAr()?"نقص":"under")} ${fmtN(Math.abs(diff))} ${dinfo.cur}${reason?` — ${reason}`:""}`;
  }
  const tr=activeTrip(chChannel);
  const row={id:newId(), trip_id:tr?tr.id:null, channel:chChannel, supplier_key:gid, supplier_id:(G.sup&&G.sup.id)||null, supplier_name:G.name||null, amount:amt, currency:cur0, kind, paid_on:today(), receipt:window._payReceipt||null, note:el("ps_note").value||null, discrepancy_note};
  const {error}=await sb.from("supplier_payments").insert(row);
  if(error && !/queued/i.test(error.message||"")) return alert(error.message);
  (DB.supplier_payments=DB.supplier_payments||[]); if(!DB.supplier_payments.some(x=>x.id===row.id)) DB.supplier_payments.unshift(row);
  window._payReceipt=null; cacheDB(); render(); closeSheet(); poPaySup(gidEnc);
}

/* ================= المالية: نفقات + دفعات + ملخص (داخل المشتريات — مرجع) ================= */
const EXP_CATS=[["transport","نقل"],["food","أكل"],["hotel","سكن"],["tickets","تذاكر"],["misc","نثريات / بوكيت موني"],["customs","جمارك / رسوم"],["other","أخرى"]];
function expCatLabel(k){ const f=EXP_CATS.find(x=>x[0]===k); return f? f[1] : k; }
function expKWD(x){ return (x.currency||"KWD")==="KWD"? (parseFloat(x.amount)||0) : (toKWD(parseFloat(x.amount)||0, x.currency)||0); }
function toKWDsafe(amt,cur){ amt=parseFloat(amt)||0; return (cur||"KWD")==="KWD"? amt : (toKWD(amt,cur)||0); }
function unitAr(u){ return u==="count"?(isAr()?"حبة":"pc") : u==="meter"?(isAr()?"متر":"m") : (isAr()?"يارد":"yd"); }
function poQtyUnit(x){
  if(x.buy_qty!=null && x.buy_unit) return {qty:x.buy_qty, unit:x.buy_unit};
  if((x.kind||"")==="accessory") return {qty:x.plan_qty||0, unit:"count"};
  return {qty:x.qty_yd||0, unit:"yard"};
}
function poPaidKWD(po){
  const log=Array.isArray(po.pay_log)?po.pay_log:[];
  if(log.length) return log.reduce((a,pp)=>a+toKWDsafe(pp.amount,pp.currency),0);
  return po.deposit? toKWDsafe(po.deposit, po.currency) : 0;

let ACT={};
/* rowMenu(title, [{label,icon,fn,danger}]) → زر ⋮ + سحب على الصف */
function rowMenu(title, actions){
  const key="a"+Math.random().toString(36).slice(2,9);
  ACT[key]={title, actions};
  return `<button class="rowbtn" onclick="event.stopPropagation();openActions('${key}')" title="${esc(title)}">⋮</button>`;
}
function openActions(key){
  const a=ACT[key]; if(!a) return;
  openSheet(`<div class="title">${esc(a.title)}</div>
    ${a.actions.map((x,i)=>`<button class="btn ${x.danger?'btn-bad':'btn-ghost'} btn-big" onclick="runAction('${key}',${i})">${x.icon||""} ${esc(x.label)}</button>`).join("")}`);
}
function runAction(key,i){
  const a=ACT[key]; if(!a) return;
  const act=a.actions[i];
  closeSheet();
  if(act.danger) confirmDelete(a.title, act.fn);
  else act.fn();
}
function confirmDelete(label, fn){
  openSheet(`<div style="text-align:center">
    <div class="title" style="color:var(--wine)">${I.trash} ${isAr()?"تأكيد الحذف":"Confirm delete"}</div>
    <div class="note-box" style="background:var(--wine-lt);color:var(--wine-dk)">${esc(label)}</div>
    <p class="muted">${isAr()?"متأكد؟ ما تقدر ترجع بعد الحذف.":"This cannot be undone."}</p>
    <button class="btn btn-bad btn-big" onclick="closeSheet();(${fn.name||'window._delFn'})()">${isAr()?"نعم، احذف":"Yes, delete"}</button>
    <button class="btn btn-ghost btn-big" onclick="closeSheet()">${isAr()?"لا، رجوع":"Cancel"}</button>
  </div>`);
  window._delFn=async()=>{ await fn(); };
  /* استبدال الاستدعاء ليعمل دائماً */
  const b=document.querySelector("#ov .btn-bad");
  if(b) b.onclick=async()=>{ closeSheet(); await fn(); };
}

async function delRow(table, id, after){

/* سحب على الصف نفسه — يتحرك ويكشف الإجراءات خلفه (مثل واتساب) */
function enableSwipe(){
  document.querySelectorAll(".swipe:not([data-sw])").forEach(row=>{
    row.dataset.sw="1";
    const btn=row.querySelector(".rowbtn"); if(!btn) return;
    /* لوح الإجراءات خلف الصف */
    const back=document.createElement("div");
    back.className="swipeback";
    back.innerHTML=`<span>${I.trash}</span>`;
    row.appendChild(back);
    const inner=document.createElement("div");
    inner.className="swipefront";
    while(row.firstChild && row.firstChild!==back) inner.appendChild(row.firstChild);
    row.insertBefore(inner,back);

    let x0=null,dx=0,active=false;
    const rtl=document.documentElement.dir==="rtl";
    inner.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;active=true;inner.style.transition="none";},{passive:true});
    inner.addEventListener("touchmove",e=>{
      if(!active) return;
      dx=e.touches[0].clientX-x0;
      const open = rtl? Math.max(0,dx) : Math.min(0,dx);
      if(Math.abs(open)>4) inner.style.transform=`translateX(${Math.max(-90,Math.min(90,open))}px)`;
    },{passive:true});
    inner.addEventListener("touchend",()=>{
      if(!active) return; active=false;
      inner.style.transition="transform .18s ease";
      const passed = rtl? dx>60 : dx<-60;
      inner.style.transform="translateX(0)";
      if(passed) setTimeout(()=>btn.click(),120);
      dx=0;
    },{passive:true});
  });
}

function stageStats(){

  const box=(key,icon,all,go,wait,alt)=>`<div class="stat" style="cursor:pointer;${sel===key?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='${key}'?null:'${key}');render()">${icon}

        : `<span class="n-all">${all}</span><span class="n-go">${go}</span><span class="n-wait">${wait}</span>`}</div>
      <div class="cap">${t(key)}</div></div>`;
  const actIds=new Set(act.map(l=>l.id));
  const cnt=(st)=>{
    if(st==="emb"){   /* التطريز صار مهام على مستوى القطعة */
      const ps=DB.parts.filter(p=>p.stage==="emb"&&p.status!=="done"&&actIds.has(p.line_id));
      return {all:ps.length, go:ps.filter(p=>p.status==="sent").length, wait:ps.filter(p=>p.status==="waiting").length};
    }
    const ls=act.filter(l=>l.stage===st);
    if(st==="sew"||st==="cut"){
      let go=0,wait=0,all=0;
      ls.forEach(l=>{const ps=DB.parts.filter(p=>p.line_id===l.id&&(p.stage||"sew")===st);
        all+=ps.length||1; go+=ps.filter(p=>p.status==="working").length; wait+=ps.filter(p=>p.status==="waiting").length;});
      return {all,go,wait};
    }
    return {all:ls.length, go:ls.filter(l=>l.stage_status==="working").length, wait:ls.filter(l=>l.stage_status!=="working").length};
  };
  const c=cnt("cut"), e=cnt("emb"), s=cnt("sew");
  const qcN=act.filter(l=>l.stage==="qc").length;
  const packN=act.filter(l=>l.stage==="pack").length;
  const extSent=act.filter(l=>l.stage==="ext"&&l.stage_status==="sent").length
    + DB.parts.filter(p=>p.stage==="emb"&&p.status==="sent"&&actIds.has(p.line_id)).length;
  const extRec=DB.jobs.filter(j=>j.status==="received").reduce((a,j)=>a+(j.line_ids||[]).length+(j.part_ids||[]).length,0);
  const dActive=DB.designs.filter(d=>(d.stage||"idea")!=="approved");
  const dGo=DB.designs.filter(d=>d.stage==="sample"&&d.sample_started_at&&!d.sample_finished_at).length;

  return `<div class="statrow">
    <div class="stat" style="cursor:pointer;${sel==='design'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='design'?null:'design');render()">${I.design}

      <div class="cap">${t("design")}</div></div>
    ${box("cut",I.cut,c.all,c.go,c.wait)}
    ${box("emb",I.emb,e.all,e.go,e.wait)}
    ${box("sew",I.sew,s.all,s.go,s.wait)}
    <div class="stat" style="cursor:pointer;${sel==='qc'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='qc'?null:'qc');render()">${I.qc}<div class="nums"><span class="n-all">${qcN}</span></div><div class="cap">${t("qc")}</div></div>
    <div class="stat" style="cursor:pointer;${sel==='pack'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='pack'?null:'pack');render()">${I.pack}<div class="nums"><span class="n-all">${packN}</span></div><div class="cap">${t("pack")}</div></div>
    <div class="stat" style="cursor:pointer;${sel==='ext'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='ext'?null:'ext');render()">${I.ext}<div class="nums"><span class="n-go">${extSent}</span><span class="n-all">${extRec}</span></div><div class="cap">${t("sent")} / ${t("received")}</div></div>
  </div>
  <div class="legend">
    <span><i class="dot d-all"></i>${t("total")}</span>
    <span><i class="dot d-go"></i>${isAr()?"جاري العمل":"In progress"}</span>
    <span><i class="dot d-wait"></i>${isAr()?"ما بدأ بعد":"Not started"}</span>
  </div>`;
}

/* ===== قائمة الشراء التقديرية ===== */
/* الخامات صارت لكل قطعة تصميم — نجمعها كلها */
function allBom(p){
  const out=[];
  Object.values(p.bom_parts||{}).forEach(arr=>(arr||[]).forEach(b=>out.push(b)));
  if(!out.length) (p.bom||[]).forEach(b=>out.push(b));   /* منتجات قديمة */
  return out;
}
function purchaseFor(lines){
  const need={};
  lines.forEach(l=>{
    const p=product(l.product_id);
    allBom(p).forEach(b=>{
      need[b.material_id]=(need[b.material_id]||0)+ (b.qty*(l.qty||1));
    });
  });
  return need;
}
function showPurchase(orderId){
  const lines=DB.lines.filter(l=>l.order_id===orderId);
  const need=purchaseFor(lines);
  const rows=Object.entries(need);
  const noBom=[...new Set(lines.map(l=>l.product_id))].filter(pid=>!allBom(product(pid)).length);
  let total=0;
  openSheet(`<div class="title">${I.pack} ${isAr()?"قائمة الشراء التقديرية":"Purchase list"} — ${t("order")} #${order(orderId).order_no}</div>
    ${rows.length?`<table><tr><th>${isAr()?"الخام":"Material"}</th><th>${isAr()?"الكود":"SKU"}</th><th>${isAr()?"المطلوب":"Needed"}</th><th>${isAr()?"التكلفة":"Cost"}</th></tr>
      ${rows.map(([id,q])=>{const m=material(id); const c=m.price? m.price*q:null; if(c) total+=c;
        return `<tr><td>${esc(m.name)}${m.color?` · ${esc(m.color)}`:""}</td><td>${esc(m.sku||"—")}</td>
        <td><b>${Math.round(q*100)/100}</b> ${esc(m.unit||"")}</td><td>${c?Math.round(c*100)/100:"—"}</td></tr>`;}).join("")}
      ${total?`<tr><td colspan="3"><b>${isAr()?"الإجمالي":"Total"}</b></td><td><b>${Math.round(total*100)/100}</b></td></tr>`:""}</table>`
    :`<div class="empty">${isAr()?"ما في خامات مربوطة بمنتجات هذا الأمر":"No materials linked"}</div>`}
    ${noBom.length?`<div class="note-box">${isAr()?"منتجات بدون خامات مسجلة":"Products without materials"}: ${noBom.map(pid=>esc(pname(product(pid)))).join(" · ")}</div>`:""}
    <button class="btn btn-ghost btn-big" onclick="window.print()">${I.print} ${isAr()?"طباعة":"Print"}</button>`);
}

async function saveOrder(){
  captureOrder();
  const ty=window._otype||"إنتاج كمي";
  let reason=null, rnote=null, rimg=null;
  if(ty==="تصليح"){
    const sel=document.querySelector("#reasonPills .pill.on");
    reason = sel? sel.dataset.r : null;
    if(!reason) return alert(isAr()?"اختر سبب الرجوع":"Pick a reason");

  }
  const {data:o,error}=await sb.from("orders").insert({order_type:ty, customer_ref:(ty==="طلب"||ty==="قياسات خاصة")?(el("o_ref")?.value||null):null,
    repair_reason:reason, repair_note:rnote, repair_image:rimg, due_date:el("o_due").value||null}).select().single();
  if(error) return alert(error.message);
  let rows=[];
  if(ty==="قياسات خاصة"){
    rows=customModels.filter(m=>m.product_id).map(m=>{
      const cs={sleeve:m.sleeve,bottom:m.bottom,notes:m.notes,age:m.age};
      allMeas().forEach(x=>{if(m[x[0]]) cs[x[0]]=m[x[0]];});
      return {order_id:o.id,product_id:m.product_id,qty:m.qty||1,color:m.color||null,size:m.age||(isAr()?"خاص":"CUSTOM"),
        custom_specs:cs, external_make:!!window._oext, stage:startStageFor(m.product_id,ty,window._oext)};
    });
  }else{
    rows=newLines.filter(l=>l.product_id).map(l=>({order_id:o.id,product_id:l.product_id,size:l.size||null,color:l.color||null,qty:l.qty||1,
      external_make:!!window._oext, stage:startStageFor(l.product_id,ty,window._oext)}));
  }
  if(!rows.length){await sb.from("orders").delete().eq("id",o.id);return alert(isAr()?"أضف قطعة واحدة على الأقل":"Add at least one item");}
  const {data:ins}=await sb.from("order_lines").insert(rows).select();
  for(const l of (ins||[])){
    if(l.stage==="sew") await genParts(l.id,l,ty,"sew");
    if(l.stage==="cut") await genParts(l.id,l,ty,"cut");
  }
  await logIt("order_new","orders",o.id, `#${o.order_no||""} · ${ty} · ${rows.length} ${isAr()?"سطر":"lines"}`);
  newLines=[];customModels=[];window._otype="إنتاج كمي";window._oext=false;mTab="board";localStorage.setItem("vv2_tab","board");

/* بيانات المنتجات القديمة (خامات ووقت وتطريز على مستوى المنتج) تنسحب على القطع مرة واحدة */
function migrateLegacy(p){
  const comps=(p.components||[]);
  if(!comps.length) return;
  if(!Object.keys(window._bomP).length && (p.bom||[]).length) window._bomP[comps[0].ar]=JSON.parse(JSON.stringify(p.bom));
  if(!Object.keys(window._estCut).length && p.est_cut_min) window._estCut[comps[0].ar]=p.est_cut_min;
  if(!Object.keys(window._embP).length && p.embroidery_kind && p.embroidery && p.embroidery!=="none")
    window._embP[comps[0].ar]={kind:p.embroidery_kind, when:(p.embroidery==="external_piece"?"after_cut":p.embroidery),
      note:p.embroidery_note||"", artwork:p.artwork_url||""};
}

function toggleEmb(){

      <input type="file" id="ea_${k}_${i}" accept="image/*">
      <button type="button" class="btn btn-ghost" style="margin-top:6px" onclick="rmEmbP('${esc(partAr)}',${i})">✕ ${isAr()?"احذف":"Remove"}</button>
    </div>`).join("")
  : `<div class="muted" style="font-size:12px">${isAr()?"ما فيه تطريز ولا طباعة على هذي القطعة":"None"}</div>`;

function captureEmbP(partAr){
  const k=pkey(partAr), arr=embArr(partAr);

async function saveProduct(){
  const name=el("p_name").value.trim(); if(!name) return alert(isAr()?"اكتب الاسم":"Enter name");
  captureChart();
  for(const f of el("p_imgs").files){const u=await uploadFile(f,"products"); if(u) window._pimgs.push(u);}
  const pats=window._ppats.filter(Boolean);
  for(const f of el("p_pats").files){const u=await uploadFile(f,"patterns"); if(u) pats.push({name:f.name,url:u});}
  capturePartCards();
  const isExt = !!(el("p_ext")&&el("p_ext").checked);
  const comps = currentParts();   /* القطع تُحفظ حتى في التنفيذ الخارجي — المشاغل تحتاجها في الجوب أوردر */
  /* رفع رسمات التطريز — لكل تطريز على كل قطعة */
  if(hasEmbOn()){
    for(const c of comps){
      const arr=embArr(c.ar);
      for(let i=0;i<arr.length;i++){

  const estSew=keep(window._estSew), estCut=keep(window._estCut);

  const chart={}; chartSizes().forEach(s=>chart[s]=window._chart[s]||{});
  const row={name, name_en:el("p_name_en").value||null, images:window._pimgs, patterns:pats, components:comps,

    meas_rows:activeRows(),

  if(editProductId) await sb.from("products").update(row).eq("id",editProductId);
  else await sb.from("products").insert(row);

}
async function delProduct(id, force){
  const used=DB.lines.some(l=>l.product_id===id);
  if(used && !force){ await sb.from("products").update({active:false}).eq("id",id); await refresh(); return; }
  if(used){
    /* حذف كل ما يرتبط به أولاً */
    const lids=DB.lines.filter(l=>l.product_id===id).map(l=>l.id);
    for(const lid of lids){
      await sb.from("stage_events").delete().eq("line_id",lid);

      await sb.from("order_lines").delete().eq("id",lid);

/* ---- التصميم: الكولكشنات ← المسار ---- */
const DSTAGES=["idea","sketch","materials","prep","sample","notes","approved"];
const DLABEL={idea:["الفكرة","IDEA"],sketch:["السكيتشات","SKETCH"],materials:["شراء المواد","MATERIALS"],prep:["تجهيز العينة","PREP"],
  sample:["تنفيذ العينة","SAMPLE"],notes:["ملاحظات العينة","REVIEW"],approved:["معتمد","APPROVED"]};
/* الستيبر: ربط المراحل الداخلية بأربع مراحل ظاهرة */
function dStepIndex(stage){
  const s=stage||"idea";
  if(s==="idea"||s==="sketch") return 0;
  if(s==="materials") return 1;
  if(s==="prep"||s==="sample"||s==="notes") return 2;
  return 3;
}
function designStepper(d){
  const cur=dStepIndex(d.stage);
  const steps=[isAr()?"الفكرة":"Idea", isAr()?"شراء المواد":"Materials", isAr()?"تجهيز العينة":"Sample", isAr()?"معتمد":"Approved"];
  return `<div class="dstepper">${steps.map((s,i)=>`<div class="dstep ${i<cur?'done':''} ${i===cur?'active':''}">
    <div class="dot">${i<cur?'✓':(i+1)}</div><div class="lbl">${s}</div></div>`).join("")}</div>`;
}
function dlab(s){return isAr()? (DLABEL[s]?DLABEL[s][0]:s) : (DLABEL[s]?DLABEL[s][1]:s);}
function design_(id){return DB.designs.find(x=>x.id===id)||{};}
function collection_(id){return (DB.collections||[]).find(c=>c.id===id)||{};}

async function chkDel(id,i){

function captureDChart(){Object.keys(window._dchart||{}).forEach(s=>{MEAS.forEach(m=>{const i=el(`dc_${s}_${m[0]}`); if(i) window._dchart[s][m[0]]=i.value;});});}
function redrawDChart(){
  const box=el("dChartGrid"); if(!box) return;
  const sizes=el("d_sizes").value.split(",").map(s=>s.trim()).filter(Boolean);
  sizes.forEach(s=>{window._dchart[s]=window._dchart[s]||{};});
  box.innerHTML= sizes.length? `<div style="overflow-x:auto"><table><tr><th>—</th>${sizes.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>
    ${MEAS.map(m=>`<tr><td>${isAr()?m[1]:m[2]}</td>${sizes.map(s=>`<td><input id="dc_${s}_${m[0]}" style="min-width:56px;padding:6px" value="${esc(window._dchart[s]?.[m[0]]||"")}"></td>`).join("")}</tr>`).join("")}</table></div>`:"";
}
async function addDesignFiles(id, field){
  const d=design_(id); const arr=[...(d[field]||[])];
  for(const f of el(field==="mood"?"d_mood":"d_sketches").files){const u=await uploadFile(f,"designs"); if(u) arr.push(u);}
  await sb.from("design_projects").update({[field]:arr}).eq("id",id);
  await refresh(); closeSheet(); openDesign(id);
}
async function addDesignNote(id, field){
  const tx=el("d_note").value.trim(); if(!tx) return;
  let img=null; const fi=el("d_note_img");
  if(fi && fi.files[0]) img=await uploadFile(fi.files[0],"notes");
  const d=design_(id);
  await sb.from("design_projects").update({[field]:[...(d[field]||[]),{t:tx,d:today(),img}]}).eq("id",id);
  await refresh(); reopenDesign(id);
}
async function rmDesignNote(id, field, idx){
  const d=design_(id); const arr=[...(d[field]||[])]; arr.splice(idx,1);
  await sb.from("design_projects").update({[field]:arr}).eq("id",id);
  await refresh(); reopenDesign(id);
}
async function setDStage(id, st){
  await sb.from("design_projects").update({stage:st}).eq("id",id);
  await refresh(); closeSheet(); openDesign(id);
}
async function sendToSample(id){
  captureDChart();
  const sizes=el("d_sizes").value.split(",").map(s=>s.trim()).filter(Boolean);
  const chart={}; sizes.forEach(s=>chart[s]=window._dchart[s]||{});
  const wid=el("d_worker").value; if(!wid) return alert(isAr()?"اختر عامل":"Pick worker");
  await sb.from("design_projects").update({materials:el("d_mat").value||null, size_chart:chart,
    sample_worker_id:wid, stage:"sample", sample_started_at:null, sample_finished_at:null}).eq("id",id);
  closeSheet(); await refresh();
}
async function backToSample(id){
  const d=design_(id);
  const notes=(d.sample_notes||[]);
  if(!notes.length) return alert(isAr()?"اكتب الملاحظات المطلوب تعديلها أولاً":"Add notes first");
  const rev={n:(d.revisions||[]).length+1, sent_at:new Date().toISOString(),
    worked:(d.sample_started_at&&d.sample_finished_at)? mins(d.sample_started_at,d.sample_finished_at):null,
    notes:notes.map(n=>n.t)};
  await sb.from("design_projects").update({
    stage:"sample", sample_started_at:null, sample_finished_at:null,
    revisions:[...(d.revisions||[]), rev]
  }).eq("id",id);
  closeSheet(); await refresh();
}
/* سجل التصميم */
function designHistory(d){
  const rows=[];
  (d.revisions||[]).forEach(r=>{
    rows.push(`<div class="note-box"><b>${I.done} ${isAr()?"تنفيذ العينة":"Sample"} ${r.n}</b>
      ${r.worked?` — ${r.worked} ${t("minutes")}`:""} <span class="muted">${esc((r.sent_at||"").slice(0,10))}</span>
      <div style="margin-top:4px">${I.fix} ${isAr()?"أُرسلت للتعديل بالملاحظات:":"Sent back:"}</div>
      ${(r.notes||[]).map((n,i)=>`<div>${i+1}. ${esc(n)}</div>`).join("")}</div>`);
  });
  if(!rows.length) return "";
  return `<hr class="sep"><div class="sechead">${I.clock} ${isAr()?"سجل العينة":"HISTORY"}</div>${rows.join("")}`;
}
function approveSample(id){
  const d=design_(id);
  window._dchart=JSON.parse(JSON.stringify(d.size_chart||{}));
  openSheet(`<div class="title">${isAr()?"اعتماد العينة":"Approve sample"}</div>
    <label>${isAr()?"الاسم النهائي (عربي)":"Final name (AR)"}</label><input id="ap_name" value="${esc(d.final_name||d.name||"")}">
    <label>${isAr()?"الاسم النهائي (إنجليزي)":"Final name (EN)"}</label><input id="ap_name_en" dir="ltr" value="${esc(d.final_name_en||"")}">
    <label>${isAr()?"الأعمار":"Ages"}</label><input id="d_sizes" dir="ltr" value="${esc(Object.keys(d.size_chart||{}).join(","))}" onchange="captureDChart();redrawDChart()">
    <div id="dChartGrid"></div>
    <button class="btn btn-ok btn-big" onclick="finishApprove('${id}')">${I.done} ${isAr()?"اعتماد وتحويل لمنتج":"Approve → product"}</button>`);
  setTimeout(redrawDChart,0);
}
async function finishApprove(id){
  const d=design_(id);
  const name=el("ap_name").value.trim(); if(!name) return alert(isAr()?"اكتب الاسم النهائي":"Final name?");
  captureDChart();
  const sizes=el("d_sizes").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!sizes.length) return alert(isAr()?"حدد الأعمار وجدول القياسات":"Add sizes");
  const chart={}; sizes.forEach(s=>chart[s]=window._dchart[s]||{});
  const est = (d.sample_started_at&&d.sample_finished_at)? mins(d.sample_started_at,d.sample_finished_at) : null;
  const {data:p,error}=await sb.from("products").insert({
    name, name_en:el("ap_name_en").value||null,
    images:[...(d.sketches||[]),...(d.mood||[])].slice(0,6),
    size_chart:chart, notes:(d.notes||[]).map(n=>n.t).join(" | ")||null,
    est_sew_min:est
  }).select().single();
  if(error) return alert(error.message);
  await sb.from("design_projects").update({stage:"approved",status:"معتمد",product_id:p.id,final_name:name,final_name_en:el("ap_name_en").value||null,size_chart:chart}).eq("id",id);
  await sb.from("photoshoots").insert({product_id:p.id});
  closeSheet(); await refresh();
  mTab="products"; render(); showProductForm(p.id);
}
async function delDesign(id){if(confirm(isAr()?"حذف التصميم؟":"Delete?")){await logIt("del","design_projects",id,(design_(id)||{}).name||""); await sb.from("design_projects").delete().eq("id",id); closeSheet(); await refresh();}}

async function makeJob(mode){
  const vendor=el(mode==="emb"?"j_vendor":"x_vendor").value||null;
  if(mode==="emb"){
    const pids=[...document.querySelectorAll(".embchk:checked")].map(c=>c.value);
    if(!pids.length) return alert(isAr()?"اختر القطع أولاً":"Select items");
    const first=DB.parts.find(x=>x.id===pids[0]);
    const kind=(first&&first.emb_kind)||"تطريز";
    const isFix=pids.every(id=>{const x=DB.parts.find(y=>y.id===id); return x&&x.is_fix;});
    const {data:j,error}=await sb.from("ext_jobs").insert({kind,vendor,part_ids:pids,line_ids:[],is_fix:isFix}).select().single();
    if(error) return alert(error.message);
    for(const id of pids) await sb.from("line_parts").update({status:"sent"}).eq("id",id);
    await logIt("ext_send","ext_jobs",j.id,`${kind} · ${pids.length} ${isAr()?"قطعة":"parts"}`);
    await refresh(); printJob(j.id);
  }else{
    const ids=[...document.querySelectorAll(".extchk:checked")].map(c=>c.value);
    if(!ids.length) return alert(isAr()?"اختر القطع أولاً":"Select items");
    /* ١ — جوب أوردر الملابس (أو إرجاع تصليح لو القطع راجعة من الجودة) */
    const isFix=ids.every(id=>{const l=DB.lines.find(x=>x.id===id); return l&&l.fix_reason;});
    const {data:j,error}=await sb.from("ext_jobs").insert({kind:"تنفيذ خارجي",vendor,line_ids:ids,part_ids:[],is_fix:isFix}).select().single();
    if(error) return alert(error.message);
    for(const id of ids) await sb.from("order_lines").update({stage_status:"sent"}).eq("id",id);
    await logIt("ext_send","ext_jobs",j.id,`${isFix?(isAr()?"إرجاع تصليح":"fix return"):(isAr()?"تنفيذ خارجي":"external")} · ${ids.length}`);
    /* ٢ — جوب أوردر التطريز/الطباعة، منفصل، لأي قطعة عليها تطريز (ما يتكرر في الإرجاع) */
    const rows=isFix? [] : [];
    for(const id of (isFix? [] : ids)){
      const l=DB.lines.find(x=>x.id===id); if(!l) continue;
      const p=product(l.product_id);
      Object.keys(p.emb_parts||{}).forEach(partAr=>{
        const c=(p.components||[]).find(x=>x.ar===partAr)||{ar:partAr,en:partAr};
        embOf(p,partAr).forEach(e=>{
          rows.push({line_id:id, part_ar:partAr, part_en:c.en||partAr, stage:"emb", status:"sent",
            emb_kind:e.kind, emb_when:e.when||"after_sew", emb_note:e.note||null, emb_artwork:e.artwork||null});
        });
      });
    }
    let j2=null;
    if(rows.length){
      const {data:ins}=await sb.from("line_parts").insert(rows).select();
      const pids=(ins||[]).map(x=>x.id);
      const kind=rows[0].emb_kind||"تطريز";
      const v2=(el("x_vendor2")&&el("x_vendor2").value)||vendor;
      const r2=await sb.from("ext_jobs").insert({kind,vendor:v2,part_ids:pids,line_ids:[]}).select().single();
      j2=r2.data;
      if(j2) await logIt("ext_send","ext_jobs",j2.id,`${kind} · ${pids.length} ${isAr()?"قطعة":"parts"}`);
    }
    await refresh();
    printJob(j.id);
    if(j2) setTimeout(()=>printJob(j2.id), 900);
  }
}
async function receiveJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  const now=new Date().toISOString();
  /* قطع التطريز: كل قطعة ترجع منجزة، والسطر ينتقل لو ما بقي عليه شي */
  const touched=new Set();
  for(const pid of (j.part_ids||[])){
    const x=DB.parts.find(y=>y.id===pid); if(!x) continue;
    await sb.from("line_parts").update({status:"done", finished_at:now}).eq("id",pid);
    touched.add(x.line_id);
  }
  const doneIds=(j.part_ids||[]);
  for(const lineId of touched){
    const l=DB.lines.find(y=>y.id===lineId); if(!l) continue;
    const p=product(l.product_id);
    if(l.stage==="ext"){
      /* تنفيذ خارجي: ما يروح للجودة إلا لما ترجع الملابس والتطريز الاثنين */
      const garmentOut=DB.jobs.some(x=>x.status==="sent" && x.id!==jobId && (x.line_ids||[]).includes(lineId));
      const embLeft=DB.parts.filter(x=>x.line_id===lineId && x.stage==="emb" && x.status!=="done" && !doneIds.includes(x.id));
      if(!garmentOut && !embLeft.length) await moveLine(lineId,"qc");
      continue;
    }
    if(l.stage==="qc") continue;   /* إرجاع تطريز والسطر واقف عند الجودة — يرجع للقائمة تلقائياً */
    const own=DB.parts.filter(x=>x.line_id===lineId && (x.stage||"sew")===l.stage && x.status!=="done");
    const embLeft=DB.parts.filter(x=>x.line_id===lineId && x.stage==="emb" && x.status!=="done"
      && !doneIds.includes(x.id) && WHEN2STAGE[x.emb_when||"after_sew"]===l.stage);
    if(!own.length && !embLeft.length) await moveLine(lineId, nextStage(l.stage,p));
  }
  for(const id of (j.line_ids||[])){
    const l=DB.lines.find(x=>x.id===id); if(!l) continue;
    const embLeft=DB.parts.filter(x=>x.line_id===id && x.stage==="emb" && x.status!=="done" && !doneIds.includes(x.id));
    if(!embLeft.length) await moveLine(id, "qc");
    else await sb.from("order_lines").update({stage_status:"waiting"}).eq("id",id);
  }
  await sb.from("ext_jobs").update({status:"received",returned_at:today()}).eq("id",jobId);
  await logIt("ext_recv","ext_jobs",jobId, `${esc(j.kind)} — ${esc(j.vendor||"")}`);
  await refresh();
}

async function jobSaveImg(btn){
  const node=el("joSheet"); if(!node) return;
  const orig=btn?btn.textContent:""; if(btn){btn.disabled=true;btn.textContent=isAr()?"…جاري":"…";}
  try{
    const canvas=await html2canvas(node,{useCORS:true, backgroundColor:"#ffffff", scale:2});
    const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    const fname="job-order-"+today()+".png";
    if(blob && navigator.canShare){
      try{ const file=new File([blob],fname,{type:"image/png"});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Job Order"}); if(btn){btn.disabled=false;btn.textContent=orig;} return; }
      }catch(e){}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ alert(isAr()?"ما قدرنا نحفظ الصورة — استخدم الطباعة":"Couldn't save image — use Print"); }
  if(btn){btn.disabled=false;btn.textContent=orig;}
}

}

        null, {reason, target:"embroidery", part:pick.part});
      closeSheet(); await refresh();
      alert(isAr()?"رجّعناها لسلة التطريز — أرسلها من تبويب «الخارجي». الموديل واقف عند الجودة لين ترجع."
                 :"Sent back to the embroidery pool.");
      return;
    }
  }
  if(isExternalLine(l)){
    /* منفَّذ برّا — يرجع للمشغل الخارجي مو لخياط عندنا */
    await sb.from("order_lines").update({stage:"ext", stage_status:"waiting", claimed_by:null,
      fix_reason:reason, fix_image:img, ext_fix_count:((l&&l.ext_fix_count)||0)+1}).eq("id",lineId);
    await logIt("fix","order_lines",lineId, lineLabel(lineId)+" → "+(isAr()?"إرجاع للمشغل الخارجي":"back to vendor")+(reason?" · "+reason:""),
      null, {reason, target:"external"});
    closeSheet(); await refresh();
    alert(isAr()?"رجّعناها لسلة التنفيذ الخارجي — أرسلها من تبويب «الخارجي» ويطلع لك جوب أوردر إرجاع.":"Returned to the external pool.");
    return;
  }
  const lastSew=DB.events.filter(e=>e.line_id===lineId&&e.stage==="sew"&&e.worker_id&&e.finished_at).slice(-1)[0];
  await sb.from("order_lines").update({stage:"sew",stage_status:"waiting",claimed_by:null,fix_reason:reason,fix_image:img}).eq("id",lineId);
  await sb.from("line_parts").insert({line_id:lineId,part_ar:"إصلاح",part_en:"FIX",worker_id:lastSew?lastSew.worker_id:null});
  await logIt("fix","order_lines",lineId, lineLabel(lineId)+(reason?" · "+reason:""), null,
    {reason, worker_id: lastSew? lastSew.worker_id : null});
  closeSheet(); await refresh();
}
