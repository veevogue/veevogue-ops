<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VEEVOGUE — نظام المشغل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#111111; --paper:#ffffff; --bg:#f6f6f4; --line:#e5e4e0;
    --gray:#6b6b6b; --soft:#efeeea; --ok:#1e7a4f; --warn:#a86a00; --bad:#b3261e;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','Inter',sans-serif;}
  [dir="ltr"], [dir="ltr"] *{font-family:'Inter','Tajawal',sans-serif;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;}
  header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .lgbox{width:34px;height:34px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand .lgbox img{width:100%;height:100%;object-fit:cover;transform:scale(2.1);}
  .brand .bname{font-family:'Inter';font-weight:700;letter-spacing:4px;font-size:15px;}
  header .who{font-size:13px;color:var(--gray);display:flex;gap:8px;align-items:center;}
  header button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
  main{max-width:840px;margin:0 auto;padding:14px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;}
  .btn-ink{background:var(--ink);color:#fff;}
  .btn-line{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);}
  .btn-ghost{background:var(--soft);color:var(--ink);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-warn{background:var(--warn);color:#fff;}
  .btn-bad{background:var(--bad);color:#fff;}
  .btn-big{width:100%;padding:15px;font-size:17px;border-radius:12px;margin-top:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:3px;}
  .tabs button{flex-shrink:0;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--gray);}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:12px;padding:3px 10px;background:var(--soft);color:#333;}
  .chip svg{width:13px;height:13px;}
  .chip.working{background:#111;color:#fff;}
  .late{color:var(--bad);font-weight:900;}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:#4a4a4a;}
  input,select,textarea{width:100%;border:1px solid #cfcec9;border-radius:9px;padding:10px;font-size:15px;background:var(--paper);color:var(--ink);}
  textarea{min-height:70px;}
  .muted{color:var(--gray);font-size:13px;}
  .title{font-weight:900;font-size:16px;margin-bottom:6px;}
  .lineitem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap;}
  .login-card{max-width:400px;margin:36px auto;text-align:center;}
  .login-card .btn{width:100%;margin-top:10px;}
  .thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;background:var(--soft);border:1px solid var(--line);}
  .thumb-lg{width:100%;max-height:220px;border-radius:12px;object-fit:cover;background:var(--soft);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;}
  [dir="ltr"] th,[dir="ltr"] td{text-align:left;}
  th{color:#555;font-size:12px;letter-spacing:.4px;}
  .empty{text-align:center;color:#999;padding:34px 10px;font-size:15px;}
  .ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .sechead{display:flex;align-items:center;gap:10px;margin:18px 4px 10px;font-family:'Inter';font-weight:800;letter-spacing:2px;font-size:14px;}
  .sechead .ico{width:26px;height:26px;}
  .bignum{font-family:'Inter';font-weight:800;font-size:30px;line-height:1;}
  .biglabel{font-size:10px;letter-spacing:1px;color:var(--gray);font-weight:700;}
  .statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
  .stat .ico{margin:0 auto 4px;display:block;color:#444;}
  .overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;}
  .sheet{background:var(--paper);border-radius:16px;max-width:640px;width:100%;padding:18px;margin:10px 0 40px;}
  .imgrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .imgrow .rm{position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;}
  .imgwrap{position:relative;}
  .timer{font-family:'Inter';font-size:13px;color:var(--bad);font-weight:700;}
  .wcard{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:14px;margin-bottom:10px;}
  .wtop{display:flex;gap:12px;align-items:flex-start;}
  .wmeta{display:flex;gap:14px;margin:10px 0 2px;flex-wrap:wrap;}
  .wmeta>div{text-align:center;}
  .note-box{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .pill{border:1.5px solid var(--ink);border-radius:16px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--paper);}
  .pill.on{background:var(--ink);color:#fff;}
  .checkrow{display:flex;gap:10px;align-items:center;padding:6px 0;}
  .checkrow input{width:auto;}
  @media(max-width:520px){.grid3{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="lgbox"><img src="veevogue%20logo.jpg" alt="V" onerror="this.parentElement.style.display='none'"></span><span class="bname">VEEVOGUE</span></div>
  <div class="who"><span id="whoami"></span><button id="logoutBtn" style="display:none" onclick="logout()">خروج</button></div>
</header>
<main id="app"><div class="empty">جاري التحميل...</div></main>

<script>
/* ================= الإعدادات ================= */
const SUPA_URL = "https://piivfnhnhwymhspiqqpq.supabase.co";
const SUPA_KEY = "sb_publishable_EL5y8Utc62RgpvYeDAlBmQ_81smvXU3";
const MANAGER_PIN = "9371";

const STAGE_AR = {cut:"قص", emb:"تطريز/طباعة", sew:"خياطة", qc:"جودة", clean:"تنظيف", pack:"تجهيز", shipped:"أُرسل", ext:"تنفيذ خارجي"};
const STAGE_EN = {cut:"CUT", emb:"EMBROIDERY", sew:"SEW", qc:"QUALITY", clean:"CLEAN", pack:"PACK", shipped:"SHIPPED", ext:"EXTERNAL"};
const SPEC_LABEL = {cut:["قص","CUT"], sew:["خياطة","SEW"], pack:["تجهيز","PACK"]};
const MEAS = [["chest","الصدر","Chest"],["waist","الخصر","Waist"],["hips","الهيبس","Hips"],["shoulder","الكتف","Shoulder"],["length","الطول الكلي","Length"],["sleeve","الكم","Sleeve"]];
const SLEEVES = ["نص كم","كم طويل","جبانيز"]; const BOTTOMS = ["بنطرون","شورت"];

const I = {
  cut:'<svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><line x1="8.2" y1="7.8" x2="20" y2="19.5"/><line x1="8.2" y1="16.2" x2="20" y2="4.5"/></svg>',
  sew:'<svg class="ico" viewBox="0 0 24 24"><path d="M20 4 8 16"/><path d="M20 4c-1 4-4 9-8 12l-5 3 3-5C13 10 16 6 20 4z"/><circle cx="18.4" cy="5.6" r="1.1"/></svg>',
  emb:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
  qc:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  clean:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3c3 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-6.5 6-11z"/></svg>',
  pack:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>',
  shipped:'<svg class="ico" viewBox="0 0 24 24"><path d="M1 7h13v9H1z"/><path d="M14 10h5l3 3v3h-8"/><circle cx="6" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg>',
  ext:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 21V9l6 4V9l6 4V5l6-2v18z"/></svg>',
  ruler:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M7 9v3M11 9v3M15 9v3M19 9v3"/></svg>',
  clock:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cam:'<svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13" r="3.5"/></svg>',
  edit:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 20l4-1L20 7l-3-3L5 16z"/></svg>',
  trash:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  print:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="1"/><path d="M7 14h10v7H7z"/></svg>',
  plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  play:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  done:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>',
  file:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>',
  user:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>',
  design:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  fix:'<svg class="ico" viewBox="0 0 24 24"><path d="M14 7l3 3"/><path d="M5 19l9-9"/><path d="M18.5 2.5a3 3 0 0 1 3 3L19 8l-3-3z"/></svg>'
};

let sb=null;
let DB={workers:[],products:[],designs:[],shoots:[],reasons:[],orders:[],lines:[],parts:[],events:[],jobs:[]};
let session=JSON.parse(localStorage.getItem("vv2_session")||"null");
let mTab=localStorage.getItem("vv2_tab")||"لوحة";
let editProductId=null, newLines=[], customModels=[];

/* ================= تشغيل ================= */
window.addEventListener("DOMContentLoaded", async ()=>{
  sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  await loadAll(); render();
});
async function loadAll(){
  const [w,p,d,s,r,o,l,pa,e,j] = await Promise.all([
    sb.from("workers").select("*").order("name"),
    sb.from("products").select("*").order("created_at",{ascending:false}),
    sb.from("design_projects").select("*").order("created_at",{ascending:false}),
    sb.from("photoshoots").select("*"),
    sb.from("repair_reasons").select("*"),
    sb.from("orders").select("*").order("created_at",{ascending:false}),
    sb.from("order_lines").select("*"),
    sb.from("line_parts").select("*"),
    sb.from("stage_events").select("*"),
    sb.from("ext_jobs").select("*").order("created_at",{ascending:false}),
  ]);
  DB={workers:w.data||[],products:p.data||[],designs:d.data||[],shoots:s.data||[],reasons:r.data||[],orders:o.data||[],lines:l.data||[],parts:pa.data||[],events:e.data||[],jobs:j.data||[]};
}
async function refresh(){await loadAll(); render();}

/* ================= أدوات ================= */
function el(id){return document.getElementById(id);}
function product(id){return DB.products.find(p=>p.id===id)||{name:"؟",images:[]};}
function order(id){return DB.orders.find(o=>o.id===id)||{};}
function worker(id){return DB.workers.find(w=>w.id===id)||{name:"؟",name_en:"?"};}
function esc(s){return (s??"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function fmtD(d){if(!d)return"";const x=new Date(d);return x.getDate()+"/"+(x.getMonth()+1);}
function isLate(o){return o.due_date && o.status==="جاري" && o.due_date < today();}
function mins(a,b){return Math.round((new Date(b)-new Date(a))/60000);}
function pimg(p){return (p.images&&p.images[0])||null;}
function thumb(p,cls){const u=pimg(p);return u?`<img class="${cls||'thumb'}" src="${esc(u)}">`:`<div class="${cls||'thumb'}" style="display:flex;align-items:center;justify-content:center;color:#bbb">${I.design}</div>`;}
function logout(){session=null;localStorage.removeItem("vv2_session");render();}
function setSession(s){session=s;localStorage.setItem("vv2_session",JSON.stringify(s));render();}
async function uploadFile(file, folder){
  const ext=file.name.split(".").pop();
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from("files").upload(path,file);
  if(error){alert("فشل الرفع: "+error.message);return null;}
  return sb.storage.from("files").getPublicUrl(path).data.publicUrl;
}

/* مسار المراحل */
function startStageFor(line_productId, orderType){
  const p=product(line_productId);
  if(orderType==="تصليح") return "sew";
  if(p.external_make) return "ext";
  if(p.embroidery==="external_piece") return "emb";
  return "cut";
}
function nextStage(stage, p){
  if(stage==="cut") return p.embroidery==="after_cut" ? "emb" : "sew";
  if(stage==="emb") return p.embroidery==="after_cut" ? "sew" : "qc";
  if(stage==="sew") return p.embroidery==="after_sew" ? "emb" : "qc";
  if(stage==="clean") return "pack";
  if(stage==="pack") return "shipped";
  if(stage==="ext") return "qc";
  return stage;
}
async function moveLine(lineId, stage){
  await sb.from("order_lines").update({stage, stage_status:"waiting", claimed_by:null}).eq("id",lineId);
  if(stage==="sew") await genParts(lineId);
}
async function genParts(lineId, lineOpt, otype){
  const l=lineOpt||DB.lines.find(x=>x.id===lineId); const o=order(l.order_id); const p=product(l.product_id);
  const t=otype||o.order_type;
  let comps=(t==="تصليح")? [{ar:"تصليح",en:"REPAIR"}] : (p.components&&p.components.length? p.components : [{ar:"القطعة",en:"PIECE"}]);
  await sb.from("line_parts").insert(comps.map(c=>({line_id:lineId, part_ar:c.ar, part_en:c.en})));
}

/* ================= العرض ================= */
function render(){
  el("logoutBtn").style.display = session? "inline-block":"none";
  el("whoami").textContent = session? (session.role==="manager"?"المدير": session.role==="quality"?"QC": (worker(session.workerId).name_en||worker(session.workerId).name)) : "";
  if(!session) return renderLogin();
  if(session.role==="manager") return renderManager();
  if(session.role==="quality") return renderQuality();
  return renderWorker();
}

/* ================= الدخول ================= */
function renderLogin(){
  const ws=DB.workers.filter(w=>w.active);
  el("app").innerHTML=`<div class="login-card card">
    <div class="title" style="font-size:20px">منو أنت؟ / Who are you?</div>
    <button class="btn btn-ink btn-big" onclick="loginManager()">${I.user} المدير</button>
    <button class="btn btn-line btn-big" onclick="loginQuality()">${I.qc} QUALITY</button>
    <div class="muted" style="margin-top:16px">WORKERS</div>
    ${ws.map(w=>`<button class="btn btn-ghost btn-big" dir="ltr" onclick="loginWorker('${w.id}')">${I.user} ${esc(w.name_en||w.name)}</button>`).join("") || `<p class="muted">No workers yet</p>`}
  </div>`;
}
function loginManager(){pinPad("المدير", MANAGER_PIN, ()=>setSession({role:"manager"}));}
function loginQuality(){pinPad("QUALITY", MANAGER_PIN, ()=>setSession({role:"quality"}));}
function loginWorker(id){
  const w=worker(id);
  if(!w.pin) return setSession({role:"worker",workerId:id});
  pinPad(w.name_en||w.name, w.pin, ()=>setSession({role:"worker",workerId:id}));
}
let _pinBuf="";
function pinPad(title, correct, onOk){
  _pinBuf="";
  openSheet(`<div style="text-align:center">
    <div class="title">${esc(title)}</div>
    <div id="pinDots" style="font-size:30px;letter-spacing:10px;height:42px;font-family:'Inter'">····</div>
    <div id="pinErr" class="muted" style="color:var(--bad);height:18px"></div>
    <div dir="ltr" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:280px;margin:8px auto">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn btn-ghost" style="font-size:22px;padding:16px" onclick="pinKey('${n}')">${n}</button>`).join("")}
      <button class="btn btn-ghost" style="padding:16px" onclick="pinKey('del')">⌫</button>
      <button class="btn btn-ghost" style="font-size:22px;padding:16px" onclick="pinKey('0')">0</button>
      <button class="btn btn-ink" style="padding:16px" onclick="pinKey('ok')">✓</button>
    </div></div>`);
  window._pinCorrect=correct; window._pinOk=onOk;
}
function pinKey(k){
  if(k==="del") _pinBuf=_pinBuf.slice(0,-1);
  else if(k==="ok"){
    if(_pinBuf===window._pinCorrect){closeSheet(); window._pinOk();}
    else{el("pinErr").textContent="الرقم غلط / Wrong PIN"; _pinBuf="";}
  }
  else if(_pinBuf.length<8) _pinBuf+=k;
  const d=el("pinDots"); if(d) d.textContent = _pinBuf.replace(/./g,"●").padEnd(4,"·");
}

/* ================= شاشة العامل (EN) ================= */
function renderWorker(){
  const w=worker(session.workerId);
  const specs=w.specialties||[];
  let html=`<div dir="ltr"><button class="btn btn-ghost" style="margin-bottom:6px" onclick="refresh()">↻ REFRESH</button>`;
  if(specs.includes("cut")) html+=workerSection("cut", cutTasks(w));
  if(specs.includes("sew")) html+=workerSection("sew", sewTasks(w));
  if(specs.includes("pack")) html+=workerSection("pack", packTasks(w));
  html+=`</div>`;
  el("app").innerHTML=html;
}
function activeLine(l){return order(l.order_id).status==="جاري";}
function cutTasks(w){
  return DB.lines.filter(l=>l.stage==="cut" && activeLine(l) && (!l.claimed_by||l.claimed_by===w.id))
    .map(l=>workerCard(l,"cut",null));
}
function sewTasks(w){
  const out=[];
  DB.lines.filter(l=>l.stage==="sew" && activeLine(l)).forEach(l=>{
    DB.parts.filter(p=>p.line_id===l.id && p.status!=="done" && (!p.worker_id||p.worker_id===w.id))
      .forEach(p=>out.push(workerCard(l,"sew",p)));
  });
  return out;
}
function packTasks(w){
  return DB.lines.filter(l=>(l.stage==="clean"||l.stage==="pack") && activeLine(l) && (!l.claimed_by||l.claimed_by===w.id))
    .map(l=>workerCard(l,l.stage,null));
}
function workerSection(key, cards){
  return `<div class="sechead">${I[key]} ${STAGE_EN[key]} <span class="muted" style="letter-spacing:0">(${cards.length})</span></div>`
    + (cards.length? cards.join("") : `<div class="empty">No tasks 👌</div>`);
}
function specsTableEN(cs){
  if(!cs) return "";
  const rows=MEAS.filter(m=>cs[m[0]]).map(m=>`<tr><td>${m[2]}</td><td><b>${esc(cs[m[0]])}</b></td></tr>`).join("");
  const extra=[cs.sleeve?`Sleeve: <b>${esc(cs.sleeve)}</b>`:"",cs.bottom?`Bottom: <b>${esc(cs.bottom)}</b>`:""].filter(Boolean).join(" — ");
  return `<div class="note-box"><b>CUSTOM SIZE</b><table>${rows}</table>${extra?`<div>${extra}</div>`:""}${cs.notes?`<div>📝 ${esc(cs.notes)}</div>`:""}</div>`;
}
function workerCard(l, mode, part){

async function wStart(lineId, partId){
  const l=DB.lines.find(x=>x.id===lineId);
  if(partId){
    await sb.from("line_parts").update({status:"working",worker_id:session.workerId,started_at:new Date().toISOString()}).eq("id",partId);
    await sb.from("stage_events").insert({line_id:lineId,part_id:partId,stage:"sew",worker_id:session.workerId,started_at:new Date().toISOString()});
  }else{
    await sb.from("order_lines").update({stage_status:"working",claimed_by:session.workerId}).eq("id",lineId);
    await sb.from("stage_events").insert({line_id:lineId,stage:l.stage,worker_id:session.workerId,started_at:new Date().toISOString()});
  }
  await refresh();
}
async function wDone(lineId, partId){
  const l=DB.lines.find(x=>x.id===lineId); const p=product(l.product_id);
  const now=new Date().toISOString();
  if(partId){
    await sb.from("line_parts").update({status:"done",finished_at:now}).eq("id",partId);
    const ev=DB.events.find(e=>e.part_id===partId&&e.started_at&&!e.finished_at);
    if(ev) await sb.from("stage_events").update({finished_at:now}).eq("id",ev.id);
    const remaining=DB.parts.filter(x=>x.line_id===lineId&&x.id!==partId&&x.status!=="done");
    if(!remaining.length) await moveLine(lineId, nextStage("sew",p));
  }else{
    const ev=DB.events.find(e=>e.line_id===lineId&&!e.part_id&&e.stage===l.stage&&e.started_at&&!e.finished_at);
    if(ev) await sb.from("stage_events").update({finished_at:now}).eq("id",ev.id);
    await moveLine(lineId, nextStage(l.stage,p));
  }
  await refresh();
}
function showChart(pid, size){
  const p=product(pid);
  const chart=p.size_chart||{};
  const sizes=Object.keys(chart);
  const rows=MEAS.map(m=>`<tr><td><b>${m[2]}</b> / ${m[1]}</td>${sizes.map(s=>`<td style="${s===size?'background:#111;color:#fff;font-weight:800':''}">${esc(chart[s]?.[m[0]]||"—")}</td>`).join("")}</tr>`).join("");
  const pats=(p.patterns||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" class="chip">${I.file} ${esc(x.name)}</a>`).join(" ");
  openSheet(`<div dir="ltr">
    <div class="title" style="font-family:'Inter'">${esc(p.name_en||p.name)} — SIZE CHART</div>
    ${pimg(p)?`<img class="thumb-lg" src="${esc(pimg(p))}">`:""}
    <div style="overflow-x:auto;margin-top:10px"><table><tr><th>MEASURE</th>${sizes.map(s=>`<th style="${s===size?'background:#111;color:#fff':''}">${esc(s)}</th>`).join("")}</tr>${rows}</table></div>
    ${pats?`<div class="pillrow" style="margin-top:10px">${pats}</div>`:""}
    ${p.notes?`<div class="note-box">${esc(p.notes)}</div>`:""}

}

function rmProdImg(i){window._pimgs.splice(i,1);document.querySelectorAll(".imgwrap")[i]?.remove();}
function rmProdPat(i){window._ppats[i]=null;event.target.parentElement.remove();}
function chartSizes(){return el("p_sizes").value.split(",").map(s=>s.trim()).filter(Boolean);}
function captureChart(){
  Object.keys(window._chart||{}).forEach(s=>{MEAS.forEach(m=>{const inp=el(`sc_${s}_${m[0]}`); if(inp) window._chart[s][m[0]]=inp.value;});});
}
function redrawChart(){
  const sizes=chartSizes();
  sizes.forEach(s=>{window._chart[s]=window._chart[s]||{};});
  el("chartGrid").innerHTML = sizes.length? `<div style="overflow-x:auto"><table><tr><th>القياس</th>${sizes.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>
    ${MEAS.map(m=>`<tr><td>${m[1]}</td>${sizes.map(s=>`<td><input id="sc_${s}_${m[0]}" style="min-width:58px;padding:6px" value="${esc(window._chart[s]?.[m[0]]||"")}"></td>`).join("")}</tr>`).join("")}</table></div>`:"";
}
async function saveProduct(){
  const name=el("p_name").value.trim(); if(!name) return alert("اكتب اسم المنتج");
  captureChart();
  const imgFiles=el("p_imgs").files, patFiles=el("p_pats").files, artFile=el("p_art").files[0];
  for(const f of imgFiles){const u=await uploadFile(f,"products"); if(u) window._pimgs.push(u);}
  const pats=window._ppats.filter(Boolean);
  for(const f of patFiles){const u=await uploadFile(f,"patterns"); if(u) pats.push({name:f.name,url:u});}
  let artwork=editProductId?product(editProductId).artwork_url:null;
  if(artFile){const u=await uploadFile(artFile,"artwork"); if(u) artwork=u;}
  const comps=el("p_comps").value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b]=s.split("/").map(x=>x.trim());return{ar:a,en:b||a};});
  const chart={}; chartSizes().forEach(s=>chart[s]=window._chart[s]||{});
  const row={name, name_en:el("p_name_en").value||null, images:window._pimgs, patterns:pats, components:comps,
    embroidery_kind:el("p_embk").value||null, embroidery:el("p_embk").value? el("p_embp").value : "none",
    embroidery_note:el("p_embn").value||null, artwork_url:artwork, external_make:!!el("p_ext").value,
    est_cut_min:+el("p_ec").value||null, est_sew_min:+el("p_es").value||null, size_chart:chart, notes:el("p_notes").value||null};
  if(editProductId) await sb.from("products").update(row).eq("id",editProductId);
  else await sb.from("products").insert(row);
  closeSheet(); await refresh();
}
async function delProduct(id){
  const used=DB.lines.some(l=>l.product_id===id);
  if(used){ if(confirm("المنتج مستخدم في أوامر — ما ينحذف. تبي أرشفته؟")){await sb.from("products").update({active:false}).eq("id",id); await refresh();} return;}
  if(confirm("حذف المنتج نهائياً؟")){await sb.from("products").delete().eq("id",id); await refresh();}
}

async function makeJob(mode){
  const ids=[...document.querySelectorAll(".poolchk:checked")].map(c=>c.value);
  if(!ids.length) return alert("اختر القطع أولاً");
  const vendor=el(mode==="emb"?"j_vendor":"x_vendor").value||null;
  const kind=mode==="ext"?"تنفيذ خارجي":(product(DB.lines.find(l=>l.id===ids[0]).product_id).embroidery_kind||"تطريز");
  const {data:j}=await sb.from("ext_jobs").insert({kind,vendor,line_ids:ids}).select().single();
  for(const id of ids) await sb.from("order_lines").update({stage_status:"sent"}).eq("id",id);
  await refresh(); printJob(j.id);
}
async function receiveJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  for(const id of (j.line_ids||[])){
    const l=DB.lines.find(x=>x.id===id); if(!l) continue;
    const p=product(l.product_id);
    await moveLine(id, l.stage==="ext"? "qc" : nextStage("emb",p));
  }
  await sb.from("ext_jobs").update({status:"received",returned_at:today()}).eq("id",jobId);
  await refresh();
}

/* ---- جوب أوردر للطباعة ---- */
function printJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  const lines=(j.line_ids||[]).map(id=>DB.lines.find(l=>l.id===id)).filter(Boolean);
  const isExt=j.kind==="تنفيذ خارجي";
  const rows=lines.map(l=>{const p=product(l.product_id),o=order(l.order_id);
    const cs=l.custom_specs? MEAS.filter(m=>l.custom_specs[m[0]]).map(m=>`${m[1]}: ${l.custom_specs[m[0]]}`).join(" · ")+[l.custom_specs.sleeve?` · كم: ${l.custom_specs.sleeve}`:"",l.custom_specs.bottom?` · ${l.custom_specs.bottom}`:""].join("") : "";
    return `<tr>
      <td>${pimg(p)?`<img src="${esc(pimg(p))}" style="width:70px;height:70px;object-fit:cover;border-radius:8px">`:""}</td>
      <td><b>${esc(p.name)}</b><br><span style="color:#666">${esc(p.name_en||"")}</span>${cs?`<br><small>${cs}</small>`:""}</td>
      <td style="text-align:center;font-size:20px;font-weight:800">${esc(l.size||"—")}</td>
      <td style="text-align:center;font-size:20px;font-weight:800">${l.qty}</td>
      <td>#${o.order_no}</td></tr>`;}).join("");
  const total=lines.reduce((a,l)=>a+l.qty,0);
  const arts=[...new Set(lines.map(l=>product(l.product_id)).filter(p=>p.artwork_url).map(p=>p.id))].map(id=>{const p=product(id);
    return `<div style="margin-top:14px;page-break-inside:avoid"><b>${esc(p.name)} — الرسمة/الموضع:</b><br>${p.embroidery_note?`<div>${esc(p.embroidery_note)}</div>`:""}<img src="${esc(p.artwork_url)}" style="max-width:300px;border:1px solid #ddd;border-radius:8px;margin-top:6px"></div>`;}).join("");
  const charts=isExt? [...new Set(lines.map(l=>l.product_id))].map(pid=>{const p=product(pid);const chart=p.size_chart||{};const sizes=Object.keys(chart);
    if(!sizes.length) return "";
    return `<div style="margin-top:14px;page-break-inside:avoid"><b>${esc(p.name)} — جدول القياسات (سم):</b>
    <table><tr><th>القياس</th>${sizes.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>
    ${MEAS.map(m=>`<tr><td>${m[1]}</td>${sizes.map(s=>`<td>${esc(chart[s]?.[m[0]]||"—")}</td>`).join("")}</tr>`).join("")}</table>
    ${(p.patterns||[]).length?`<div style="margin-top:4px">الباترونات: ${(p.patterns||[]).map(x=>`<a href="${esc(x.url)}">${esc(x.name)}</a>`).join(" · ")}</div>`:""}</div>`;}).join("") : "";
  const w=window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>Job Order</title>
  <style>body{font-family:'Tajawal',Arial,sans-serif;padding:28px;color:#111}
  table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #ddd;padding:8px;text-align:right}
  .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:12px}
  .lg{font-family:Arial;font-weight:700;letter-spacing:5px;font-size:22px}</style></head><body>
  <div class="hd"><div class="lg">VEEVOGUE</div><div style="text-align:left">JOB ORDER<br><b>${esc(j.kind)}</b></div></div>
  <p>المصدر: <b>${esc(j.vendor||"—")}</b> &nbsp;·&nbsp; التاريخ: ${esc(j.sent_at)} &nbsp;·&nbsp; إجمالي القطع: <b>${total}</b></p>
  <table><tr><th></th><th>المنتج</th><th>العمر/المقاس</th><th>الكمية</th><th>الأمر</th></tr>${rows}</table>
  ${arts}${charts}
  <p style="margin-top:26px;color:#666">ملاحظات: ${esc(j.notes||"—")}</p>
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

async function saveWorker(){
  const name=el("w_name").value.trim(); if(!name) return alert("اكتب الاسم");
  const specs=[...document.querySelectorAll("#specPills .pill.on")].map(x=>x.dataset.k);
  if(!specs.length) return alert("اختر تخصص واحد على الأقل");
  await sb.from("workers").insert({name, name_en:el("w_name_en").value||null, specialties:specs, pin:el("w_pin").value||null});
  await refresh();
}
function editWorker(id){
  const w=worker(id);
  openSheet(`<div class="title">تعديل: ${esc(w.name)}</div>
    <div class="grid2"><div><label>الاسم</label><input id="ew_name" value="${esc(w.name)}"></div>
    <div><label>إنجليزي</label><input id="ew_name_en" dir="ltr" value="${esc(w.name_en||"")}"></div></div>
    <label>التخصصات</label>
    <div class="pillrow" id="ewPills">${Object.keys(SPEC_LABEL).map(k=>`<span class="pill ${(w.specialties||[]).includes(k)?'on':''}" data-k="${k}" onclick="this.classList.toggle('on')">${SPEC_LABEL[k][0]}</span>`).join("")}</div>
    <label>الرقم السري</label><input id="ew_pin" value="${esc(w.pin||"")}">
    <button class="btn btn-ink btn-big" onclick="updateWorker('${id}')">حفظ</button>`);
}
async function updateWorker(id){
  const specs=[...document.querySelectorAll("#ewPills .pill.on")].map(x=>x.dataset.k);
  await sb.from("workers").update({name:el("ew_name").value, name_en:el("ew_name_en").value||null, specialties:specs, pin:el("ew_pin").value||null}).eq("id",id);
  closeSheet(); await refresh();
}
async function stopWorker(id){if(confirm("إيقاف العامل؟")){await sb.from("workers").update({active:false}).eq("id",id); await refresh();}}
async function addReason(){const t=el("newReason").value.trim(); if(!t)return; await sb.from("repair_reasons").insert({label:t}); await refresh();}
async function toggleReason(id,cur){await sb.from("repair_reasons").update({active:!cur}).eq("id",id); await refresh();}

/* ---- الأداء ---- */
function tabPerf(){
  const done=DB.events.filter(e=>e.started_at&&e.finished_at&&e.worker_id);
  if(!done.length){el("tabbody").innerHTML=`<div class="empty">البيانات تتجمع مع الاستخدام</div>`; return;}
  const rows={};
  done.forEach(e=>{
    const k=e.worker_id+"|"+e.stage;
    rows[k]=rows[k]||{w:worker(e.worker_id).name, stage:STAGE_AR[e.stage]||e.stage, n:0, total:0, est:0, estN:0};
    const r=rows[k]; r.n++; r.total+=mins(e.started_at,e.finished_at);
    const l=DB.lines.find(x=>x.id===e.line_id);
    if(l){const p=product(l.product_id);
      const est=e.stage==="cut"?p.est_cut_min: e.stage==="sew"?p.est_sew_min: null;
      if(est){r.est+=est*l.qty; r.estN++;}}
  });
  const fixes={};
  DB.events.filter(e=>e.result==="fix").forEach(e=>{
    const sews=DB.events.filter(x=>x.line_id===e.line_id&&x.stage==="sew"&&x.finished_at&&x.worker_id&&x.finished_at<e.started_at);
    if(sews.length){const wid=sews[sews.length-1].worker_id; fixes[wid]=(fixes[wid]||0)+1;}
  });
  el("tabbody").innerHTML=`<div class="card">
    <div class="title">الوقت الفعلي مقابل التقديري</div>
    <table><tr><th>العامل</th><th>المرحلة</th><th>عدد</th><th>متوسط فعلي</th><th>متوسط تقديري</th></tr>
    ${Object.values(rows).map(r=>`<tr><td>${esc(r.w)}</td><td>${r.stage}</td><td>${r.n}</td><td>${Math.round(r.total/r.n)} د</td><td>${r.estN?Math.round(r.est/r.estN)+" د":"—"}</td></tr>`).join("")}</table>
    ${Object.keys(fixes).length?`<div class="title" style="margin-top:14px">قطع رجعت «تعديل»</div>
    <table><tr><th>العامل</th><th>عدد</th></tr>${Object.entries(fixes).map(([wid,n])=>`<tr><td>${esc(worker(wid).name)}</td><td>${n}</td></tr>`).join("")}</table>`:""}
    <p class="muted" style="margin-top:10px">أول شهر لضبط الأوقات التقديرية — لا تقيّم على أرقام غير مضبوطة.</p>
  </div>`;
}
</script>
