  button,.pill,.tabs button,.stat,.chip{touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  [dir="ltr"], [dir="ltr"] *{font-family:'Inter','Almarai',sans-serif;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;touch-action:manipulation;}
  header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .lgbox{width:36px;height:36px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand .lgbox img{width:100%;height:100%;object-fit:cover;transform:scale(2.1);}
  .brand .bname{font-family:'Inter';font-weight:700;letter-spacing:4px;font-size:15px;}
  header .right{display:flex;gap:8px;align-items:center;}
  header .who{font-size:13px;color:var(--gray);}
  .hbtn{background:var(--soft);color:var(--ink);border:0;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;}
  .hbtn.dark{background:var(--ink);color:#fff;}
  main{max-width:900px;margin:0 auto;padding:14px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;}
  .btn-ink{background:var(--ink);color:#fff;}
  .btn-wine{background:var(--green);color:#fff;}
  .btn-line{background:var(--paper);color:var(--ink);border:1px solid var(--ink);}
  .btn-ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);}
  .btn-ok{background:var(--green);color:#fff;}
  .btn-warn{background:var(--paper);color:var(--gray);border:1px solid var(--line);}
  .btn-bad{background:var(--wine);color:#fff;}
  .btn-big{width:100%;padding:15px;font-size:17px;border-radius:12px;margin-top:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tabs button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--gray);}

  .muted{color:var(--gray);font-size:13px;}
  .title{font-weight:900;font-size:16px;margin-bottom:6px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}

  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;}

  .imgrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .imgwrap{position:relative;display:inline-block;line-height:0;}
  .rm{position:absolute;top:6px;inset-inline-end:6px;background:var(--wine);color:#fff;border:2px solid #fff;

  .rm:hover{background:var(--wine-dk);transform:scale(1.08);}
  .timer{font-family:'Inter';font-size:13px;font-weight:700;}
  .t-ok{color:var(--green);} .t-late{color:var(--wine);}
  .wcard{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:14px;margin-bottom:10px;}
  .wtop{display:flex;gap:12px;align-items:flex-start;}
  .wmeta{display:flex;gap:14px;margin:10px 0 2px;flex-wrap:wrap;}
  .wmeta>div{text-align:center;}
  .note-box{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .pill{border:1.5px solid var(--ink);border-radius:16px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--paper);}
  .pill.on{background:var(--ink);color:#fff;}
  .checkrow{display:flex;gap:10px;align-items:center;padding:6px 0;}
  .checkrow input{width:auto;}
  .banner{background:var(--wine-lt);color:var(--wine-dk);border:1px solid #E8D4D8;border-radius:12px;padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;}
  .banner .btn{background:var(--wine);color:#fff;}
  .breakbar{background:var(--green-lt);color:var(--green-dk);border:1px solid #DCE5DA;border-radius:12px;padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;}
  .breakbar.over{background:var(--wine-lt);color:var(--wine-dk);border-color:#E8D4D8;}
  .keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:280px;margin:8px auto;}
  .keypad button{font-size:22px;padding:16px;}
  @media(max-width:520px){.grid3{grid-template-columns:1fr 1fr;}}
</style>

/* ضغط الصور قبل الرفع — يوفر ~90% من المساحة */
async function compressImage(file, maxDim=1600, quality=0.82){
  if(!file.type.startsWith("image/") || file.type==="image/gif") return file;
  try{
    const bmp = await createImageBitmap(file);
    let {width:w, height:h} = bmp;
    if(Math.max(w,h) > maxDim){ const r=maxDim/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(bmp,0,0,w,h);
    const blob = await new Promise(res=>c.toBlob(res,"image/jpeg",quality));
    if(!blob || blob.size>=file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}
async function uploadFile(file, folder){
  const f = await compressImage(file);
  const ext=(f.name.split(".").pop()||"bin");
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from("files").upload(path,f);
  if(error){alert("فشل الرفع: "+error.message);return null;}
  return sb.storage.from("files").getPublicUrl(path).data.publicUrl;
}

function toCSV(rows){
  if(!rows.length) return "";
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const esc2=v=>{ if(v===null||v===undefined) return ""; const s=typeof v==="object"?JSON.stringify(v):String(v);
    return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return keys.join(",")+"\n"+rows.map(r=>keys.map(k=>esc2(r[k])).join(",")).join("\n");
}

async function genParts(lineId, lineOpt, otype, stage){

  const o=order(l.order_id); const p=product(l.product_id);

/* التقدير التلقائي المتعلّم: متوسط الفعلي التاريخي لنفس المنتج ونفس المرحلة */
function learnedEst(productId, stage, partAr){
  const evs=DB.events.filter(e=>e.stage===stage&&e.started_at&&e.finished_at&&e.worker_id&&
    DB.lines.some(l=>l.id===e.line_id&&l.product_id===productId)&&
    (!partAr || (e.part_id && (DB.parts.find(x=>x.id===e.part_id)||{}).part_ar===partAr)));
  if(evs.length<2) return null;
  const vals=evs.map(e=>workedMins(e.started_at,e.finished_at)).filter(v=>v>0&&v<600);
  if(vals.length<2) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function estFor(p, stage, partAr, qty){
  const manual = stage==="cut"? p.est_cut_min : ((partAr&&(p.est_parts||{})[partAr]) || p.est_sew_min);
  const learned = learnedEst(p.id, stage, partAr);
  const base = manual || learned;
  return base? base*(qty||1) : null;
}

/* سحب على الصف نفسه — يتحرك ويكشف الإجراءات خلفه (مثل واتساب) */
function enableSwipe(){
  document.querySelectorAll(".swipe:not([data-sw])").forEach(row=>{
    row.dataset.sw="1";
    const btn=row.querySelector(".rowbtn"); if(!btn) return;
    /* لوح الإجراءات خلف الصف */
    const back=document.createElement("div");
    back.className="swipeback";
    back.innerHTML=`<span>${I.trash}</span>`;
    row.appendChild(back);
    const inner=document.createElement("div");
    inner.className="swipefront";
    while(row.firstChild && row.firstChild!==back) inner.appendChild(row.firstChild);
    row.insertBefore(inner,back);

    let x0=null,dx=0,active=false;
    const rtl=document.documentElement.dir==="rtl";
    inner.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;active=true;inner.style.transition="none";},{passive:true});
    inner.addEventListener("touchmove",e=>{
      if(!active) return;
      dx=e.touches[0].clientX-x0;
      const open = rtl? Math.max(0,dx) : Math.min(0,dx);
      if(Math.abs(open)>4) inner.style.transform=`translateX(${Math.max(-90,Math.min(90,open))}px)`;
    },{passive:true});
    inner.addEventListener("touchend",()=>{
      if(!active) return; active=false;
      inner.style.transition="transform .18s ease";
      const passed = rtl? dx>60 : dx<-60;
      inner.style.transform="translateX(0)";
      if(passed) setTimeout(()=>btn.click(),120);
      dx=0;
    },{passive:true});
  });
}

  const custom=(DB.settings||{}).creative_tabs;
  return (custom&&custom.length)? custom : TABS_CREATIVE;
}
function renderDesk(){
  const tabs=myTabs();
  if(!tabs.includes(mTab)) mTab=tabs[0];
  el("app").innerHTML=`
    <div class="tabs">${tabs.map(k=>`<button class="${mTab===k?'on':''}" onclick="mTab='${k}';localStorage.setItem('vv2_tab','${k}');render()">${t(k)}</button>`).join("")}</div>
    <div id="tabbody"></div>`;
  ({board:tabBoard,newOrder:tabNewOrder,products:tabProducts,design:tabDesign,external:tabExternal,
    shoots:tabShoots,quality:tabQuality,perf:tabPerf,settings:tabSettings,archive:tabArchive})[mTab]();
}

/* ---- لوحة ---- */
function stageStats(){
  const act=DB.lines.filter(l=>activeLine(l));
  const sel=window._bFilter;
  const box=(key,icon,all,go,wait,alt)=>`<div class="stat" style="cursor:pointer;${sel===key?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='${key}'?null:'${key}');render()">${icon}
      <div class="nums">${alt? `<span class="n-go">${go}</span><span class="n-wait">${wait}</span>`
        : `<span class="n-all">${all}</span><span class="n-go">${go}</span><span class="n-wait">${wait}</span>`}</div>
      <div class="cap">${t(key)}</div></div>`;
  const cnt=(st)=>{
    const ls=act.filter(l=>l.stage===st);
    if(st==="sew"){
      let go=0,wait=0,all=0;
      ls.forEach(l=>{const ps=DB.parts.filter(p=>p.line_id===l.id);
        all+=ps.length||1; go+=ps.filter(p=>p.status==="working").length; wait+=ps.filter(p=>p.status==="waiting").length;});
      return {all,go,wait};
    }
    return {all:ls.length, go:ls.filter(l=>l.stage_status==="working").length, wait:ls.filter(l=>l.stage_status!=="working").length};
  };
  const c=cnt("cut"), e=cnt("emb"), s=cnt("sew");
  const qcN=act.filter(l=>l.stage==="qc").length;
  const packN=act.filter(l=>l.stage==="pack").length;
  const extSent=act.filter(l=>(l.stage==="ext"||l.stage==="emb")&&l.stage_status==="sent").length;
  const extRec=DB.jobs.filter(j=>j.status==="received").reduce((a,j)=>a+(j.line_ids||[]).length,0);
  const dActive=DB.designs.filter(d=>(d.stage||"idea")!=="approved");
  const dGo=DB.designs.filter(d=>d.stage==="sample"&&d.sample_started_at&&!d.sample_finished_at).length;
  const dWait=DB.designs.filter(d=>d.stage==="sample"&&!d.sample_started_at).length;
  return `<div class="statrow">
    <div class="stat" style="cursor:pointer;${sel==='design'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='design'?null:'design');render()">${I.design}
      <div class="nums"><span class="n-all">${dActive.length}</span><span class="n-go">${dGo}</span><span class="n-wait">${dWait}</span></div>
      <div class="cap">${t("design")}</div></div>
    ${box("cut",I.cut,c.all,c.go,c.wait)}
    ${box("emb",I.emb,e.all,e.go,e.wait)}
    ${box("sew",I.sew,s.all,s.go,s.wait)}
    <div class="stat" style="cursor:pointer;${sel==='qc'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='qc'?null:'qc');render()">${I.qc}<div class="nums"><span class="n-all">${qcN}</span></div><div class="cap">${t("qc")}</div></div>
    <div class="stat" style="cursor:pointer;${sel==='pack'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='pack'?null:'pack');render()">${I.pack}<div class="nums"><span class="n-all">${packN}</span></div><div class="cap">${t("pack")}</div></div>
    <div class="stat" style="cursor:pointer;${sel==='ext'?'border-color:var(--ink);border-width:2px;':''}" onclick="window._bFilter=(window._bFilter==='ext'?null:'ext');render()">${I.ext}<div class="nums"><span class="n-go">${extSent}</span><span class="n-all">${extRec}</span></div><div class="cap">${t("sent")} / ${t("received")}</div></div>
  </div>
  <div class="legend">
    <span><i class="dot d-all"></i>${t("total")}</span>
    <span><i class="dot d-go"></i>${isAr()?"جاري العمل":"In progress"}</span>
    <span><i class="dot d-wait"></i>${isAr()?"ما بدأ بعد":"Not started"}</span>
  </div>`;
}
function tabBoard(){
  const act=DB.lines.filter(l=>activeLine(l));
  const workingNow=[];
  act.forEach(l=>{
    if(l.stage_status==="working"&&l.claimed_by) workingNow.push({w:worker(l.claimed_by),l,stage:l.stage,ev:DB.events.find(e=>e.line_id===l.id&&!e.part_id&&e.started_at&&!e.finished_at)});
    DB.parts.filter(p=>p.line_id===l.id&&p.status==="working").forEach(p=>workingNow.push({w:worker(p.worker_id),l,stage:"sew",part:p,ev:DB.events.find(e=>e.part_id===p.id&&e.started_at&&!e.finished_at)}));
  });
  const embPool=act.filter(l=>l.stage==="emb"&&l.stage_status!=="sent").length;
  const extPool=act.filter(l=>l.stage==="ext"&&l.stage_status!=="sent").length;
  const activeOrders=DB.orders.filter(o=>o.status==="جاري");
  const onBreakNow=DB.breaks.filter(b=>!b.ended_at);
  el("tabbody").innerHTML=`
    ${stageStats()}
    ${(embPool||extPool)&&session.role==="manager"?`<div class="banner">
      <div>${embPool?`${I.emb} <b>${embPool}</b> ${isAr()?"قطعة للتطريز/الطباعة":"pcs for embroidery"}`:""} ${extPool?` · ${I.ext} <b>${extPool}</b> ${isAr()?"للتنفيذ الخارجي":"for external"}`:""}</div>
      <button class="btn" onclick="mTab='external';render()">${t("open")} ←</button></div>`:""}
    ${onBreakNow.length?`<div class="breakbar">${I.coffee} ${onBreakNow.map(b=>`${esc(wname(worker(b.worker_id)))} (${mins(b.started_at,new Date().toISOString())}${t("minutes")})`).join(" · ")}</div>`:""}
    <div class="card"><div class="title">${I.clock} ${t("workingNow")}</div>
      ${workingNow.length? workingNow.map(x=>{
        const m=x.ev? workedMins(x.ev.started_at):0;
        const p=product(x.l.product_id);
        const estT=estFor(p, x.stage, x.part?x.part.part_ar:null, x.l.qty);
        const over=estT? m>estT : m>480;
        return `<div class="lineitem"><div><b>${esc(wname(x.w))}</b> — ${t(STAGE_KEY[x.stage]||x.stage)}${x.part?` (${esc(isAr()?x.part.part_ar:x.part.part_en)})`:""} — ${esc(pname(p))} <span class="muted">#${order(x.l.order_id).order_no}</span></div>
        <div class="timer ${over?'t-late':'t-ok'}">${m} ${t("minutes")}</div></div>`;}).join("")
      : `<div class="muted">${t("noOneWorking")}</div>`}
    </div>
    <hr class="sep">
    ${window._bFilter? stageFilterView(window._bFilter)
      : (activeOrders.length? activeOrders.map(orderCard).join("") : `<div class="empty">${t("noOrders")}</div>`)}`;
}
/* عرض مفلتر لمرحلة واحدة: الشغال فوق ثم اللي ما بدأ */
function stageFilterView(stg){
  if(stg==="design"){
    const ds=DB.designs.filter(d=>(d.stage||"idea")!=="approved");
    if(!ds.length) return `<div class="empty">—</div>`;
    return DSTAGES.filter(s=>s!=="approved").map(st=>{
      const list=ds.filter(d=>(d.stage||"idea")===st); if(!list.length) return "";
      return `<div class="sechead">${dlab(st)} (${list.length})</div>`+list.map(d=>`<div class="card">
        <div class="wtop">${(d.mood&&d.mood[0])||(d.sketches&&d.sketches[0])?`<img class="thumb" src="${esc((d.sketches&&d.sketches[0])||d.mood[0])}">`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#c8c2b8">${I.design}</div>`}
        <div style="flex:1"><div class="title">${esc(d.final_name||d.name)}</div>
        <div class="muted">${esc(collection_(d.collection_id).name||"")}${d.sample_worker_id?` · ${esc(wname(worker(d.sample_worker_id)))}`:""}</div></div></div>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="mTab='design';window._curCol='${d.collection_id||""}';render();openDesign('${d.id}')">${t("open")} ←</button>
      </div>`).join("");
    }).join("");
  }
  const act=DB.lines.filter(l=>activeLine(l)&&l.stage===stg);
  const rows=[];
  act.forEach(l=>{
    if(stg==="cut"||stg==="sew"){
      const ps=DB.parts.filter(p=>p.line_id===l.id&&(p.stage||"sew")===stg&&p.status!=="done");
      if(ps.length) ps.forEach(p=>rows.push({l,part:p,working:p.status==="working",who:p.worker_id}));
      else rows.push({l,part:null,working:l.stage_status==="working",who:l.claimed_by});
    } else rows.push({l,part:null,working:l.stage_status==="working",who:l.claimed_by});
  });
  const go=rows.filter(r=>r.working), wait=rows.filter(r=>!r.working);
  const card=r=>{
    const p=product(r.l.product_id), o=order(r.l.order_id);
    const ev=r.part? DB.events.find(e=>e.part_id===r.part.id&&e.started_at&&!e.finished_at)
                   : DB.events.find(e=>e.line_id===r.l.id&&!e.part_id&&e.started_at&&!e.finished_at);
    const m=ev? workedMins(ev.started_at):0;
    const estT=estFor(p,stg,r.part?r.part.part_ar:null,r.l.qty);
    return `<div class="card"><div class="wtop">${thumb(p)}
      <div style="flex:1"><div class="title">${esc(pname(p))} ${r.part?`<span class="chip">${esc(isAr()?r.part.part_ar:r.part.part_en)}</span>`:""}</div>
      <div class="muted">#${o.order_no} · ${esc(r.l.size||"")} × ${r.l.qty} ${o.due_date?`· ${isLate(o)?`<span class="late">${t("late")}</span>`:t("due")+" "+fmtD(o.due_date)}`:""}</div>
      ${r.who?`<span class="chip working">${I.user} ${esc(wname(worker(r.who)))}</span>`:""}
      ${ev?`<span class="timer ${estT&&m>estT?'t-late':'t-ok'}"> ${m} ${t("minutes")}</span>`:""}
      </div></div>
      ${r.working&&session.role==="manager"?`<button class="btn btn-warn" style="margin-top:8px;padding:6px 12px;font-size:13px" onclick="undoStart('${r.l.id}','${r.part?r.part.id:""}')">↩ ${isAr()?"إلغاء البدء":"Undo start"}</button>`:""}
    </div>`;};
  return `<div class="sechead">${I[stg]||""} ${t(STAGE_KEY[stg]||stg)} — ${isAr()?"شغال الحين":"in progress"} (${go.length})</div>
    ${go.length? go.map(card).join("") : `<div class="empty">—</div>`}
    <hr class="sep">
    <div class="sechead">${isAr()?"ما بدأ بعد":"not started"} (${wait.length})</div>
    ${wait.length? wait.map(card).join("") : `<div class="empty">—</div>`}`;
}
function lineChip(l){
  const w=l.claimed_by?worker(l.claimed_by):null;
  const partsInfo=l.stage==="sew"? (()=>{const ps=DB.parts.filter(p=>p.line_id===l.id);const d=ps.filter(p=>p.status==="done").length;return ps.length>1?` ${d}/${ps.length}`:"";})():"";
  return `<span class="chip ${l.stage_status==='working'?'working':''}">${I[l.stage]||""} ${t(STAGE_KEY[l.stage]||l.stage)}${partsInfo}${w?` · ${esc(wname(w))}`:""}</span>`;
}

    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center">
      <div style="flex:1;cursor:pointer" onclick="toggleOrder('${o.id}')">
        <div class="title">${t("order")} #${o.order_no} <span class="chip wine">${esc(o.order_type)}</span> <span class="muted">${doneN}/${ls.length}</span></div>

      </div>
      ${session.role==="manager"? rowMenu(`${t("order")} #${o.order_no}`,[
        {label:isAr()?"قائمة الشراء":"Purchase list", icon:I.pack, fn:()=>showPurchase(o.id)},

        {label:isAr()?"حذف الأمر نهائياً":"Delete order", icon:I.trash, danger:true, fn:()=>delRow("orders",o.id)}
      ]):""}
    </div>
    ${isOpen?`
      ${o.customer_ref?`<div class="muted">${t("invoice")}: ${esc(o.customer_ref)}</div>`:""}
      ${o.repair_reason?`<div class="muted">${t("reason")}: ${esc(o.repair_reason)}</div>`:""}
      ${ls.map(l=>`<div class="lineitem swipe">
        <div style="flex:1"><b>${esc(pname(product(l.product_id)))}</b> <span class="muted">${esc(l.size||"")} ${esc(l.color||"")} × ${l.qty}</span>${l.custom_specs?` <span class="chip sage">${I.ruler}</span>`:""}</div>
        <div>${lineChip(l)} ${l.stage==="pack"&&session.role==="manager"?`<button class="btn btn-ok" style="padding:5px 10px;font-size:12px" onclick="shipLine('${l.id}')">${I.shipped}</button>`:""}
        ${session.role==="manager"? rowMenu(esc(pname(product(l.product_id)))+" "+esc(l.size||""),[
          {label:isAr()?"إرجاع للقص":"Back to cut", icon:I.cut, fn:async()=>{await moveLine(l.id,"cut");await refresh();}},
          {label:isAr()?"إرجاع للخياطة":"Back to sew", icon:I.sew, fn:async()=>{await moveLine(l.id,"sew");await refresh();}},
          {label:isAr()?"حذف هذا السطر":"Delete line", icon:I.trash, danger:true, fn:()=>delRow("order_lines",l.id)}
        ]):""}</div>
      </div>`).join("")}
      ${session.role==="manager"&&o.status==="جاري"&&ls.length&&ls.every(l=>l.stage==="shipped")?`<button class="btn btn-ink btn-big" onclick="closeOrder('${o.id}')">${t("closeOrder")} ✓</button>`:""}
    `:""}
  </div>`;
}
function toggleOrder(id){
  let a=JSON.parse(localStorage.getItem("vv_open")||"[]");
  a = a.includes(id)? a.filter(x=>x!==id) : [...a,id];
  localStorage.setItem("vv_open",JSON.stringify(a)); render();
}
/* ===== قائمة الشراء التقديرية ===== */
function purchaseFor(lines){
  const need={};
  lines.forEach(l=>{
    const p=product(l.product_id);
    (p.bom||[]).forEach(b=>{
      need[b.material_id]=(need[b.material_id]||0)+ (b.qty*(l.qty||1));
    });
  });
  return need;
}
function showPurchase(orderId){
  const lines=DB.lines.filter(l=>l.order_id===orderId);
  const need=purchaseFor(lines);
  const rows=Object.entries(need);
  const noBom=[...new Set(lines.map(l=>l.product_id))].filter(pid=>!(product(pid).bom||[]).length);
  let total=0;
  openSheet(`<div class="title">${I.pack} ${isAr()?"قائمة الشراء التقديرية":"Purchase list"} — ${t("order")} #${order(orderId).order_no}</div>
    ${rows.length?`<table><tr><th>${isAr()?"الخام":"Material"}</th><th>${isAr()?"الكود":"SKU"}</th><th>${isAr()?"المطلوب":"Needed"}</th><th>${isAr()?"التكلفة":"Cost"}</th></tr>
      ${rows.map(([id,q])=>{const m=material(id); const c=m.price? m.price*q:null; if(c) total+=c;
        return `<tr><td>${esc(m.name)}${m.color?` · ${esc(m.color)}`:""}</td><td>${esc(m.sku||"—")}</td>
        <td><b>${Math.round(q*100)/100}</b> ${esc(m.unit||"")}</td><td>${c?Math.round(c*100)/100:"—"}</td></tr>`;}).join("")}
      ${total?`<tr><td colspan="3"><b>${isAr()?"الإجمالي":"Total"}</b></td><td><b>${Math.round(total*100)/100}</b></td></tr>`:""}</table>`
    :`<div class="empty">${isAr()?"ما في خامات مربوطة بمنتجات هذا الأمر":"No materials linked"}</div>`}
    ${noBom.length?`<div class="note-box">${isAr()?"منتجات بدون خامات مسجلة":"Products without materials"}: ${noBom.map(pid=>esc(pname(product(pid)))).join(" · ")}</div>`:""}
    <button class="btn btn-ghost btn-big" onclick="window.print()">${I.print} ${isAr()?"طباعة":"Print"}</button>`);
}
async function shipLine(id){await moveLine(id,"shipped");await refresh();}
async function closeOrder(id){await sb.from("orders").update({status:"مكتمل"}).eq("id",id);await refresh();}
async function cancelOrder(id){if(confirm("إلغاء الأمر كامل؟")){await sb.from("orders").update({status:"ملغي"}).eq("id",id);await refresh();}}

function tabArchive(){
  const q=(window._archQ||"").trim();
  let list=DB.orders.filter(o=>o.status!=="جاري");
  if(q) list=list.filter(o=>String(o.order_no).includes(q)||(o.customer_ref||"").includes(q)||
    DB.lines.filter(l=>l.order_id===o.id).some(l=>pname(product(l.product_id)).includes(q)));
  el("tabbody").innerHTML=`<div class="card">
    <input id="archQ" placeholder="${isAr()?'بحث برقم الأمر أو الفاتورة أو المنتج...':'Search...'}" value="${esc(q)}"
      oninput="window._archQ=this.value" onchange="render()">
    <button class="btn btn-ghost btn-big" onclick="window._archQ=el('archQ').value;render()">${isAr()?"بحث":"Search"}</button>
  </div>
  ${list.length? list.map(orderCard).join("") : `<div class="empty">—</div>`}`;
}

async function saveSettings(){
  const msg=el("setMsg"); if(msg) msg.textContent="...";
  const days=[...document.querySelectorAll("#dayPills .pill.on")].map(x=>x.dataset.d);
  const row={work_start:el("s_start").value, work_end:el("s_end").value, work_days:days, break_minutes:+el("s_break").value||0, updated_at:new Date().toISOString()};
  if(el("s_cpin")) row.creative_pin=el("s_cpin").value||"4826";
  if(el("ctabPills")) row.creative_tabs=[...document.querySelectorAll("#ctabPills .pill.on")].map(x=>x.dataset.k);
  const {data,error}=await sb.from("settings").upsert({id:1,...row}).select();
  if(error){ if(msg){msg.style.color="var(--wine)"; msg.textContent="✕ "+error.message;} return; }
  await loadAll();
  if(msg){msg.style.color="var(--green)"; msg.textContent=t("savedOk");}
}
/* ---- أمر جديد ---- */
function tabNewOrder(){
  const prods=DB.products.filter(p=>p.active);
  if(!prods.length){el("tabbody").innerHTML=`<div class="empty">${isAr()?"أضف منتجات أولاً":"Add products first"}</div>`;return;}

function captureOrder(){
  newLines=newLines.map((l,i)=>el("ld"+i)?{product_id:el("ld"+i).value,size:el("ls"+i).value,color:el("lc"+i).value,qty:+el("lq"+i).value||1}:l);
  customModels=customModels.map((m,i)=>{
    if(!el("cm_p"+i)) return m;
    const o={product_id:el("cm_p"+i).value, qty:+el("cm_q"+i).value||1, color:el("cm_c"+i).value,
      sleeve:el("cm_sl"+i).value, bottom:el("cm_bt"+i).value, notes:el("cm_n"+i).value, age:el("cm_age"+i).value};
    allMeas().forEach(x=>o[x[0]]=el("cm_"+x[0]+i).value);
    return o;
  });
}
function addLine(){captureOrder();newLines.push({});render();}
function fillAges(){
  captureOrder();
  const pid=el("bulk_p").value; const p=product(pid);
  const ages=Object.keys(p.size_chart||{});
  if(!ages.length) return alert(isAr()?"هذا المنتج ما عنده أعمار مسجلة — أضفها من بطاقة المنتج":"No ages on this product");
  const keep=newLines.filter(l=>l.product_id&&l.size);
  newLines=[...keep, ...ages.map(a=>({product_id:pid,size:a,color:"",qty:1}))];
  render();
}
function delLine(i){captureOrder();newLines.splice(i,1);render();}
function addModel(){
  captureOrder();
  const src=customModels[0]||{};
  const copy={age:src.age,color:src.color,sleeve:src.sleeve,bottom:src.bottom,qty:1};
  allMeas().forEach(x=>copy[x[0]]=src[x[0]]);
  customModels.push(copy); render();
}
function rmModel(i){captureOrder();customModels.splice(i,1);render();}
async function saveOrder(){
  captureOrder();
  const ty=window._otype||"إنتاج كمي";
  let reason=null, rnote=null, rimg=null;
  if(ty==="تصليح"){
    const sel=document.querySelector("#reasonPills .pill.on");
    reason = sel? sel.dataset.r : null;
    if(!reason) return alert(isAr()?"اختر سبب الرجوع":"Pick a reason");
    rnote=el("o_rnote").value||null;
    const f=el("o_rimg").files[0]; if(f) rimg=await uploadFile(f,"repairs");
  }
  const {data:o,error}=await sb.from("orders").insert({order_type:ty, customer_ref:(ty==="طلب"||ty==="قياسات خاصة")?(el("o_ref")?.value||null):null,
    repair_reason:reason, repair_note:rnote, repair_image:rimg, due_date:el("o_due").value||null}).select().single();
  if(error) return alert(error.message);
  let rows=[];
  if(ty==="قياسات خاصة"){
    rows=customModels.filter(m=>m.product_id).map(m=>{
      const cs={sleeve:m.sleeve,bottom:m.bottom,notes:m.notes,age:m.age};
      allMeas().forEach(x=>{if(m[x[0]]) cs[x[0]]=m[x[0]];});
      return {order_id:o.id,product_id:m.product_id,qty:m.qty||1,color:m.color||null,size:m.age||(isAr()?"خاص":"CUSTOM"),
        custom_specs:cs, external_make:!!window._oext, stage:startStageFor(m.product_id,ty,window._oext)};
    });
  }else{
    rows=newLines.filter(l=>l.product_id).map(l=>({order_id:o.id,product_id:l.product_id,size:l.size||null,color:l.color||null,qty:l.qty||1,
      external_make:!!window._oext, stage:startStageFor(l.product_id,ty,window._oext)}));
  }
  if(!rows.length){await sb.from("orders").delete().eq("id",o.id);return alert(isAr()?"أضف قطعة واحدة على الأقل":"Add at least one item");}
  const {data:ins}=await sb.from("order_lines").insert(rows).select();
  for(const l of (ins||[])){
    if(l.stage==="sew") await genParts(l.id,l,ty,"sew");
    if(l.stage==="cut") await genParts(l.id,l,ty,"cut");
  }
  newLines=[];customModels=[];window._otype="إنتاج كمي";window._oext=false;mTab="board";localStorage.setItem("vv2_tab","board");
  await refresh();
}

/* متوسط فعلي تاريخي */
function histAvg(pid, stage){
  if(!pid) return "";
  const ev=DB.events.filter(e=>e.stage===stage&&e.started_at&&e.finished_at&&DB.lines.some(l=>l.id===e.line_id&&l.product_id===pid));
  if(!ev.length) return "";
  const avg=Math.round(ev.reduce((a,e)=>a+mins(e.started_at,e.finished_at),0)/ev.length);
  return `<span class="chip sage">${isAr()?"الفعلي":"actual"} ${avg}</span>`;
}
function currentParts(){
  return [...document.querySelectorAll("#partPills .pill.on")].map(x=>({ar:x.dataset.ar,en:x.dataset.en}));
}
function captureEstParts(){
  currentParts().forEach(c=>{const i=el("ep_"+c.ar); if(i) window._estParts[c.ar]=+i.value||null;});

async function delProduct(id, force){
  const used=DB.lines.some(l=>l.product_id===id);
  if(used && !force){ await sb.from("products").update({active:false}).eq("id",id); await refresh(); return; }
  if(used){
    /* حذف كل ما يرتبط به أولاً */
    const lids=DB.lines.filter(l=>l.product_id===id).map(l=>l.id);
    for(const lid of lids){
      await sb.from("stage_events").delete().eq("line_id",lid);
      await sb.from("line_parts").delete().eq("line_id",lid);
      await sb.from("order_lines").delete().eq("id",lid);
    }
    await sb.from("photoshoots").delete().eq("product_id",id);
  }
  await sb.from("products").delete().eq("id",id);
  await refresh();
}

async function makeJob(mode){
  const ids=[...document.querySelectorAll(".poolchk:checked")].map(c=>c.value);
  if(!ids.length) return alert(isAr()?"اختر القطع أولاً":"Select items");
  const vendor=el(mode==="emb"?"j_vendor":"x_vendor").value||null;
  const kind=mode==="ext"?"تنفيذ خارجي":(product(DB.lines.find(l=>l.id===ids[0]).product_id).embroidery_kind||"تطريز");
  const {data:j}=await sb.from("ext_jobs").insert({kind,vendor,line_ids:ids}).select().single();
  for(const id of ids) await sb.from("order_lines").update({stage_status:"sent"}).eq("id",id);
  await refresh(); printJob(j.id);
}
async function receiveJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  for(const id of (j.line_ids||[])){
    const l=DB.lines.find(x=>x.id===id); if(!l) continue;
    await moveLine(id, l.stage==="ext"? "qc" : nextStage("emb",product(l.product_id)));
  }
  await sb.from("ext_jobs").update({status:"received",returned_at:today()}).eq("id",jobId);
  await refresh();
}
function printJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  const lines=(j.line_ids||[]).map(id=>DB.lines.find(l=>l.id===id)).filter(Boolean);
  const isExt=j.kind==="تنفيذ خارجي";
  const rows=lines.map(l=>{const p=product(l.product_id),o=order(l.order_id);

      <td style="text-align:center;font-size:20px;font-weight:800">${esc(l.size||"—")}</td>
      <td style="text-align:center;font-size:20px;font-weight:800">${l.qty}</td>
      <td>#${o.order_no}</td></tr>`;}).join("");
  const total=lines.reduce((a,l)=>a+l.qty,0);
  const arts=[...new Set(lines.map(l=>product(l.product_id)).filter(p=>p.artwork_url).map(p=>p.id))].map(id=>{const p=product(id);
    return `<div style="margin-top:14px;page-break-inside:avoid"><b>${esc(p.name)}:</b>${p.embroidery_note?`<div>${esc(p.embroidery_note)}</div>`:""}<img src="${esc(p.artwork_url)}" style="max-width:300px;border:1px solid #ddd;border-radius:8px;margin-top:6px"></div>`;}).join("");
  const charts=isExt? [...new Set(lines.map(l=>l.product_id))].map(pid=>{const p=product(pid);const chart=p.size_chart||{};const sizes=Object.keys(chart);
    if(!sizes.length) return "";
    return `<div style="margin-top:14px;page-break-inside:avoid"><b>${esc(p.name)} — القياسات (سم):</b>
    <table><tr><th>القياس</th>${sizes.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>
    ${MEAS.map(m=>`<tr><td>${m[1]}</td>${sizes.map(s=>`<td>${esc(chart[s]?.[m[0]]||"—")}</td>`).join("")}</tr>`).join("")}</table>
    ${(p.patterns||[]).length?`<div>الباترونات: ${(p.patterns||[]).map(x=>`<a href="${esc(x.url)}">${esc(x.name)}</a>`).join(" · ")}</div>`:""}</div>`;}).join("") : "";
  const w=window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>Job Order</title>
  <style>body{font-family:Tajawal,Arial,sans-serif;padding:28px;color:#1C1B1A}
  table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #E6E1D8;padding:8px;text-align:right}
  .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1C1B1A;padding-bottom:12px}
  .lg{font-family:Arial;font-weight:700;letter-spacing:5px;font-size:22px}</style></head><body>
  <div class="hd"><div class="lg">VEEVOGUE</div><div style="text-align:left">JOB ORDER<br><b>${esc(j.kind)}</b></div></div>
  <p>المصدر: <b>${esc(j.vendor||"—")}</b> · التاريخ: ${esc(j.sent_at)} · الإجمالي: <b>${total}</b></p>
  <table><tr><th></th><th>المنتج</th><th>العمر</th><th>الكمية</th><th>الأمر</th></tr>${rows}</table>
  ${arts}${charts}
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

async function sendFix(lineId){

  const lastSew=DB.events.filter(e=>e.line_id===lineId&&e.stage==="sew"&&e.worker_id&&e.finished_at).slice(-1)[0];
  await sb.from("order_lines").update({stage:"sew",stage_status:"waiting",claimed_by:null,fix_reason:reason,fix_image:img}).eq("id",lineId);

    <div class="note-box">${isAr()?"راح يُمسح نهائياً:":"Will be deleted:"} ${isAr()?"كل الأوامر وسطورها وسجلات العمل والبريك، كل التصاميم والكولكشنات، الإرساليات الخارجية، طلبات التصوير.":"..."}</div>
    <div class="note-box" style="background:var(--green-lt);color:var(--green-dk)">${isAr()?"يبقى كما هو:":"Kept:"} ${isAr()?"العمال · المنتجات · الخامات · أسباب التصليح · الإعدادات":"..."}</div>
    <label>${isAr()?"اكتب كلمة «مسح» للتأكيد":"Type DELETE"}</label><input id="wipe_ok" autocomplete="off">
    <button class="btn btn-line btn-big" onclick="downloadBackup()">${I.file} ${isAr()?"نزّل نسخة احتياطية أولاً":"Backup first"}</button>
    <button class="btn btn-bad btn-big" onclick="doWipe()">${isAr()?"تأكيد المسح":"Confirm"}</button>`);

async function doWipe(){
  const v=el("wipe_ok").value.trim();
  if(v!=="مسح" && v.toUpperCase()!=="DELETE") return alert(isAr()?"اكتب «مسح» للتأكيد":"Type DELETE");
  const all="00000000-0000-0000-0000-000000000000";
  await sb.from("stage_events").delete().neq("id",all);
  await sb.from("line_parts").delete().neq("id",all);
  await sb.from("order_lines").delete().neq("id",all);
  await sb.from("orders").delete().neq("id",all);
  await sb.from("ext_jobs").delete().neq("id",all);
  await sb.from("photoshoots").delete().neq("id",all);
  await sb.from("design_projects").delete().neq("id",all);
  await sb.from("collections").delete().neq("id",all);
  await sb.from("breaks").delete().neq("id",all);
  closeSheet(); await refresh();
  alert(isAr()?"انمسحت ✓ النظام جاهز للتشغيل الفعلي":"Done");
}
async function saveMaterial(){
  const name=el("m_name").value.trim(); if(!name) return alert(isAr()?"اكتب اسم الخام":"Name?");
  const {error}=await sb.from("materials").insert({sku:el("m_sku").value||null, name, color:el("m_color").value||null,
    unit:el("m_unit").value, supplier:el("m_sup").value||null, price:parseFloat(el("m_price").value)||null});
  if(error) return alert(error.message);
  await reloadWorkers();
}
async function delMaterial(id){
  const used=DB.products.some(p=>(p.bom||[]).some(b=>b.material_id===id));
  if(used){ if(confirm(isAr()?"الخام مستخدم في منتجات — أرشفته؟":"In use — archive?")){await sb.from("materials").update({active:false}).eq("id",id); await reloadWorkers();} return;}
  if(confirm(isAr()?"حذف؟":"Delete?")){await sb.from("materials").delete().eq("id",id); await reloadWorkers();}
}
async function saveWorker(){
  const name=el("w_name").value.trim(); if(!name) return alert(isAr()?"اكتب الاسم":"Enter name");
  const specs=[...document.querySelectorAll("#specPills .pill.on")].map(x=>x.dataset.k);

  await sb.from("workers").insert({name, name_en:el("w_name_en").value||null, specialties:specs, pin:el("w_pin").value||null});

}

/* ---- الأداء ---- */
function tabPerf(){
  const done=DB.events.filter(e=>e.started_at&&e.finished_at&&e.worker_id);
  if(!done.length){el("tabbody").innerHTML=`<div class="empty">—</div>`; return;}
  /* تجميع: عامل ← مراحل */
  const byWorker={};
  done.forEach(e=>{
    const wid=e.worker_id;
    byWorker[wid]=byWorker[wid]||{stages:{}, fixes:0, brk:0};
    const st=byWorker[wid].stages[e.stage]=byWorker[wid].stages[e.stage]||{n:0,total:0,est:0,estN:0};
    st.n++; st.total+=workedMins(e.started_at,e.finished_at);
    const l=DB.lines.find(x=>x.id===e.line_id);
    if(l){const p=product(l.product_id);
      const pt=e.part_id? DB.parts.find(x=>x.id===e.part_id):null;
      const est=e.stage==="cut"?p.est_cut_min: e.stage==="sew"?((pt&&(p.est_parts||{})[pt.part_ar])||p.est_sew_min): null;
      if(est){st.est+=est*l.qty; st.estN++;}}
  });
  DB.events.filter(e=>e.result==="fix").forEach(e=>{
    const sews=DB.events.filter(x=>x.line_id===e.line_id&&x.stage==="sew"&&x.finished_at&&x.worker_id);
    if(sews.length){const wid=sews[sews.length-1].worker_id; if(byWorker[wid]) byWorker[wid].fixes++;}
  });
  DB.breaks.filter(b=>b.ended_at).forEach(b=>{ if(byWorker[b.worker_id]) byWorker[b.worker_id].brk+=mins(b.started_at,b.ended_at); });

  el("tabbody").innerHTML = Object.entries(byWorker).map(([wid,d])=>{
    const rows=Object.entries(d.stages).map(([stg,s])=>{
      const avg=Math.round(s.total/s.n);
      const est=s.estN? Math.round(s.est/s.estN) : null;
      const ratio=est? avg/est : null;
      return {stg,n:s.n,avg,est,ratio};
    });
    const rated=rows.filter(r=>r.ratio!==null);
    const bestStg = rated.length? rated.reduce((a,b)=>a.ratio<=b.ratio?a:b).stg : null;
    return `<div class="wperf">
      <h4>${I.user} ${esc(wname(worker(wid)))}</h4>
      <table>
        <tr><th>${isAr()?"العمل":"Task"}</th><th>${isAr()?"عدد":"#"}</th><th>${isAr()?"متوسط فعلي":"Actual"}</th><th>${isAr()?"تقديري":"Est."}</th><th></th></tr>
        ${rows.map(r=>`<tr>
          <td>${t(STAGE_KEY[r.stg]||r.stg)}</td>
          <td>${r.n}</td>
          <td><b>${r.avg}</b> ${t("minutes")}</td>
          <td>${r.est? r.est+" "+t("minutes") : "—"}</td>
          <td>${r.stg===bestStg?`<span class="best">${isAr()?"أفضل مهارة":"BEST"}</span>`:""}</td>
        </tr>`).join("")}
      </table>
      <div class="pillrow" style="margin-top:10px">
        ${d.fixes?`<span class="chip wine">${I.fix} ${d.fixes} ${isAr()?"مرتجع":"rework"}</span>`:""}
        ${d.brk?`<span class="chip">${I.coffee} ${d.brk} ${t("minutes")}</span>`:""}
      </div>
    </div>`;
  }).join("") + `<p class="muted" style="text-align:center">${isAr()?"«أفضل مهارة» تُحسب بمقارنة الوقت الفعلي بالتقديري — تحتاج أوقات تقديرية في بطاقة المنتج":"Best skill = actual vs estimated"}</p>`;
}

function renderWorker(){
  const w=worker(session.workerId);
  const specs=w.specialties||[];
  const onBreak=!!myBreak();
  let html=`${breakBar()}
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn btn-ghost" onclick="refresh()">↻ ${t("refresh")}</button>
      ${!onBreak?`<button class="btn btn-line" onclick="startBreak()">${I.coffee} ${t("breakStart")}</button>`:""}
    </div>`;
  if(onBreak){ el("app").innerHTML=html; return; }
  /* تنبيهات */
  const myNew=[], myLate=[];
  DB.lines.filter(l=>activeLine(l)).forEach(l=>{
    const o=order(l.order_id);
    const mine = (l.stage==="cut"&&specs.includes("cut")) || (l.stage==="pack"&&specs.includes("pack"));
    if(mine && !l.claimed_by) myNew.push(l);
    if(l.claimed_by===w.id && l.stage_status==="working"){
      const ev=DB.events.find(e=>e.line_id===l.id&&!e.part_id&&e.started_at&&!e.finished_at);
      const p=product(l.product_id);
      const est=l.stage==="cut"?p.est_cut_min:null;
      if(ev && est && workedMins(ev.started_at) > est*(l.qty||1)) myLate.push(l);
    }
    if(o.due_date && o.due_date<today()) { if(mine||(l.stage==="sew"&&specs.includes("sew"))) myLate.push(l); }
  });
  if(specs.includes("sew")){
    DB.parts.filter(pt=>pt.status==="waiting"&&!pt.worker_id).forEach(pt=>{
      const l=DB.lines.find(x=>x.id===pt.line_id); if(l&&activeLine(l)&&l.stage==="sew") myNew.push(pt);
    });
  }
  if(specs.includes("sample")) DB.designs.filter(d=>d.stage==="sample"&&d.sample_worker_id===w.id&&!d.sample_started_at).forEach(d=>myNew.push(d));
  if(myNew.length||myLate.length){
    html+=`<div class="banner" style="${myLate.length?'':'background:var(--green-lt);color:var(--green-dk);border-color:#DCE5DA'}">
      <div>${myNew.length?`${I.plus} <b>${myNew.length}</b> ${isAr()?"مهمة جديدة":"new tasks"}`:""}
      ${myLate.length?` ${myNew.length?"·":""} ${I.clock} <b>${myLate.length}</b> ${isAr()?"متأخرة":"late"}`:""}</div></div>`;
  }
  /* تبويبات من فوق حسب تخصصاته */
  const secs=[];
  if(specs.includes("cut")) secs.push(["cut", cutTasks(w)]);
  if(specs.includes("sew")) secs.push(["sew", sewTasks(w)]);
  if(specs.includes("pack")) secs.push(["pack", packTasks(w)]);
  if(specs.includes("sample")) secs.push(["sample", sampleTasks(w)]);
  if(!secs.length){ el("app").innerHTML=html+`<div class="empty">${t("noTasks")}</div>`; return; }
  let cur=window._wTab; if(!secs.some(s=>s[0]===cur)) cur=secs[0][0];
  window._wTab=cur;
  html+=`<div class="tabs">${secs.map(([k,cards])=>`<button class="${cur===k?'on':''}" onclick="window._wTab='${k}';render()">
      ${I[k]} ${t(k)} ${cards.filter(c=>!c.working).length?`<span class="badge">${cards.filter(c=>!c.working).length}</span>`:""}</button>`).join("")}</div>`;
  const cards=(secs.find(s=>s[0]===cur)||[null,[]])[1];
  const go=cards.filter(c=>c.working), wait=cards.filter(c=>!c.working);
  html+= go.length? `<div class="sechead">${I.clock} ${isAr()?"شغال عليه الحين":"IN PROGRESS"} (${go.length})</div>`+go.map(c=>c.html).join("") : "";
  if(go.length && wait.length) html+=`<hr class="sep">`;
  html+= wait.length? `<div class="sechead">${I.play} ${isAr()?"بانتظار البدء":"NOT STARTED"} (${wait.length})</div>`+wait.map(c=>c.html).join("")
       : (go.length? "" : `<div class="empty">${t("noTasks")} 👌</div>`);
  el("app").innerHTML=html;
}
function sampleTasks(w){
  return DB.designs.filter(d=>d.stage==="sample" && d.sample_worker_id===w.id).map(d=>{
    const running=d.sample_started_at&&!d.sample_finished_at;
    const m=running? mins(d.sample_started_at,new Date().toISOString()):0;
    const imgs=[...(d.sketches||[])];  /* السكيتشات والأمثلة فقط — بدون المود بورد */
    const rev=(d.revisions||[]).length;
    const chart=d.size_chart||{}; const sizes=Object.keys(chart);
    return {working:!!running, html:`<div class="wcard">
      <div class="wtop">
        ${imgs[0]?`<img class="thumb" src="${esc(imgs[0])}" onclick="viewImg('${esc(imgs[0])}')" style="cursor:zoom-in">`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#c8c2b8">${I.design}</div>`}
        <div style="flex:1"><div class="title">${esc(d.final_name||d.name)}
          ${rev?`<span class="chip wine">${I.fix} ${isAr()?"تعديل":"REV"} ${rev}</span>`:""}</div>
        <div class="muted">${esc(collection_(d.collection_id).name||"")}</div></div>
      </div>
      ${imgs.length>1?`<div class="imgrow">${imgs.slice(1,5).map(u=>`<img class="thumb" src="${esc(u)}" onclick="viewImg('${esc(u)}')">`).join("")}</div>`:""}
      ${d.materials?`<div class="note-box"><b>${isAr()?"الخامات":"MATERIALS"}:</b> ${esc(d.materials)}</div>`:""}
      ${sizes.length?`<div class="note-box"><b>${t("sizeChart")}</b>
        <div style="overflow-x:auto"><table><tr><th>—</th>${sizes.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>
        ${MEAS.filter(mm=>sizes.some(s=>chart[s]?.[mm[0]])).map(mm=>`<tr><td>${isAr()?mm[1]:mm[2]}</td>${sizes.map(s=>`<td>${esc(chart[s]?.[mm[0]]||"—")}</td>`).join("")}</tr>`).join("")}</table></div></div>`:""}
      ${(d.sample_notes||[]).length?`<div class="note-box" style="background:var(--wine-lt);color:var(--wine-dk)">
        <b>${I.fix} ${isAr()?"مطلوب تعديل":"FIX LIST"}</b>
        ${(d.sample_notes||[]).map((n,i)=>`<div style="margin-top:6px">${i+1}. ${esc(n.t)}
          ${n.img?`<div><img class="thumb" src="${esc(n.img)}" onclick="viewImg('${esc(n.img)}')"></div>`:""}</div>`).join("")}</div>`:""}
      ${running?`<div class="timer t-ok">⏱ ${m} ${t("minutes")}</div>`:""}
      ${running? `<button class="btn btn-ok btn-big" onclick="sampleDone('${d.id}')">${I.done} ${t("done")}</button>`
               : `<button class="btn btn-ink btn-big" onclick="sampleStart('${d.id}')">${I.play} ${t("start")}</button>`}
    </div>`};
  });
}
async function sampleStart(id){
  if(myBreak()) return alert(t("onBreak"));
  await sb.from("design_projects").update({sample_started_at:new Date().toISOString()}).eq("id",id);
  await refresh();
}
async function sampleDone(id){
  await sb.from("design_projects").update({sample_finished_at:new Date().toISOString(), stage:"notes"}).eq("id",id);
  await refresh();
}
function cutTasks(w){
  const out=[];
  DB.lines.filter(l=>l.stage==="cut" && activeLine(l)).forEach(l=>{
    const parts=DB.parts.filter(p=>p.line_id===l.id && p.stage==="cut" && p.status!=="done" && (!p.worker_id||p.worker_id===w.id));
    if(parts.length) parts.forEach(p=>out.push(workerCard(l,"cut",p)));
    else if(!DB.parts.some(p=>p.line_id===l.id&&p.stage==="cut") && (!l.claimed_by||l.claimed_by===w.id)) out.push(workerCard(l,"cut",null));
  });
  return out;
}
function sewTasks(w){
  const out=[];
  DB.lines.filter(l=>l.stage==="sew" && activeLine(l)).forEach(l=>{
    DB.parts.filter(p=>p.line_id===l.id && (p.stage||"sew")==="sew" && p.status!=="done" && (!p.worker_id||p.worker_id===w.id)).forEach(p=>out.push(workerCard(l,"sew",p)));
  });
  return out;
}
function packTasks(w){
  return DB.lines.filter(l=>l.stage==="pack" && activeLine(l) && (!l.claimed_by||l.claimed_by===w.id)).map(l=>workerCard(l,"pack",null));
}
function specsTable(cs){
  if(!cs) return "";
  const rows=MEAS.filter(m=>cs[m[0]]).map(m=>`<tr><td>${isAr()?m[1]:m[2]}</td><td><b>${esc(cs[m[0]])}</b></td></tr>`).join("");
  const extra=[cs.sleeve?`${isAr()?"الكم":"Sleeve"}: <b>${esc(cs.sleeve)}</b>`:"",cs.bottom?`${esc(cs.bottom)}`:""].filter(Boolean).join(" — ");
  return `<div class="note-box"><b>${I.ruler}</b><table>${rows}</table>${extra?`<div>${extra}</div>`:""}${cs.notes?`<div>📝 ${esc(cs.notes)}</div>`:""}</div>`;
}
function workerCard(l, mode, part){
  const p=product(l.product_id), o=order(l.order_id);
  const working = part? part.status==="working" : (l.stage_status==="working" && l.claimed_by===session.workerId);
  const ev = DB.events.find(e=> (part? e.part_id===part.id : (e.line_id===l.id&&!e.part_id)) && e.stage===l.stage && e.started_at && !e.finished_at);
  const m = ev? workedMins(ev.started_at) : 0;
  const estTotal = (mode==="cut"||mode==="sew")? estFor(p, mode, part?part.part_ar:null, l.qty) : null;
  const over = estTotal? m > estTotal : m > 480;
  const meta = `<div class="wmeta">
      ${mode==="cut"?`<div><div class="bignum">${esc(l.size||"—")}</div><div class="biglabel">${t("age")}</div></div>`:""}
      <div><div class="bignum">${l.qty}</div><div class="biglabel">${t("qty")}</div></div>
      ${mode!=="cut"&&l.size?`<div><div class="bignum" style="font-size:22px">${esc(l.size)}</div><div class="biglabel">${t("age")}</div></div>`:""}
      ${o.due_date?`<div><div class="bignum" style="font-size:22px;${isLate(o)?'color:var(--bad)':''}">${fmtD(o.due_date)}</div><div class="biglabel">${t("due")}</div></div>`:""}
      ${l.color?`<div><div class="bignum" style="font-size:18px">${esc(l.color)}</div><div class="biglabel">${t("color")}</div></div>`:""}
    </div>`;
  return {working, html:`<div class="wcard">
    <div class="wtop">${thumb(p)}
      <div style="flex:1">
        <div class="title">${esc(pname(p))} ${part?`<span class="chip">${I[mode]||I.sew} ${esc(isAr()?part.part_ar:part.part_en)}</span>`:""}</div>
        <div class="muted">#${o.order_no} ${o.order_type==="تصليح"?"· "+I.fix:""}</div>
        ${mode==="cut"?`<button class="btn btn-ghost" style="padding:6px 12px;font-size:13px;margin-top:4px" onclick="showChart('${p.id}','${esc(l.size||"")}')">${I.ruler} ${t("sizeChart")}</button>`:""}
      </div>
    </div>
    ${meta}
    ${mode==="pack"&&l.prep_note?`<div class="note-box">${l.prep_note==="clean"?I.clean+" "+t("clean"):I.iron+" "+t("iron")}</div>`:""}
    ${mode==="pack"? setStatusBox(l) : ""}
    ${specsTable(l.custom_specs)}
    ${l.fix_reason?`<div class="note-box" style="background:var(--wine-lt);color:var(--wine-dk)">${I.fix} <b>${esc(l.fix_reason)}</b>
      ${l.fix_image?`<div><img class="thumb" src="${esc(l.fix_image)}" onclick="window.open('${esc(l.fix_image)}')"></div>`:""}</div>`:""}
    ${o.repair_reason?`<div class="note-box">${I.fix} <b>${esc(o.repair_reason)}</b>
      ${o.repair_note?`<div>${esc(o.repair_note)}</div>`:""}
      ${o.repair_image?`<div><img class="thumb" src="${esc(o.repair_image)}" onclick="window.open('${esc(o.repair_image)}')"></div>`:""}</div>`:""}
    ${ev?`<div class="timer ${over?'t-late':'t-ok'}">⏱ ${m} ${t("minutes")}</div>`:""}
    ${mode==="pack"&&!setReady(l)? `<button class="btn btn-ghost btn-big" disabled style="opacity:.55">${isAr()?"ناقص قطع الطقم":"Waiting for set pieces"}</button>`
     : working? `<button class="btn btn-ok btn-big" onclick="wDone('${l.id}','${part?part.id:""}')">${I.done} ${t("done")}</button>`
              + (m<5? `<button class="btn btn-warn btn-big" onclick="undoStart('${l.id}','${part?part.id:""}')">↩ ${isAr()?"تراجع — بديت بالغلط":"Undo"}</button>`:"")
             : `<button class="btn btn-ink btn-big" onclick="wStart('${l.id}','${part?part.id:""}')">${I.play} ${t("start")}</button>`}
  </div>`};
}
/* تجميع الطقم: كل سطور نفس الأمر لنفس المنتج والمقاس لازم توصل التجهيز */
function setSiblings(l){
  return DB.lines.filter(x=>x.order_id===l.order_id && x.product_id===l.product_id && (x.size||"")===(l.size||""));
}
function setReady(l){
  const sibs=setSiblings(l);
  return sibs.every(x=>x.stage==="pack"||x.stage==="shipped");
}
function setStatusBox(l){
  const sibs=setSiblings(l);
  if(sibs.length<2) return "";
  const missing=sibs.filter(x=>x.stage!=="pack"&&x.stage!=="shipped");
  return missing.length
    ? `<div class="note-box" style="background:var(--wine-lt);color:var(--wine-dk)">${I.pack} ${isAr()?"ناقص":"Missing"}: ${missing.map(x=>`${esc(pname(product(x.product_id)))} (${t(STAGE_KEY[x.stage]||x.stage)})`).join(" · ")}</div>`
    : `<div class="note-box" style="background:var(--green-lt);color:var(--green-dk)">${I.done} ${isAr()?"كل قطع الطقم جاهزة":"Set complete"}</div>`;
}
async function wStart(lineId, partId){
  if(myBreak()) return alert(t("onBreak"));
  const l=DB.lines.find(x=>x.id===lineId);
  if(partId){
    const pt=DB.parts.find(x=>x.id===partId);
    await sb.from("line_parts").update({status:"working",worker_id:session.workerId,started_at:new Date().toISOString()}).eq("id",partId);
    await sb.from("stage_events").insert({line_id:lineId,part_id:partId,stage:(pt&&pt.stage)||"sew",worker_id:session.workerId,started_at:new Date().toISOString()});
  }else{
    await sb.from("order_lines").update({stage_status:"working",claimed_by:session.workerId}).eq("id",lineId);
    await sb.from("stage_events").insert({line_id:lineId,stage:l.stage,worker_id:session.workerId,started_at:new Date().toISOString()});
  }
  await refresh();
}
async function undoStart(lineId, partId){
  const ev=DB.events.find(e=> (partId? e.part_id===partId : (e.line_id===lineId&&!e.part_id)) && e.started_at && !e.finished_at);
  if(ev && mins(ev.started_at,new Date().toISOString())>=5 && session.role==="worker")
    return alert(isAr()?"فات وقت التراجع — كلّم المدير":"Undo window passed");
  if(ev) await sb.from("stage_events").delete().eq("id",ev.id);
  if(partId) await sb.from("line_parts").update({status:"waiting",worker_id:null,started_at:null}).eq("id",partId);
  else await sb.from("order_lines").update({stage_status:"waiting",claimed_by:null}).eq("id",lineId);
  await refresh();
}
async function wDone(lineId, partId){
  const l=DB.lines.find(x=>x.id===lineId); const p=product(l.product_id);
  const now=new Date().toISOString();
  if(partId){
    const pt=DB.parts.find(x=>x.id===partId); const pstage=(pt&&pt.stage)||"sew";
    await sb.from("line_parts").update({status:"done",finished_at:now}).eq("id",partId);
    const ev=DB.events.find(e=>e.part_id===partId&&e.started_at&&!e.finished_at);
    if(ev) await sb.from("stage_events").update({finished_at:now}).eq("id",ev.id);
    const remaining=DB.parts.filter(x=>x.line_id===lineId&&x.id!==partId&&(x.stage||"sew")===pstage&&x.status!=="done");
    if(!remaining.length) await moveLine(lineId, nextStage(pstage,p));
  }else{
    const ev=DB.events.find(e=>e.line_id===lineId&&!e.part_id&&e.stage===l.stage&&e.started_at&&!e.finished_at);
    if(ev) await sb.from("stage_events").update({finished_at:now}).eq("id",ev.id);
    if(l.stage==="pack" && l.prep_note){
      await sb.from("order_lines").update({stage:"qc",stage_status:"waiting",claimed_by:null,prep_note:null}).eq("id",lineId);
    } else {
      await moveLine(lineId, nextStage(l.stage,p));
    }
  }
  await refresh();
}
</script>
