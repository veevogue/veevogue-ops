  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}

  .chip svg{width:13px;height:13px;}
  .chip.working{background:var(--green);color:#fff;}
  .chip.wine{background:var(--wine-lt);color:var(--wine-dk);}
  .chip.sage{background:var(--green-lt);color:var(--green-dk);}
  .late{color:var(--bad);font-weight:900;}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:#4a4a4a;}

  .timer{font-family:'Inter';font-size:13px;font-weight:700;}
  .t-ok{color:var(--green);} .t-late{color:var(--wine);}

  .keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:280px;margin:8px auto;}

function el(id){return document.getElementById(id);}
function product(id){return DB.products.find(p=>p.id===id)||{name:"؟",images:[]};}
function order(id){return DB.orders.find(o=>o.id===id)||{};}
function worker(id){return DB.workers.find(w=>w.id===id)||{name:"؟",name_en:"?"};}
function wname(w){return isAr()? (w.name||w.name_en||"") : (w.name_en||w.name||"");}
function pname(p){return isAr()? (p.name||p.name_en||"") : (p.name_en||p.name||"");}
function esc(s){return (s??"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function fmtD(d){if(!d)return"";const x=new Date(d);return x.getDate()+"/"+(x.getMonth()+1);}
function isLate(o){return o.due_date && o.status==="جاري" && o.due_date < today();}
function mins(a,b){return Math.round((new Date(b)-new Date(a))/60000);}
function pimg(p){return (p.images&&p.images[0])||null;}
function thumb(p,cls){const u=pimg(p);return u?`<img class="${cls||'thumb'}" src="${esc(u)}">`:`<div class="${cls||'thumb'}" style="display:flex;align-items:center;justify-content:center;color:#c8c2b8">${I.design}</div>`;}
function logout(){session=null;localStorage.removeItem("vv2_session");stopAuto();applyDir();render();}
function setSession(s){s.day=today();session=s;localStorage.setItem("vv2_session",JSON.stringify(s));applyDir();render();}
async function uploadFile(file, folder){
  const ext=file.name.split(".").pop();
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from("files").upload(path,file);
  if(error){alert("فشل الرفع: "+error.message);return null;}
  return sb.storage.from("files").getPublicUrl(path).data.publicUrl;
}
function activeLine(l){return order(l.order_id).status==="جاري";}

/* مسار المراحل */
function startStageFor(pid, orderType){
  const p=product(pid);
  if(orderType==="تصليح") return "sew";
  if(p.external_make) return "ext";
  if(p.embroidery==="external_piece") return "emb";
  return "cut";
}
function nextStage(stage, p){
  if(stage==="cut") return p.embroidery==="after_cut" ? "emb" : "sew";
  if(stage==="emb") return p.embroidery==="after_cut" ? "sew" : "qc";
  if(stage==="sew") return p.embroidery==="after_sew" ? "emb" : "qc";
  if(stage==="pack") return "shipped";
  if(stage==="ext") return "qc";
  return stage;
}
async function moveLine(lineId, stage){
  await sb.from("order_lines").update({stage, stage_status:"waiting", claimed_by:null}).eq("id",lineId);
  if(stage==="sew") await genParts(lineId);
}
async function genParts(lineId, lineOpt, otype){
  const l=lineOpt||DB.lines.find(x=>x.id===lineId); if(!l) return;
  const o=order(l.order_id); const p=product(l.product_id);
  const ty=otype||o.order_type;
  let comps=(ty==="تصليح")? [{ar:"تصليح",en:"REPAIR"}] : (p.components&&p.components.length? p.components : [{ar:"القطعة",en:"PIECE"}]);
  await sb.from("line_parts").insert(comps.map(c=>({line_id:l.id, part_ar:c.ar, part_en:c.en})));
}

/* ================= البريك ================= */
function myBreak(){
  if(!session||session.role!=="worker") return null;
  return DB.breaks.find(b=>b.worker_id===session.workerId && !b.ended_at);
}
async function startBreak(){
  await sb.from("breaks").insert({worker_id:session.workerId});
  await refresh();
}
async function endBreak(){
  const b=myBreak(); if(!b) return;
  await sb.from("breaks").update({ended_at:new Date().toISOString()}).eq("id",b.id);
  await refresh();
}
function breakBar(){
  const b=myBreak(); if(!b) return "";
  const m=mins(b.started_at,new Date().toISOString());
  const lim=DB.settings.break_minutes||30;
  const over=m>lim;
  return `<div class="breakbar ${over?'over':''}">
    <div>${I.coffee} ${over? t("breakOver") : t("onBreak")} — <b>${m}</b>/${lim} ${t("minutes")}</div>
    <button class="btn btn-ink" onclick="endBreak()">${t("breakEnd")}</button>
  </div>`;
}

/* ================= التحديث التلقائي ================= */
function startAuto(){ stopAuto(); autoTimer=setInterval(()=>{ if(!document.getElementById("ov")) refresh(); }, 30000); }
function stopAuto(){ if(autoTimer){clearInterval(autoTimer); autoTimer=null;} }

/* ================= العرض ================= */
function render(){
  const lb=el("logoutBtn");
  lb.style.display = session? "inline-block":"none";
  lb.textContent = t("logout");
  el("whoami").textContent = session? (session.role==="manager"?t("manager"): session.role==="creative"?t("creative"): wname(worker(session.workerId))) : "";
  if(!session){ stopAuto(); return renderLogin(); }
  if(session.role==="worker"||session.role==="creative") startAuto(); else stopAuto();
  if(session.role==="manager"||session.role==="creative") return renderDesk();
  return renderWorker();
}

/* ================= الدخول ================= */
function renderLogin(){
  const ws=DB.workers.filter(w=>w.active);
  el("app").innerHTML=`<div class="login-card card">
    <div class="title" style="font-size:20px">${t("whoAreYou")}</div>
    <button class="btn btn-ink btn-big" onclick="loginManager()">${I.user} ${t("manager")}</button>
    <button class="btn btn-line btn-big" onclick="loginCreative()">${I.design} ${t("creative")}</button>
    <div class="muted" style="margin-top:16px">${t("workers")}</div>
    ${ws.map(w=>`<button class="btn btn-ghost btn-big" onclick="loginWorker('${w.id}')">${I.user} ${esc(wname(w))}</button>`).join("") || `<p class="muted">${t("noWorkers")}</p>`}
  </div>`;
}
function loginManager(){pinPad(t("manager"), MANAGER_PIN, ()=>setSession({role:"manager"}));}
function loginCreative(){pinPad(t("creative"), DB.settings.creative_pin||"4826", ()=>setSession({role:"creative"}));}
function loginWorker(id){
  const w=worker(id);
  if(!w.pin) return setSession({role:"worker",workerId:id});
  pinPad(wname(w), w.pin, ()=>setSession({role:"worker",workerId:id}));
}
let _pinBuf="";
function pinPad(title, correct, onOk){
  _pinBuf="";
  openSheet(`<div style="text-align:center">
    <div class="title">${esc(title)}</div>
    <div id="pinDots" style="font-size:30px;letter-spacing:10px;height:42px;font-family:'Inter'">····</div>
    <div id="pinErr" class="muted" style="color:var(--bad);height:18px"></div>
    <div class="keypad" dir="ltr">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn btn-ghost" onclick="pinKey('${n}')">${n}</button>`).join("")}
      <button class="btn btn-ghost" onclick="pinKey('del')">⌫</button>
      <button class="btn btn-ghost" onclick="pinKey('0')">0</button>
      <button class="btn btn-ink" onclick="pinKey('ok')">✓</button>
    </div></div>`);
  window._pinCorrect=correct; window._pinOk=onOk;
}
function pinKey(k){
  if(k==="del") _pinBuf=_pinBuf.slice(0,-1);
  else if(k==="ok"){
    if(_pinBuf===String(window._pinCorrect)){closeSheet(); window._pinOk();}
    else{el("pinErr").textContent=t("wrongPin"); _pinBuf="";}
  }
  else if(_pinBuf.length<8) _pinBuf+=k;
  const d=el("pinDots"); if(d) d.textContent = _pinBuf.replace(/./g,"●").padEnd(4,"·");
}

/* ================= أوراق منبثقة ================= */
function openSheet(html){
  const ov=document.createElement("div"); ov.className="overlay"; ov.id="ov";
  ov.innerHTML=`<div class="sheet">${html}<button class="btn btn-ghost btn-big" onclick="closeSheet()">${t("close")}</button></div>`;
  ov.addEventListener("click",e=>{if(e.target===ov)closeSheet();});
  document.body.appendChild(ov);
}
function closeSheet(){const o=el("ov"); if(o)o.remove();}

const TABS_MANAGER=["board","newOrder","products","design","external","shoots","quality","workersTab","perf","settings","archive"];
const TABS_CREATIVE=["board","design","products","quality"];
function myTabs(){return session.role==="manager"? TABS_MANAGER : TABS_CREATIVE;}
function renderDesk(){
  const tabs=myTabs();
  if(!tabs.includes(mTab)) mTab=tabs[0];
  el("app").innerHTML=`
    <div class="tabs">${tabs.map(k=>`<button class="${mTab===k?'on':''}" onclick="mTab='${k}';localStorage.setItem('vv2_tab','${k}');render()">${t(k)}</button>`).join("")}</div>
    <div id="tabbody"></div>`;
  ({board:tabBoard,newOrder:tabNewOrder,products:tabProducts,design:tabDesign,external:tabExternal,
    shoots:tabShoots,quality:tabQuality,workersTab:tabWorkers,perf:tabPerf,settings:tabSettings,archive:tabArchive})[mTab]();
}

/* ---- لوحة ---- */
function stageStats(){
  const act=DB.lines.filter(l=>activeLine(l));
  const box=(key,icon,all,go,wait,alt)=>`<div class="stat">${icon}
      <div class="nums">${alt? `<span class="n-go">${go}</span><span class="n-wait">${wait}</span>`
        : `<span class="n-all">${all}</span><span class="n-go">${go}</span><span class="n-wait">${wait}</span>`}</div>
      <div class="cap">${t(key)}</div></div>`;
  const cnt=(st)=>{
    const ls=act.filter(l=>l.stage===st);
    if(st==="sew"){
      let go=0,wait=0,all=0;
      ls.forEach(l=>{const ps=DB.parts.filter(p=>p.line_id===l.id);
        all+=ps.length||1; go+=ps.filter(p=>p.status==="working").length; wait+=ps.filter(p=>p.status==="waiting").length;});
      return {all,go,wait};
    }
    return {all:ls.length, go:ls.filter(l=>l.stage_status==="working").length, wait:ls.filter(l=>l.stage_status!=="working").length};
  };
  const c=cnt("cut"), e=cnt("emb"), s=cnt("sew");
  const qcN=act.filter(l=>l.stage==="qc").length;
  const packN=act.filter(l=>l.stage==="pack").length;
  const extSent=act.filter(l=>(l.stage==="ext"||l.stage==="emb")&&l.stage_status==="sent").length;
  const extRec=DB.jobs.filter(j=>j.status==="received").reduce((a,j)=>a+(j.line_ids||[]).length,0);
  return `<div class="statrow">
    ${box("cut",I.cut,c.all,c.go,c.wait)}
    ${box("emb",I.emb,e.all,e.go,e.wait)}
    ${box("sew",I.sew,s.all,s.go,s.wait)}
    <div class="stat">${I.qc}<div class="nums"><span class="n-all">${qcN}</span></div><div class="cap">${t("qc")}</div></div>
    <div class="stat">${I.pack}<div class="nums"><span class="n-all">${packN}</span></div><div class="cap">${t("pack")}</div></div>
    <div class="stat">${I.ext}<div class="nums"><span class="n-go">${extSent}</span><span class="n-all">${extRec}</span></div><div class="cap">${t("sent")} / ${t("received")}</div></div>
  </div>`;
}
function tabBoard(){
  const act=DB.lines.filter(l=>activeLine(l));
  const workingNow=[];
  act.forEach(l=>{
    if(l.stage_status==="working"&&l.claimed_by) workingNow.push({w:worker(l.claimed_by),l,stage:l.stage,ev:DB.events.find(e=>e.line_id===l.id&&!e.part_id&&e.started_at&&!e.finished_at)});
    DB.parts.filter(p=>p.line_id===l.id&&p.status==="working").forEach(p=>workingNow.push({w:worker(p.worker_id),l,stage:"sew",part:p,ev:DB.events.find(e=>e.part_id===p.id&&e.started_at&&!e.finished_at)}));
  });
  const embPool=act.filter(l=>l.stage==="emb"&&l.stage_status!=="sent").length;
  const extPool=act.filter(l=>l.stage==="ext"&&l.stage_status!=="sent").length;
  const activeOrders=DB.orders.filter(o=>o.status==="جاري");
  const onBreakNow=DB.breaks.filter(b=>!b.ended_at);
  el("tabbody").innerHTML=`
    ${stageStats()}
    ${(embPool||extPool)&&session.role==="manager"?`<div class="banner">
      <div>${embPool?`${I.emb} <b>${embPool}</b> ${isAr()?"قطعة للتطريز/الطباعة":"pcs for embroidery"}`:""} ${extPool?` · ${I.ext} <b>${extPool}</b> ${isAr()?"للتنفيذ الخارجي":"for external"}`:""}</div>
      <button class="btn" onclick="mTab='external';render()">${t("open")} ←</button></div>`:""}
    ${onBreakNow.length?`<div class="breakbar">${I.coffee} ${onBreakNow.map(b=>`${esc(wname(worker(b.worker_id)))} (${mins(b.started_at,new Date().toISOString())}${t("minutes")})`).join(" · ")}</div>`:""}
    <div class="card"><div class="title">${I.clock} ${t("workingNow")}</div>
      ${workingNow.length? workingNow.map(x=>{
        const m=x.ev? mins(x.ev.started_at,new Date().toISOString()):0;
        const p=product(x.l.product_id);
        const est=(x.stage==="cut"?p.est_cut_min:x.stage==="sew"?p.est_sew_min:null);
        const over=est? m>est*(x.l.qty||1) : m>480;
        return `<div class="lineitem"><div><b>${esc(wname(x.w))}</b> — ${t(STAGE_KEY[x.stage]||x.stage)}${x.part?` (${esc(isAr()?x.part.part_ar:x.part.part_en)})`:""} — ${esc(pname(p))} <span class="muted">#${order(x.l.order_id).order_no}</span></div>
        <div class="timer ${over?'t-late':'t-ok'}">${m} ${t("minutes")}</div></div>`;}).join("")
      : `<div class="muted">${t("noOneWorking")}</div>`}
    </div>
    ${activeOrders.length? activeOrders.map(orderCard).join("") : `<div class="empty">${t("noOrders")}</div>`}`;
}
function lineChip(l){
  const w=l.claimed_by?worker(l.claimed_by):null;
  const partsInfo=l.stage==="sew"? (()=>{const ps=DB.parts.filter(p=>p.line_id===l.id);const d=ps.filter(p=>p.status==="done").length;return ps.length>1?` ${d}/${ps.length}`:"";})():"";
  return `<span class="chip ${l.stage_status==='working'?'working':''}">${I[l.stage]||""} ${t(STAGE_KEY[l.stage]||l.stage)}${partsInfo}${w?` · ${esc(wname(w))}`:""}</span>`;
}
function orderCard(o){
  const ls=DB.lines.filter(l=>l.order_id===o.id);
  const openIds=JSON.parse(localStorage.getItem("vv_open")||"[]");
  const isOpen=openIds.includes(o.id);
  const doneN=ls.filter(l=>l.stage==="shipped").length;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;cursor:pointer" onclick="toggleOrder('${o.id}')">
      <div class="title">${t("order")} #${o.order_no} <span class="chip wine">${esc(o.order_type)}</span> <span class="muted">${doneN}/${ls.length}</span></div>
      <div class="muted">${o.due_date?(isLate(o)?`<span class="late">${t("late")} ${fmtD(o.due_date)}</span>`:`${t("due")} ${fmtD(o.due_date)}`):""} ${isOpen?"▾":"▸"}</div>
    </div>
    ${isOpen?`
      ${o.customer_ref?`<div class="muted">${t("invoice")}: ${esc(o.customer_ref)}</div>`:""}
      ${o.repair_reason?`<div class="muted">${t("reason")}: ${esc(o.repair_reason)}</div>`:""}
      ${ls.map(l=>`<div class="lineitem">
        <div><b>${esc(pname(product(l.product_id)))}</b> <span class="muted">${esc(l.size||"")} ${esc(l.color||"")} × ${l.qty}</span>${l.custom_specs?` <span class="chip sage">${I.ruler}</span>`:""}</div>
        <div>${lineChip(l)} ${l.stage==="pack"&&session.role==="manager"?`<button class="btn btn-ok" style="padding:5px 10px;font-size:12px" onclick="shipLine('${l.id}')">${I.shipped}</button>`:""}</div>
      </div>`).join("")}
      ${session.role==="manager"&&o.status==="جاري"&&ls.length&&ls.every(l=>l.stage==="shipped")?`<button class="btn btn-ink btn-big" onclick="closeOrder('${o.id}')">${t("closeOrder")} ✓</button>`:""}
      ${session.role==="manager"&&o.status==="جاري"?`<div style="text-align:start;margin-top:6px"><button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="cancelOrder('${o.id}')">${t("cancel")}</button></div>`:""}
    `:""}
  </div>`;
}
function toggleOrder(id){
  let a=JSON.parse(localStorage.getItem("vv_open")||"[]");
  a = a.includes(id)? a.filter(x=>x!==id) : [...a,id];
  localStorage.setItem("vv_open",JSON.stringify(a)); render();
}
async function shipLine(id){await moveLine(id,"shipped");await refresh();}
async function closeOrder(id){await sb.from("orders").update({status:"مكتمل"}).eq("id",id);await refresh();}
async function cancelOrder(id){if(confirm("إلغاء الأمر كامل؟")){await sb.from("orders").update({status:"ملغي"}).eq("id",id);await refresh();}}

    <button class="btn btn-ghost btn-big" onclick="window._archQ=el('archQ').value;render()">${isAr()?"بحث":"Search"}</button>
  </div>
  ${list.length? list.map(orderCard).join("") : `<div class="empty">—</div>`}`;
}

  if(error) return alert(error.message);
  await loadAll(); el("setMsg").textContent=t("savedOk");
}

function captureOrder(){

  customModels=customModels.map((m,i)=>{

async function saveOrder(){
  captureOrder();
  const ty=window._otype||"إنتاج كمي";
  let reason=null;
  if(ty==="تصليح"){reason=el("o_reason").value; if(reason==="__other"){reason=prompt(isAr()?"اكتب السبب:":"Reason:"); if(!reason)return; await sb.from("repair_reasons").insert({label:reason});}}
  const {data:o,error}=await sb.from("orders").insert({order_type:ty, customer_ref:(ty==="طلب"||ty==="قياسات خاصة")?(el("o_ref")?.value||null):null, repair_reason:reason, due_date:el("o_due").value||null}).select().single();
  if(error) return alert(error.message);
  let rows=[];
  if(ty==="قياسات خاصة"){
    rows=customModels.filter(m=>m.product_id).map(m=>({order_id:o.id,product_id:m.product_id,qty:m.qty||1,color:m.color||null,size:isAr()?"خاص":"CUSTOM",
      custom_specs:{chest:m.chest,waist:m.waist,hips:m.hips,shoulder:m.shoulder,length:m.length,sleeve:m.sleeve,bottom:m.bottom,notes:m.notes},
      stage:startStageFor(m.product_id,ty)}));
  }else{
    rows=newLines.filter(l=>l.product_id).map(l=>({order_id:o.id,product_id:l.product_id,size:l.size||null,color:l.color||null,qty:l.qty||1,stage:startStageFor(l.product_id,ty)}));
  }
  if(!rows.length){await sb.from("orders").delete().eq("id",o.id);return alert(isAr()?"أضف قطعة واحدة على الأقل":"Add at least one item");}
  const {data:ins}=await sb.from("order_lines").insert(rows).select();
  for(const l of (ins||[]).filter(x=>x.stage==="sew")) await genParts(l.id,l,ty);
  newLines=[];customModels=[];window._otype="إنتاج كمي";mTab="board";localStorage.setItem("vv2_tab","board");
  await refresh();
}

async function makeJob(mode){
  const ids=[...document.querySelectorAll(".poolchk:checked")].map(c=>c.value);
  if(!ids.length) return alert(isAr()?"اختر القطع أولاً":"Select items");
  const vendor=el(mode==="emb"?"j_vendor":"x_vendor").value||null;
  const kind=mode==="ext"?"تنفيذ خارجي":(product(DB.lines.find(l=>l.id===ids[0]).product_id).embroidery_kind||"تطريز");
  const {data:j}=await sb.from("ext_jobs").insert({kind,vendor,line_ids:ids}).select().single();
  for(const id of ids) await sb.from("order_lines").update({stage_status:"sent"}).eq("id",id);
  await refresh(); printJob(j.id);
}
async function receiveJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  for(const id of (j.line_ids||[])){
    const l=DB.lines.find(x=>x.id===id); if(!l) continue;
    await moveLine(id, l.stage==="ext"? "qc" : nextStage("emb",product(l.product_id)));
  }
  await sb.from("ext_jobs").update({status:"received",returned_at:today()}).eq("id",jobId);
  await refresh();
}
function printJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId);
  const lines=(j.line_ids||[]).map(id=>DB.lines.find(l=>l.id===id)).filter(Boolean);
  const isExt=j.kind==="تنفيذ خارجي";
  const rows=lines.map(l=>{const p=product(l.product_id),o=order(l.order_id);
    return `<tr><td>${pimg(p)?`<img src="${esc(pimg(p))}" style="width:70px;height:70px;object-fit:cover;border-radius:8px">`:""}</td>
      <td><b>${esc(p.name)}</b><br><span style="color:#666">${esc(p.name_en||"")}</span></td>
      <td style="text-align:center;font-size:20px;font-weight:800">${esc(l.size||"—")}</td>
      <td style="text-align:center;font-size:20px;font-weight:800">${l.qty}</td>
      <td>#${o.order_no}</td></tr>`;}).join("");
  const total=lines.reduce((a,l)=>a+l.qty,0);
  const arts=[...new Set(lines.map(l=>product(l.product_id)).filter(p=>p.artwork_url).map(p=>p.id))].map(id=>{const p=product(id);
    return `<div style="margin-top:14px;page-break-inside:avoid"><b>${esc(p.name)}:</b>${p.embroidery_note?`<div>${esc(p.embroidery_note)}</div>`:""}<img src="${esc(p.artwork_url)}" style="max-width:300px;border:1px solid #ddd;border-radius:8px;margin-top:6px"></div>`;}).join("");
  const charts=isExt? [...new Set(lines.map(l=>l.product_id))].map(pid=>{const p=product(pid);const chart=p.size_chart||{};const sizes=Object.keys(chart);
    if(!sizes.length) return "";
    return `<div style="margin-top:14px;page-break-inside:avoid"><b>${esc(p.name)} — القياسات (سم):</b>
    <table><tr><th>القياس</th>${sizes.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>
    ${MEAS.map(m=>`<tr><td>${m[1]}</td>${sizes.map(s=>`<td>${esc(chart[s]?.[m[0]]||"—")}</td>`).join("")}</tr>`).join("")}</table>
    ${(p.patterns||[]).length?`<div>الباترونات: ${(p.patterns||[]).map(x=>`<a href="${esc(x.url)}">${esc(x.name)}</a>`).join(" · ")}</div>`:""}</div>`;}).join("") : "";
  const w=window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>Job Order</title>
  <style>body{font-family:Tajawal,Arial,sans-serif;padding:28px;color:#1C1B1A}
  table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #E6E1D8;padding:8px;text-align:right}
  .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1C1B1A;padding-bottom:12px}
  .lg{font-family:Arial;font-weight:700;letter-spacing:5px;font-size:22px}</style></head><body>
  <div class="hd"><div class="lg">VEEVOGUE</div><div style="text-align:left">JOB ORDER<br><b>${esc(j.kind)}</b></div></div>
  <p>المصدر: <b>${esc(j.vendor||"—")}</b> · التاريخ: ${esc(j.sent_at)} · الإجمالي: <b>${total}</b></p>
  <table><tr><th></th><th>المنتج</th><th>العمر</th><th>الكمية</th><th>الأمر</th></tr>${rows}</table>
  ${arts}${charts}
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

/* ---- الجودة (تبويب للمكتب) ---- */
function tabQuality(){
  const ls=DB.lines.filter(l=>l.stage==="qc" && activeLine(l));
  el("tabbody").innerHTML=`
    <div class="sechead">${I.qc} ${t("qc")} (${ls.length})</div>
    ${ls.length? ls.map(l=>{
      const p=product(l.product_id), o=order(l.order_id);
      return `<div class="wcard">
        <div class="wtop">${thumb(p)}
          <div><div class="title">${esc(pname(p))}</div>
          <div class="muted">#${o.order_no} — ${t("age")} ${esc(l.size||"—")} — ${t("qty")} <b>${l.qty}</b></div></div>
        </div>
        <div class="grid2" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-top:10px">
          <button class="btn btn-ok" onclick="qcResult('${l.id}','ok')">${I.done} ${t("ok")}</button>
          <button class="btn btn-warn" onclick="qcResult('${l.id}','clean')">${I.clean} ${t("clean")}</button>
          <button class="btn btn-warn" onclick="qcResult('${l.id}','iron')">${I.iron} ${t("iron")}</button>
          <button class="btn btn-bad" onclick="qcResult('${l.id}','fix')">${I.fix} ${t("fix")}</button>
        </div>
      </div>`;}).join("") : `<div class="empty">${t("nothingToCheck")}</div>`}`;
}
async function qcResult(lineId, result){
  const now=new Date().toISOString();
  await sb.from("stage_events").insert({line_id:lineId,stage:"qc",result,started_at:now,finished_at:now});
  if(result==="fix"){
    const l=DB.lines.find(x=>x.id===lineId);
    const lastSew=DB.events.filter(e=>e.line_id===lineId&&e.stage==="sew"&&e.worker_id&&e.finished_at).slice(-1)[0];
    await sb.from("order_lines").update({stage:"sew",stage_status:"waiting",claimed_by:null}).eq("id",lineId);
    await sb.from("line_parts").insert({line_id:lineId,part_ar:"إصلاح",part_en:"FIX",worker_id:lastSew?lastSew.worker_id:null});
  } else {
    await sb.from("order_lines").update({stage:"pack",stage_status:"waiting",claimed_by:null,
      prep_note: result==="ok"? null : result}).eq("id",lineId);
  }
  await refresh();
}

/* ---- العمال ---- */
function tabWorkers(){
  el("tabbody").innerHTML=`<div class="card">
    <div class="title">${t("workers")}</div>
    <div class="grid2"><div><label>${isAr()?"الاسم (عربي)":"Name (AR)"}</label><input id="w_name"></div>
    <div><label>${isAr()?"الاسم (إنجليزي)":"Name (EN)"}</label><input id="w_name_en" dir="ltr"></div></div>
    <label>${isAr()?"التخصصات":"Specialties"}</label>
    <div class="pillrow" id="specPills">${SPEC_LIST.map(k=>`<span class="pill" data-k="${k}" onclick="this.classList.toggle('on')">${isAr()?SPEC_LABEL[k][0]:SPEC_LABEL[k][1]}</span>`).join("")}</div>
    <label>${t("pin")}</label><input id="w_pin" inputmode="numeric">
    <button class="btn btn-wine btn-big" onclick="saveWorker()">${t("add")}</button>
  </div>
  ${DB.workers.filter(w=>w.active).map(w=>`<div class="card lineitem" style="border-top:0">
    <div><b>${esc(wname(w))}</b>
    <div class="pillrow">${(w.specialties||[]).map(k=>`<span class="chip">${I[k]||""} ${SPEC_LABEL[k]?(isAr()?SPEC_LABEL[k][0]:SPEC_LABEL[k][1]):k}</span>`).join("")} ${w.pin?`<span class="chip">🔒</span>`:""}</div></div>
    <div><button class="btn btn-ghost" onclick="editWorker('${w.id}')">${I.edit}</button>
    <button class="btn btn-ghost" onclick="stopWorker('${w.id}')">${t("stop")}</button>
    <button class="btn btn-ghost" onclick="delWorker('${w.id}')">${I.trash}</button></div>
  </div>`).join("")}
  <div class="card"><div class="title">${isAr()?"أسباب التصليح":"Repair reasons"}</div>
    ${DB.reasons.map(r=>`<div class="lineitem"><div style="${r.active?'':'text-decoration:line-through;color:#999'}">${esc(r.label)}</div>
      <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="toggleReason('${r.id}',${r.active})">${r.active?t("stop"):t("add")}</button></div>`).join("")}
    <div style="display:flex;gap:6px;margin-top:8px"><input id="newReason"><button class="btn btn-ghost" onclick="addReason()">${t("add")}</button></div>
  </div>`;
}
async function saveWorker(){
  const name=el("w_name").value.trim(); if(!name) return alert(isAr()?"اكتب الاسم":"Enter name");
  const specs=[...document.querySelectorAll("#specPills .pill.on")].map(x=>x.dataset.k);
  if(!specs.length) return alert(isAr()?"اختر تخصص":"Pick specialty");
  await sb.from("workers").insert({name, name_en:el("w_name_en").value||null, specialties:specs, pin:el("w_pin").value||null});
  await refresh();
}
function editWorker(id){
  const w=worker(id);
  openSheet(`<div class="title">${esc(wname(w))}</div>
    <div class="grid2"><div><label>AR</label><input id="ew_name" value="${esc(w.name)}"></div>
    <div><label>EN</label><input id="ew_name_en" dir="ltr" value="${esc(w.name_en||"")}"></div></div>
    <label>${isAr()?"التخصصات":"Specialties"}</label>
    <div class="pillrow" id="ewPills">${SPEC_LIST.map(k=>`<span class="pill ${(w.specialties||[]).includes(k)?'on':''}" data-k="${k}" onclick="this.classList.toggle('on')">${isAr()?SPEC_LABEL[k][0]:SPEC_LABEL[k][1]}</span>`).join("")}</div>
    <label>${t("pin")}</label><input id="ew_pin" value="${esc(w.pin||"")}">
    <button class="btn btn-wine btn-big" onclick="updateWorker('${id}')">${t("save")}</button>`);
}
async function updateWorker(id){
  const specs=[...document.querySelectorAll("#ewPills .pill.on")].map(x=>x.dataset.k);
  await sb.from("workers").update({name:el("ew_name").value, name_en:el("ew_name_en").value||null, specialties:specs, pin:el("ew_pin").value||null}).eq("id",id);
  closeSheet(); await refresh();
}
async function stopWorker(id){if(confirm("?")){await sb.from("workers").update({active:false}).eq("id",id); await refresh();}}
async function delWorker(id){if(confirm(isAr()?"حذف نهائي للعامل وكل بياناته؟":"Delete permanently?")){await sb.from("workers").delete().eq("id",id); await refresh();}}
async function addReason(){const tx=el("newReason").value.trim(); if(!tx)return; await sb.from("repair_reasons").insert({label:tx}); await refresh();}
async function toggleReason(id,cur){await sb.from("repair_reasons").update({active:!cur}).eq("id",id); await refresh();}

/* ---- الأداء ---- */
function tabPerf(){
  const done=DB.events.filter(e=>e.started_at&&e.finished_at&&e.worker_id);
  if(!done.length){el("tabbody").innerHTML=`<div class="empty">—</div>`; return;}
  const rows={};
  done.forEach(e=>{
    const k=e.worker_id+"|"+e.stage;
    rows[k]=rows[k]||{w:wname(worker(e.worker_id)), stage:t(STAGE_KEY[e.stage]||e.stage), n:0, total:0, est:0, estN:0};
    const r=rows[k]; r.n++; r.total+=mins(e.started_at,e.finished_at);
    const l=DB.lines.find(x=>x.id===e.line_id);
    if(l){const p=product(l.product_id);
      const est=e.stage==="cut"?p.est_cut_min: e.stage==="sew"?p.est_sew_min: null;
      if(est){r.est+=est*l.qty; r.estN++;}}
  });
  const fixes={};
  DB.events.filter(e=>e.result==="fix").forEach(e=>{
    const sews=DB.events.filter(x=>x.line_id===e.line_id&&x.stage==="sew"&&x.finished_at&&x.worker_id);
    if(sews.length){const wid=sews[sews.length-1].worker_id; fixes[wid]=(fixes[wid]||0)+1;}
  });
  const brk={};
  DB.breaks.filter(b=>b.ended_at).forEach(b=>{brk[b.worker_id]=(brk[b.worker_id]||0)+mins(b.started_at,b.ended_at);});
  el("tabbody").innerHTML=`<div class="card">
    <div class="title">${t("perf")}</div>
    <table><tr><th>${t("worker")}</th><th>—</th><th>#</th><th>${isAr()?"فعلي":"Actual"}</th><th>${isAr()?"تقديري":"Est."}</th></tr>
    ${Object.values(rows).map(r=>`<tr><td>${esc(r.w)}</td><td>${r.stage}</td><td>${r.n}</td><td>${Math.round(r.total/r.n)}</td><td>${r.estN?Math.round(r.est/r.estN):"—"}</td></tr>`).join("")}</table>
    ${Object.keys(fixes).length?`<div class="title" style="margin-top:14px">${t("fix")}</div>
    <table>${Object.entries(fixes).map(([wid,n])=>`<tr><td>${esc(wname(worker(wid)))}</td><td>${n}</td></tr>`).join("")}</table>`:""}
    ${Object.keys(brk).length?`<div class="title" style="margin-top:14px">${t("breakStart")}</div>
    <table>${Object.entries(brk).map(([wid,m])=>`<tr><td>${esc(wname(worker(wid)))}</td><td>${m} ${t("minutes")}</td></tr>`).join("")}</table>`:""}
  </div>`;
}

/* ================= شاشة العامل ================= */
function renderWorker(){
  const w=worker(session.workerId);
  const specs=w.specialties||[];
  const onBreak=!!myBreak();
  let html=`${breakBar()}
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn btn-ghost" onclick="refresh()">↻ ${t("refresh")}</button>
      ${!onBreak?`<button class="btn btn-line" onclick="startBreak()">${I.coffee} ${t("breakStart")}</button>`:""}
    </div>`;
  if(onBreak){ el("app").innerHTML=html; return; }
  if(specs.includes("cut")) html+=workerSection("cut", cutTasks(w));
  if(specs.includes("sew")) html+=workerSection("sew", sewTasks(w));
  if(specs.includes("pack")) html+=workerSection("pack", packTasks(w));
  el("app").innerHTML=html;
}
function cutTasks(w){
  return DB.lines.filter(l=>l.stage==="cut" && activeLine(l) && (!l.claimed_by||l.claimed_by===w.id)).map(l=>workerCard(l,"cut",null));
}
function sewTasks(w){
  const out=[];
  DB.lines.filter(l=>l.stage==="sew" && activeLine(l)).forEach(l=>{
    DB.parts.filter(p=>p.line_id===l.id && p.status!=="done" && (!p.worker_id||p.worker_id===w.id)).forEach(p=>out.push(workerCard(l,"sew",p)));
  });
  return out;
}
function packTasks(w){
  return DB.lines.filter(l=>l.stage==="pack" && activeLine(l) && (!l.claimed_by||l.claimed_by===w.id)).map(l=>workerCard(l,"pack",null));
}
function workerSection(key, cards){
  return `<div class="sechead">${I[key]} ${t(key)} <span class="muted" style="letter-spacing:0">(${cards.length})</span></div>`
    + (cards.length? cards.join("") : `<div class="empty">${t("noTasks")} 👌</div>`);
}
function specsTable(cs){
  if(!cs) return "";
  const rows=MEAS.filter(m=>cs[m[0]]).map(m=>`<tr><td>${isAr()?m[1]:m[2]}</td><td><b>${esc(cs[m[0]])}</b></td></tr>`).join("");
  const extra=[cs.sleeve?`${isAr()?"الكم":"Sleeve"}: <b>${esc(cs.sleeve)}</b>`:"",cs.bottom?`${esc(cs.bottom)}`:""].filter(Boolean).join(" — ");
  return `<div class="note-box"><b>${I.ruler}</b><table>${rows}</table>${extra?`<div>${extra}</div>`:""}${cs.notes?`<div>📝 ${esc(cs.notes)}</div>`:""}</div>`;
}
function workerCard(l, mode, part){
  const p=product(l.product_id), o=order(l.order_id);
  const working = part? part.status==="working" : (l.stage_status==="working" && l.claimed_by===session.workerId);
  const ev = DB.events.find(e=> (part? e.part_id===part.id : (e.line_id===l.id&&!e.part_id)) && e.stage===l.stage && e.started_at && !e.finished_at);
  const m = ev? mins(ev.started_at,new Date().toISOString()) : 0;
  const est = mode==="cut"? p.est_cut_min : mode==="sew"? p.est_sew_min : null;
  const over = est? m > est*(l.qty||1) : m > 480;
  const meta = `<div class="wmeta">
      ${mode==="cut"?`<div><div class="bignum">${esc(l.size||"—")}</div><div class="biglabel">${t("age")}</div></div>`:""}
      <div><div class="bignum">${l.qty}</div><div class="biglabel">${t("qty")}</div></div>
      ${mode!=="cut"&&l.size?`<div><div class="bignum" style="font-size:22px">${esc(l.size)}</div><div class="biglabel">${t("age")}</div></div>`:""}
      ${o.due_date?`<div><div class="bignum" style="font-size:22px;${isLate(o)?'color:var(--bad)':''}">${fmtD(o.due_date)}</div><div class="biglabel">${t("due")}</div></div>`:""}
      ${l.color?`<div><div class="bignum" style="font-size:18px">${esc(l.color)}</div><div class="biglabel">${t("color")}</div></div>`:""}
    </div>`;
  return `<div class="wcard">
    <div class="wtop">${thumb(p)}
      <div style="flex:1">
        <div class="title">${esc(pname(p))} ${part?`<span class="chip">${I.sew} ${esc(isAr()?part.part_ar:part.part_en)}</span>`:""}</div>
        <div class="muted">#${o.order_no} ${o.order_type==="تصليح"?"· "+I.fix:""}</div>
        ${mode==="cut"?`<button class="btn btn-ghost" style="padding:6px 12px;font-size:13px;margin-top:4px" onclick="showChart('${p.id}','${esc(l.size||"")}')">${I.ruler} ${t("sizeChart")}</button>`:""}
      </div>
    </div>
    ${meta}
    ${mode==="pack"&&l.prep_note?`<div class="note-box">${l.prep_note==="clean"?I.clean+" "+t("clean"):I.iron+" "+t("iron")}</div>`:""}
    ${specsTable(l.custom_specs)}
    ${o.repair_reason?`<div class="note-box">${I.fix} ${esc(o.repair_reason)}</div>`:""}
    ${ev?`<div class="timer ${over?'t-late':'t-ok'}">⏱ ${m} ${t("minutes")}</div>`:""}
    ${working? `<button class="btn btn-ok btn-big" onclick="wDone('${l.id}','${part?part.id:""}')">${I.done} ${t("done")}</button>`
             : `<button class="btn btn-ink btn-big" onclick="wStart('${l.id}','${part?part.id:""}')">${I.play} ${t("start")}</button>`}
  </div>`;
}
async function wStart(lineId, partId){
  if(myBreak()) return alert(t("onBreak"));
  const l=DB.lines.find(x=>x.id===lineId);
  if(partId){
    await sb.from("line_parts").update({status:"working",worker_id:session.workerId,started_at:new Date().toISOString()}).eq("id",partId);
    await sb.from("stage_events").insert({line_id:lineId,part_id:partId,stage:"sew",worker_id:session.workerId,started_at:new Date().toISOString()});
  }else{
    await sb.from("order_lines").update({stage_status:"working",claimed_by:session.workerId}).eq("id",lineId);
    await sb.from("stage_events").insert({line_id:lineId,stage:l.stage,worker_id:session.workerId,started_at:new Date().toISOString()});
  }
  await refresh();
}
async function wDone(lineId, partId){
  const l=DB.lines.find(x=>x.id===lineId); const p=product(l.product_id);
  const now=new Date().toISOString();
  if(partId){
    await sb.from("line_parts").update({status:"done",finished_at:now}).eq("id",partId);
    const ev=DB.events.find(e=>e.part_id===partId&&e.started_at&&!e.finished_at);
    if(ev) await sb.from("stage_events").update({finished_at:now}).eq("id",ev.id);
    const remaining=DB.parts.filter(x=>x.line_id===lineId&&x.id!==partId&&x.status!=="done");
    if(!remaining.length) await moveLine(lineId, nextStage("sew",p));
  }else{
    const ev=DB.events.find(e=>e.line_id===lineId&&!e.part_id&&e.stage===l.stage&&e.started_at&&!e.finished_at);
    if(ev) await sb.from("stage_events").update({finished_at:now}).eq("id",ev.id);
    if(l.stage==="pack" && l.prep_note){
      await sb.from("order_lines").update({stage:"qc",stage_status:"waiting",claimed_by:null,prep_note:null}).eq("id",lineId);
    } else {
      await moveLine(lineId, nextStage(l.stage,p));
    }
  }
  await refresh();
}
</script>
